<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rounds: Urology Question Bank</title>
<meta name="description" content="Rounds is a free urology question bank from WARWIKI and WHITWIKI: board-style questions on reconstruction, URPS, general urology and urologic oncology, each with an explanation, a pearl and its source.">
<link rel="icon" href="/rounds/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/rounds/icon-180.png">
<link rel="manifest" href="/rounds/manifest.webmanifest">
<meta name="theme-color" content="#F2F4F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B1D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rounds">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wdth,wght@100,400;100,500;100,600;112,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap">
</head>
<body>
<style>
/* Layout: one narrow reading column; home is a chart-room summary, the question screen reads like a case sheet. */
:root{
  --bg:#F2F4F4; --panel:#FBFCFC; --ink:#1A2224; --ink2:#5E6A6D; --line:#D2DADB; --soft:#E6ECEC;
  --accent:#3E7C78; --accentInk:#FFFFFF; --accentSoft:#DCEBEA; --pearl:#C77A0A; --keyBg:rgba(199,122,10,.15); --ring:#D2DADB; --logo:#2E5E59; --logoTrack:#D2DADB;
  --ok:#3B6D11; --okSoft:#E7EFDB; --bad:#A32D2D; --badSoft:#F6E1DF; --warn:#946200; --warnSoft:#F4EAD3; --onc:#ECE4F3; --oncInk:#5E3A8C;
  --shadow:0 1px 2px rgba(27,26,23,.05); --glow:0 0 0 3px rgba(199,122,10,.18);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--word:"Archivo",-apple-system,BlinkMacSystemFont,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B1D; --panel:#1A2326; --ink:#E5ECED; --ink2:#94A3A6; --line:#2A3639; --soft:#1F2A2D;
  --accent:#7CC3BC; --accentInk:#0F1A1B; --accentSoft:#1E3335; --pearl:#EF9F27; --keyBg:rgba(239,159,39,.2); --ring:#2A3639;
  --ok:#97C459; --okSoft:#253019; --bad:#E57A6E; --badSoft:#3A1F1C; --warn:#E3B341; --warnSoft:#33280F; --onc:#2C2338; --oncInk:#C9AEEB;
  --shadow:none; --glow:0 0 0 3px rgba(239,159,39,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B1D; --panel:#1A2326; --ink:#E5ECED; --ink2:#94A3A6; --line:#2A3639; --soft:#1F2A2D;
  --accent:#7CC3BC; --accentInk:#0F1A1B; --accentSoft:#1E3335; --pearl:#EF9F27; --keyBg:rgba(239,159,39,.2); --ring:#2A3639;
  --ok:#97C459; --okSoft:#253019; --bad:#E57A6E; --badSoft:#3A1F1C; --warn:#E3B341; --warnSoft:#33280F; --onc:#2C2338; --oncInk:#C9AEEB;
  --shadow:none; --glow:0 0 0 3px rgba(239,159,39,.22); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background-color .3s var(--ease),color .3s var(--ease)}
.themeBtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink2);flex:none}
.themeBtn svg{width:18px;height:18px}
.hdrR{display:flex;align-items:center;gap:8px}
.dock{position:sticky;bottom:0;z-index:5;margin-top:4px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 28%)}
.dock .foot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dasharray:0 999}}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.lab{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
h1{font:600 22px/1.2 var(--sans);margin:0;letter-spacing:-.01em}
h2{font:600 16px/1.3 var(--sans);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:11px}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font:500 13px var(--sans);color:var(--ink2);transition:background .2s var(--ease),color .2s}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:104px;height:104px}
.ring .arc{animation:draw 1s var(--ease) both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat .v{font:600 24px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .v small{font:500 13px var(--sans);color:var(--ink2)}
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 70px;gap:12px;align-items:center;font-size:14px}
.row .n{font:500 12px var(--mono);color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .6s var(--ease)}
.bar .c{background:var(--ok)} .bar .w{background:var(--bad)}
.opts{display:flex;flex-direction:column;gap:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{text-align:left;border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:10px;font-size:13.5px;transition:all .18s var(--ease)}
.seg button:hover{border-color:var(--ink2)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accentSoft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button .k{font:500 11px var(--mono);color:var(--ink2);margin-left:6px;font-variant-numeric:tabular-nums}
.go{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accentInk);font-weight:600;padding:12px 20px;border-radius:11px;transition:transform .15s var(--ease),box-shadow .2s,opacity .2s;box-shadow:0 6px 16px -8px var(--accent)}
.btn:hover:not(:disabled){box-shadow:0 8px 22px -8px var(--accent)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn.wide{flex:1}
.ghost{border:1px solid var(--line);background:var(--panel);padding:11px 14px;border-radius:11px;font-weight:500;transition:transform .15s var(--ease)}
.ghost:active:not(:disabled){transform:scale(.97)}
.ghost:disabled{opacity:.35}
.note{font-size:13px;color:var(--ink2)}
/* quiz */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ticks{display:flex;gap:4px}
.ticks i{flex:1;max-width:28px;height:4px;border-radius:2px;background:var(--line);transition:background .3s var(--ease)}
:root{--cfK:var(--logo);--cfS:color-mix(in srgb,var(--logo) 45%,var(--panel));--cfG:var(--pearl)}
:root[data-theme="dark"]{--cfS:color-mix(in srgb,var(--logo) 55%,var(--ink2))}
.ticks i.cur{background:var(--accent)} .ticks i.ck{background:var(--cfK)} .ticks i.cs{background:var(--cfS)} .ticks i.cg{background:var(--cfG)} .ticks i.w{background:var(--bad)} .ticks i.a{background:var(--ink2)}
.cfKey{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:12.5px;color:var(--ink2)}
.cfKey span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cfKey i{width:9px;height:9px;border-radius:50%;flex:none}
.cfKey b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:var(--soft);color:var(--ink2)}
.chip.t{background:var(--warnSoft);color:var(--warn)}
.case{animation:rise .35s var(--ease) both}
.stem{font-size:16.5px;line-height:1.65;text-wrap:pretty}
.ask{font-weight:600;font-size:16.5px;line-height:1.5;margin-top:12px;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:9px}
.ch{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:13px 14px;width:100%;font-size:15.5px;line-height:1.45;transition:border-color .18s var(--ease),background .25s var(--ease),box-shadow .18s,transform .12s var(--ease)}
.ch:hover:not(.done){border-color:var(--ink2)}
.ch:active:not(.done){transform:scale(.985)}
.ch .L{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 12px var(--mono);color:var(--ink2);transition:all .2s var(--ease);margin-top:-2px}
.ch[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--glow)}
.ch[aria-pressed="true"] .L{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.ch.right{border-color:var(--ok);background:var(--okSoft);box-shadow:none}
.ch.right .L{background:var(--ok);border-color:var(--ok);color:var(--panel);animation:pop .4s var(--ease) both}
.ch.wrong{border-color:var(--bad);background:var(--badSoft);box-shadow:none}
.ch.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--panel);animation:pop .4s var(--ease) both}
.ch.done{cursor:default}
.ch.dim{opacity:.72}
.ch .why{grid-column:2;font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.5;animation:rise .35s var(--ease) both}
.reveal{border:1.5px dashed var(--line);background:none;border-radius:13px;padding:22px 14px;color:var(--ink2);width:100%;font-weight:500;transition:border-color .2s,color .2s}
.reveal:hover{border-color:var(--accent);color:var(--accent)}
.ans{display:flex;flex-direction:column;gap:16px;animation:rise .4s var(--ease) .05s both}
.verdict{display:flex;align-items:center;gap:10px;font:600 16px var(--sans)}
.verdict .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--panel);font-size:14px;animation:pop .45s var(--ease) both}
.verdict.c{color:var(--ok)} .verdict.c .dot{background:var(--ok)}
.verdict.w{color:var(--bad)} .verdict.w .dot{background:var(--bad)}
.verdict .lab{margin-left:auto}
.block{border-left:3px solid var(--line);padding:2px 0 2px 14px}
.block.pearl{border-color:var(--accent)}
.block.card{border-color:var(--warn);background:var(--warnSoft);border-radius:0 10px 10px 0;padding:10px 12px 10px 14px}
.block p{margin:5px 0 0;line-height:1.6}
mark.key{background:var(--keyBg);color:inherit;font-weight:600;padding:.05em .25em;margin:0 -.1em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.resetBtn{align-self:center;background:none;border:0;color:var(--bad);font:500 13px/1.4 var(--sans);padding:8px 10px;border-radius:8px;opacity:.85}
.resetBtn:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.quote{font-size:14px;color:var(--ink2);font-style:italic}
.src{font:500 12px var(--mono);color:var(--ink2);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.src a{text-decoration:none;font-weight:600}
.foot{display:flex;justify-content:space-between;gap:8px;align-items:center}
.foot .l{display:flex;gap:6px}
.icon{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:11px}
.icon svg{width:18px;height:18px}
.flag[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warnSoft)}
.clock{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2)}
/* summary + cards */
.sumTop{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.score{font:600 40px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;align-items:start}
.li:first-child{border-top:0}
.li .m{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--panel);background:var(--line)}
.li .m.c{background:var(--ok)} .li .m.w{background:var(--bad)}
.li .s{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cards{display:flex;flex-direction:column;gap:10px}
.tc{padding:16px 18px;border-left:3px solid var(--warn)}
.tc .nm{font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tc .nm a{text-decoration:none}
.tc p{margin:0;font-size:14px;line-height:1.6}
.hidden-card{cursor:pointer}
.hidden-card p{filter:blur(6px);user-select:none;transition:filter .3s}
.empty{color:var(--ink2);text-align:center;padding:28px 10px}
.fieldSw{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:13px}
.fieldSw button{border:0;background:none;padding:10px 8px;border-radius:10px;font:600 14px var(--sans);color:var(--ink2);display:flex;justify-content:center;align-items:baseline;gap:6px;transition:background .2s var(--ease),color .2s,box-shadow .2s}
.fieldSw button span{font:500 11px var(--mono);opacity:.7;font-variant-numeric:tabular-nums}
.fieldSw button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.fieldSw.sm button{padding:7px 6px;font-size:13px}
.topics{display:flex;flex-direction:column;gap:12px}
.area{display:flex;flex-direction:column;gap:6px}
.areaLab{align-self:flex-start;border:0;background:none;padding:0;font:600 12.5px var(--sans);color:var(--ink);display:flex;gap:8px;align-items:center}
.areaLab::before{content:"";width:12px;height:12px;border-radius:3px;border:1.5px solid var(--line);transition:all .15s}
.areaLab.on::before{background:var(--accent);border-color:var(--accent)}
.fd{font:500 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--soft);color:var(--ink2)}
.fd.oncology,.chip.onc{background:var(--onc);color:var(--oncInk)}
.fd.general{background:var(--accentSoft);color:var(--accent)}
.chip.core{background:var(--okSoft);color:var(--ok)}
.fieldSw{grid-template-columns:repeat(4,1fr)!important}
.doorSubs{margin-top:-4px}
.sdoor{font:600 16px/1.3 var(--sans);color:var(--ink);margin:22px 0 2px}
.sfield:first-child .sdoor{margin-top:6px}
.sfam{font:600 13px/1.3 var(--sans);color:var(--ink2);margin:14px 0 -6px}
.trow.solo{width:100%;padding:14px 0;border-top:0;border-bottom:1px solid var(--line)}
.trow.solo>span:first-child{font-weight:600}
@media (max-width:520px){.fieldSw button span{display:none}.fieldSw button{font-size:13px;padding:9px 2px}}
.rowh{margin-top:6px}
.panel.statsP{padding:0}
.statsHead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:none;padding:16px 20px;text-align:left}
.statsHead>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.statsHead .pv{font-weight:600}
.statsHead .chev{font-size:22px;color:var(--ink2);width:20px;text-align:center}
.statsBody{padding:0 20px 18px;animation:rise .25s var(--ease) both}
.pickRow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px}
.pickRow>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.pickRow .pv{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickRow .chev,.aexp .chev{font-size:20px;color:var(--ink2);line-height:1}
html.locked,html.locked body{overflow:hidden}
.sheetBg{position:fixed;inset:0;background:rgba(6,14,18,.45);z-index:20;animation:fade .2s ease both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .28s var(--ease) both;max-width:720px;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.shead h2{text-align:center}
.slink{border:0;background:none;color:var(--accent);font-size:15px;padding:6px 0;justify-self:start}
.slink.strong{font-weight:600;justify-self:end}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px max(16px,env(safe-area-inset-left,0px)) 10px}
.sfl{margin:14px 0 4px}
.sarea{border-bottom:1px solid var(--line)}
.arow{display:flex;align-items:center}
.aexp{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:14px 0;text-align:left}
.aexp .chev{transition:transform .2s var(--ease);width:12px}
.sarea.open .aexp .chev{transform:rotate(90deg)}
.aexp .al{font-weight:600;flex:1;min-width:0}
.ac{font:500 12px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.abox{border:0;background:none;padding:10px 0 10px 14px}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--accentInk);transition:all .15s}
.box.on,.box.some{background:var(--accent);border-color:var(--accent)}
.tlist{display:flex;flex-direction:column;padding:0 0 8px 22px;animation:rise .2s var(--ease) both}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;padding:11px 0;text-align:left;border-top:1px solid var(--soft)}
.trow:first-child{border-top:0}
.trow .tr{display:flex;align-items:center;gap:12px}
.sfoot{padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex}
.recall{display:flex;flex-direction:column;gap:10px;border:1.5px dashed var(--line);border-radius:13px;padding:14px}
.recall textarea{font:16px/1.5 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;width:100%}
.recall textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
@media (max-width:520px){
  .hero,.sumTop{gap:16px}
  .ring{width:84px;height:84px}
  .stats{gap:10px}
  .stat .v{font-size:21px}
  .row{grid-template-columns:minmax(0,1fr) 70px 64px}
  .stem,.ask{font-size:16px}
  .panel{padding:18px;border-radius:14px}
  .tabs button{padding:7px 10px}
}

/* ---- booklet layer (overrides above) ---- */
body{font-family:var(--sans)}
h1.logo{display:flex;align-items:center;font:700 36px/1 var(--word);font-stretch:112%;letter-spacing:.11em;color:var(--ink);margin:0}
h1.logo svg{width:.92em;height:.92em;margin:0 .07em 0 .03em}
@media (max-width:520px){h1.logo{font-size:30px}}
.panel{border-radius:8px;box-shadow:var(--shadow);background:var(--panel)}
.btn{border-radius:6px;box-shadow:none;letter-spacing:.01em}
.btn:hover:not(:disabled){box-shadow:none;filter:brightness(1.05)}
.ghost,.seg button,.pickRow,.tabs{border-radius:6px}
.tabs button{border-radius:5px}
.seg button[aria-pressed="true"]{box-shadow:none;background:var(--accentSoft);border-color:var(--accent)}
.fieldSw,.fieldSw button{border-radius:6px}
.chip{border-radius:3px;font-family:var(--sans);letter-spacing:.06em}
.chip.t{background:var(--soft);color:var(--ink)}
.chip.core{background:var(--accentSoft);color:var(--ink)}
.chip.bf{background:transparent;border:1px solid var(--pearl);color:var(--pearl)}
.qbody{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px}
.qn{font:600 18px/1.55 var(--serif);color:var(--accent)}
.stem{font:400 17.5px/1.62 var(--serif);text-wrap:pretty}
.ask{font:500 17.5px/1.55 var(--serif);margin-top:10px}
.choices{gap:2px;margin-left:34px}
.ch{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px;border:0;background:none;border-radius:4px;padding:8px 8px 8px 6px;font:400 17px/1.5 var(--serif);box-shadow:none}
.ch:hover:not(.done){background:var(--soft);border-color:transparent}
.ch .L{width:auto;height:auto;border:0;border-radius:0;display:block;font:400 17px/1.5 var(--serif);color:var(--ink2);margin:0;background:none!important;animation:none}
.ch[aria-pressed="true"]{background:var(--accentSoft);box-shadow:none}
.ch[aria-pressed="true"] .L{color:var(--ink)}
.ch.right{background:none;color:var(--ok);font-weight:500}
.ch.right .L{color:var(--ok)}
.ch.wrong{background:none;color:var(--bad)}
.ch.wrong .ct{text-decoration:line-through;text-decoration-thickness:1px}
.ch.wrong .L{color:var(--bad)}
.ch.dim{opacity:.62}
.ch .mk{margin-left:8px;font-family:var(--sans);font-weight:700}
.ch .why{grid-column:2;font:italic 400 15px/1.5 var(--serif);color:var(--ink2);margin-top:2px}
.ch.wrong .why,.ch.right .why{text-decoration:none}
.reveal,.recall{margin-left:34px;border-radius:6px}
.ans{gap:14px;border-radius:8px}
.verdict{font:600 17px/1.4 var(--serif);display:block}
.verdict.c{color:var(--ok)} .verdict.w{color:var(--bad)}
.ans .block{border-left:0;padding:0}
.ans .block p{font:400 16.5px/1.62 var(--serif)}
.ans .block .lab{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.block.pearl{border-left:2px solid var(--pearl)!important;padding:2px 0 2px 12px!important}
.block.pearl .lab{color:var(--pearl)!important}
.block.card{border:1px solid var(--line)!important;background:var(--soft)!important;border-radius:4px!important;padding:10px 12px!important}
.block.card p{font:500 15px/1.55 var(--sans)!important;font-variant-numeric:tabular-nums}
.quote{font:italic 400 15.5px/1.55 var(--serif)!important;color:var(--ink2);border-left:2px solid var(--line);padding-left:10px}
.src{font:500 12.5px var(--sans)}
.src a{color:var(--accent)}
.lab{font-family:var(--sans);font-weight:600;letter-spacing:.07em}
.dock .foot{border-radius:8px}
.tc{border-left:2px solid var(--pearl)!important;border-radius:4px}
.tc p{font-family:var(--sans);font-variant-numeric:tabular-nums}
.li .s{font-family:var(--serif);font-size:15px}
.score{font-family:var(--sans)}
.sheet{border-radius:12px 12px 0 0}
.box{border-radius:4px}
.exitBtn{border:0;background:none;padding:4px 0;font:600 13px var(--sans);color:var(--accent);letter-spacing:.02em}
.qbar{gap:12px}.qbar .lab{flex:1;text-align:center}
h1.logo{cursor:pointer}
.nRow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nIn{width:92px;font:500 14px var(--sans);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.nIn:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
.brand{flex-direction:column;align-items:flex-start;gap:3px}
.homeLink{font:600 11px var(--sans);letter-spacing:.08em;color:var(--ink2);text-decoration:none}
.homeLink:hover{color:var(--accent)}
.syncCode{text-align:center;font:700 26px var(--sans);font-stretch:112%;letter-spacing:.12em;color:var(--ink);padding:14px 0 4px;font-variant-numeric:tabular-nums}
.codeIn{flex:1;min-width:0;font:600 16px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.codeIn:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
.prow{justify-content:flex-start;gap:10px}
.prow .pn{flex:1;font-weight:500;text-align:left}
.prow .box{margin-left:auto}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.sw i{width:12px;height:22px;display:block}
@media (max-width:520px){.choices{margin-left:0}.reveal,.recall{margin-left:0}.qbody{grid-template-columns:26px minmax(0,1fr)}.stem,.ask{font-size:17px}.ch{font-size:16.5px}}
/* redraws in place (topic taps, area switches): no replayed entrances or ring draws (owner, Nov 16: picking topics was jerky on desktop) */
#sheetLayer.still .sheet,#sheetLayer.still .sheetBg,#sheetLayer.still .tlist:not(.fresh){animation:none}
#view.calm .arc,#view.calm .segIn,#view.calm .tRing,#view.calm .statsBody{animation:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.qimg{margin:14px 0 2px;display:flex;flex-direction:column;gap:6px}
.qimg .zoom{all:unset;cursor:zoom-in;display:block;align-self:flex-start;max-width:100%;border-radius:8px;overflow:hidden;background:#000;line-height:0}
.qimg .zoom:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.qimg img{display:block;max-width:100%;max-height:min(440px,60vh);width:auto;height:auto}
.qimg figcaption{font:400 11.5px/1.4 var(--sans);color:var(--ink2)}
.qimg figcaption a{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent)}
#zoomBg{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#zoomBg img{width:100%;height:100%;object-fit:contain}

/* ---- confidence buttons, Today, search, Your questions ---- */
.confBtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:9px 6px;border-radius:8px;border:1.5px solid var(--cbb,var(--cbc));background:var(--cbs);color:var(--cbc);font:600 15px/1.15 var(--sans);transition:transform .12s var(--ease),filter .15s,opacity .2s}
.cb.c0{--cbc:color-mix(in srgb,var(--cfG) 70%,var(--ink));--cbb:var(--cfG);--cbs:color-mix(in srgb,var(--cfG) 12%,var(--panel))}
.cb.c1{--cbc:color-mix(in srgb,var(--cfK) 72%,var(--ink2));--cbb:var(--cfS);--cbs:color-mix(in srgb,var(--cfK) 6%,var(--panel))}
.cb.c2{--cbc:var(--cfK);--cbb:var(--cfK);--cbs:color-mix(in srgb,var(--cfK) 13%,var(--panel))}
.cb:hover:not(:disabled){filter:brightness(1.06)}
.cb:active:not(:disabled){transform:scale(.97)}
.cb:disabled{opacity:.4;cursor:default}
.cb .bars{display:flex;align-items:flex-end;gap:3px;height:17px}
.cb .bars i{width:6px;border-radius:2px;background:currentColor;opacity:.22}
.cb .bars i:nth-child(1){height:7px}.cb .bars i:nth-child(2){height:12px}.cb .bars i:nth-child(3){height:17px}
.cb .bars i.on{opacity:1}
.cb .cl{display:flex;align-items:baseline;gap:6px}
.cb kbd{font:500 10.5px var(--mono);opacity:.7;display:none}
@media (hover:hover) and (pointer:fine){.cb kbd{display:inline}}
.dock .foot.two{flex-direction:column;align-items:stretch;gap:8px}
.dock .foot.two .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.confNote{font-size:12.5px;line-height:1.3;color:var(--ink2);text-align:right;min-width:0;flex:1 1 auto;text-wrap:balance} /* wraps on narrow phones instead of running past the dock (owner, Nov 16) */
.today{display:flex;align-items:center;justify-content:space-between;gap:14px}
.today .pv{font:600 18px/1.25 var(--sans);margin-top:2px}
.today .note{margin-top:3px}
.today .btn{flex:none;padding:11px 22px}
.searchBtn,.searchBox{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 13px;font-size:15px;color:var(--ink2);text-align:left}
.searchBtn svg,.searchBox svg{flex:none;width:18px;height:18px}
.searchBox input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);outline:none;font-size:16px}
.searchBox:focus-within{border-color:var(--accent);box-shadow:var(--glow)}
.qrows{padding:2px 14px}
.qrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:start;padding:13px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;color:var(--ink)}
.qrow:first-child{border-top:0}
.qrow>i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--line)}
.qrow>i.c{background:var(--ok)}.qrow>i.w{background:var(--bad)}.qrow>i.g{background:var(--warn)}
.qrow .qt{font:400 14.5px/1.42 var(--serif);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.qrow .qm{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.qrow .chev{font-size:20px;line-height:1.2}
.viewHead{display:flex;align-items:center;gap:10px}
.viewHead h2{font:600 19px var(--sans);margin:0}
.more{width:100%}


/* ---- desktop: wider canvas, two columns, larger type (phone layout unchanged) ---- */
.navP{display:flex;flex-direction:column;gap:14px}
.navH{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.navGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:340px;overflow-y:auto;padding:2px}
.navGrid button{position:relative;height:40px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font:600 13.5px var(--sans);font-variant-numeric:tabular-nums;color:var(--ink2);transition:border-color .15s var(--ease),background .2s var(--ease),transform .12s var(--ease)}
.navGrid button:hover{border-color:var(--ink2);color:var(--ink)}
.navGrid button:active{transform:scale(.94)}
.navGrid button.a{background:var(--soft);color:var(--ink)}
.navGrid button.c{background:var(--okSoft);border-color:transparent;color:var(--ok)}
.navGrid button.w{background:var(--badSoft);border-color:transparent;color:var(--bad)}
.navGrid button.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.navGrid button.f::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink2)}
.keys kbd{font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;margin-right:3px;color:var(--ink);background:var(--bg)}
.oc{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:1080px){
  .wrap{max-width:1240px;padding-block:32px 72px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));gap:28px}
  h1.logo{font-size:44px}
  .homeLink{font-size:12px}
  .themeBtn{width:42px;height:42px}
  .fieldSw{padding:5px}
  .fieldSw button{padding:13px 10px;font-size:15.5px}
  .fieldSw button span{font-size:12px}
  .panel{padding:26px 30px}
  .hBand,.hGrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:stretch}
  .hGrid{align-items:start}
  .hero{gap:40px}
  .ring{width:150px;height:150px}
  .stats{gap:28px}
  .stat .lab{font-size:12px}
  .stat .v{font-size:40px;margin-top:6px}
  .stat .v small{font-size:15px}
  .today{flex-direction:column;align-items:stretch;justify-content:space-between;gap:20px}
  .today .pv{font-size:28px;margin-top:6px;letter-spacing:-.01em}
  .today .note{font-size:14px;margin-top:6px}
  .today .btn{padding:14px 22px;font-size:16px}
  .hSide{display:flex;flex-direction:column;gap:16px;min-width:0}
  .hSide .note{line-height:1.6}
  .opts h2{font-size:22px;letter-spacing:-.01em}
  .opts.wideOpts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:40px;row-gap:24px}
  .opts.wideOpts>h2,.opts.wideOpts>.go{grid-column:1/-1}
  .opts .go .btn{padding:15px 22px;font-size:16px}
  .seg button{padding:9px 14px;font-size:14px}
  .pickRow{padding:14px 16px}
  .searchBtn{padding:14px 16px}
  .statsHead{padding:20px 24px}
  .statsBody{padding:0 24px 22px}
  .hSide .row{grid-template-columns:minmax(0,1fr) 90px 60px}
  .qbar .lab{font-size:12px}
  .qGrid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:44px;align-items:start}
  .qMain{display:flex;flex-direction:column;gap:18px;min-width:0}
  .qRail{display:flex;flex-direction:column;gap:16px;min-width:0}
  .qbody{grid-template-columns:36px minmax(0,1fr)}
  .qn{font-size:20px}
  .stem{font-size:20px;line-height:1.62}
  .ask{font-size:20px;margin-top:14px}
  .choices{margin-left:36px;gap:4px}
  .ch{font-size:19px;padding:10px 12px 10px 8px;grid-template-columns:38px minmax(0,1fr)}
  .ch .L{font-size:19px}
  .ch .why{font-size:16px}
  .reveal,.recall{margin-left:36px}
  .qimg img{max-height:min(560px,62vh)}
  .ans .block p{font-size:17px}
  .verdict{font-size:19px}
  .cb{min-height:62px;font-size:16px}
  .sumTop{gap:36px}
  .score{font-size:56px}
  .narrow{max-width:880px;width:100%;margin:0 auto}
  .qrow .qt{font-size:16px}
  .sheet{top:7vh;bottom:auto;max-height:86vh;max-width:680px;border-radius:12px;box-shadow:0 24px 60px -12px rgba(0,0,0,.35)}
  .sfoot{border-radius:0 0 12px 12px}
}

/* ---- site bar: a quiet line linking back into the site; Rounds stays the main thing on screen ---- */
.siteBar{padding-top:env(safe-area-inset-top,0px)}
.sbIn{max-width:1180px;margin:0 auto;min-height:40px;display:flex;align-items:center;gap:14px;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.sbTitle{font:600 11.5px/1 var(--sans);letter-spacing:.08em;color:var(--ink2);text-decoration:none;flex:none}
.sbTitle:hover{color:var(--accent)}
.sbNav{display:flex;gap:2px;flex-wrap:wrap;min-width:0}
.sbNav a{font:500 12.5px/1 var(--sans);color:var(--ink2);text-decoration:none;padding:6px 8px;border-radius:6px;white-space:nowrap;opacity:.85}
.sbNav a:hover{color:var(--accent);opacity:1}
.sbNav a[aria-current="page"]{color:var(--ink);font-weight:600;opacity:1}
.sbMenu{display:none;margin-left:auto;border:0;background:none;padding:6px 2px;font:500 12.5px/1 var(--sans);color:var(--ink2)}
.sbBack{margin-left:auto;font:500 12.5px/1.2 var(--sans);color:var(--ink2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sbBack:hover{color:var(--accent)}
body.hasBar .homeLink{display:none}
/* during questions: only the site name and the way back */
body.inQuiz .sbNav,body.inQuiz .sbMenu{display:none}
@media (max-width:760px){
  .sbIn{flex-wrap:wrap;gap:4px 12px}
  .sbNav{display:none;order:3;flex-basis:100%;margin:0 -8px 2px}
  .sbMenu{display:block}
  .sbBack:not([hidden])~.sbMenu{margin-left:12px}
  body.sbOpen .sbNav{display:flex}
  body.inQuiz.sbOpen .sbNav{display:none}
}
.fromPage{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fromPage .lab{margin-bottom:4px}
.fromPage b{font:600 16px/1.3 var(--sans)}

/* ---------- game pilot ---------- */
.ch.right{background:linear-gradient(var(--okSoft),var(--okSoft)) no-repeat 0 0/100% 100%}
.ch.right.fx{animation:sweep .6s var(--ease) .05s both}
.ch.wrong.fx{animation:shake .36s var(--ease)}
@keyframes sweep{from{background-size:0% 100%}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
.segIn{animation:draw .5s var(--ease) both}
#toasts{position:fixed;bottom:calc(112px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 14px/1.3 var(--sans);text-align:center;animation:toastIn .4s var(--ease) both;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.toast .lab{color:color-mix(in srgb,var(--bg) 72%,var(--ink));font-size:10px}
.toast.out{opacity:0;transform:translateY(6px)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}}
.rk{display:inline-block;margin-left:7px;font:600 10.5px/1 var(--sans);letter-spacing:.03em;padding:3px 6px;border-radius:4px;background:var(--soft);color:var(--ink2);vertical-align:1px}
.rk.r2{background:var(--accentSoft);color:var(--ink)}
.rk.r3{background:color-mix(in srgb,var(--cfK) 18%,var(--panel));color:var(--cfK)}
.rk.r4{background:var(--cfK);color:var(--panel)}
.rkKey{margin:0 0 14px}
.tMain{display:flex;gap:16px;align-items:center;min-width:0}
.tRing{width:60px;height:60px;flex:none}
.tRing .arc{animation:draw .9s var(--ease) both}
.tRing.met{animation:pop .5s var(--ease)}
.goalBtn{border:0;background:none;padding:6px 0 0;font:500 12.5px var(--sans);color:var(--accent)}
.goalEd{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center}
.goalEd button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px;font:500 13px var(--sans);color:var(--ink2);font-variant-numeric:tabular-nums}
.goalEd button[aria-pressed="true"]{background:var(--accentSoft);border-color:var(--accent);color:var(--ink)}
.goalEd .note{flex-basis:100%;margin-top:4px}
.mm .pv{font:600 18px/1.25 var(--sans)}
.mm .btn.ghost{color:var(--ink);background:var(--panel);border:1px solid var(--line);box-shadow:none}
.mm .btn.ghost:hover{border-color:var(--accent)}
.party{font:600 15px var(--sans);color:var(--cfK);margin-top:8px}
.note.up{color:var(--ink)}
@media (max-width:520px){.today{flex-direction:column;align-items:stretch;gap:14px}.today .btn{width:100%}}

/* ---------- New block: wheels and More options ---------- */
.opts.simple{gap:18px}
.moreRow{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0 0;color:var(--ink2);font:500 13.5px var(--sans);text-align:left}
.moreRow:hover{color:var(--ink)}
.moreBody{display:flex;flex-direction:column;gap:18px}
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wheelBox{position:relative}
.wheel{height:132px;overflow-y:auto;scroll-snap-type:y mandatory;padding:44px 0;box-sizing:border-box;scrollbar-width:none;overscroll-behavior:contain;border:1px solid var(--line);border-radius:6px;background:var(--panel);outline:none;-webkit-mask-image:linear-gradient(transparent,#000 34%,#000 66%,transparent);mask-image:linear-gradient(transparent,#000 34%,#000 66%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus-visible{border-color:var(--accent)}
.wi{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font:500 20px var(--sans);font-variant-numeric:tabular-nums;color:var(--ink2);cursor:pointer;user-select:none;transition:color .15s var(--ease)}
.wi[aria-selected="true"]{color:var(--ink);font-weight:600}

async function connect(){
  const timer=setTimeout(()=>{if(S.store==="loading"){S.store="local";render()}},10000);
  try{
    if(!window.claude||!window.claude.use){clearTimeout(timer);S.store="local";render();if(syncCode)syncPull();return}
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){clearTimeout(timer);S.store="local";render();return}
    const id=await user.id();
    S.col=db.collection("data/users/"+id+"/rounds/progress");
    const snap=await S.col.get();
    clearTimeout(timer);
    const remote={};snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data()});
    // reset marker: drop anything older than the newest reset on either side
    const R=Math.max(resetAt(S.prog),resetAt(remote));
    if(R){for(const k of Object.keys(remote)){if(k!=="_reset"&&((remote[k]&&remote[k].at)||0)<=R){delete remote[k];delDoc(k)}}prune(S.prog,R);remote._reset={at:R};S.col.doc("_reset").set({at:R}).catch(()=>{})}
    // merge: keep whichever record has more attempts / newer
    const local=S.prog;
    for(const k of Object.keys(local)){
      const a=local[k],b=remote[k];
      if(k==="_days"&&b){const m={...b};for(const [d,v] of Object.entries(a))if(d!=="at")m[d]=Math.max(v,m[d]||0);m.at=Date.now();remote[k]=m;S.col.doc(k).set(m).catch(()=>{});continue}
      if(!b||(a.at||0)>(b.at||0)){remote[k]=a;S.col.doc(k).set(a).catch(()=>{})}
    }
    S.prog=remote;S.store="account";LS.put("rounds-prog",S.prog);render();
  }catch(e){clearTimeout(timer);S.store="local";render()}
}
function delDoc(k){try{const d=S.col.doc(k);(d.delete?d.delete():d.set({at:0})).catch(()=>{})}catch(e){}}

function save(id){

function record(q,ok,conf,pick){
  const p=S.prog[q.id]||{n:0,right:0,ivl:0};
  p.n++; if(ok)p.right++;
  p.last=ok?"c":"w"; p.at=Date.now();
  if(pick!=null)p.pick=pick;
  if(conf!=null)p.conf=conf;else delete p.conf;
  p.mis=!ok&&conf===2;
  /* review interval: wrong or guessed comes back tomorrow; unsure grows slowly; knew it grows fast */
  p.ivl=!ok||conf===0?1:conf===1?Math.min(Math.max(2,Math.round((p.ivl||1)*1.5)),60):(p.ivl?Math.min(Math.round(p.ivl*2.5),120):3);

}

/* Correct answers by how sure you were: Knew it (logo color), Fairly sure (lighter tint, also answers saved before confidence existed), Guessed (amber), drawn like the O in the logo. */
const confOf=c=>c===2?"k":c===0?"g":"s";
const CF=[["k","var(--cfK)","Knew it"],["s","var(--cfS)","Fairly sure"],["g","var(--cfG)","Guessed"]];

  const arcs=CF.map(([k,col])=>{const n=cnt[k];if(!n||!den)return"";const len=c*n/den,T=.9*right/den,dur=(T*len/(c*frac)).toFixed(3),dl=(T*off/(c*frac)).toFixed(3),el=`<circle class="arc" style="animation:draw ${dur}s linear ${dl}s both" cx="48" cy="48" r="${r}" fill="none" stroke="${col}" stroke-width="${W}" stroke-dasharray="${len} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 48 48)"/>`;off+=len;return el}).join("");
  const aria=`${Math.round(frac*100)} percent correct${right?`: knew it ${cnt.k}, fairly sure ${cnt.s}, guessed ${cnt.g}`:""}`;
  return `<svg class="ring" viewBox="0 0 96 96" role="img" aria-label="${aria}"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--logoTrack)" stroke-width="${W}"/>${arcs}<text x="48" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600" font-size="21" fill="var(--ink)">${label??Math.round(frac*100)+"%"}</text><text x="48" y="66" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8.5" letter-spacing=".8" fill="var(--ink2)">${sub||"CORRECT"}</text></svg>`;
}
const cfKey=cnt=>cnt.k+cnt.s+cnt.g?`<div class="cfKey" aria-hidden="true">${CF.map(([k,col,l])=>`<span><i style="background:${col}"></i>${l} <b>${cnt[k]}</b></span>`).join("")}</div>`:"";
function confCount(list){const cnt={k:0,s:0,g:0};list.forEach(q=>{const p=S.prog[q.id];if(p&&p.n&&p.last==="c")cnt[confOf(p.conf)]++});return cnt}

}

function initWheel(w){w.dataset.init=1;const H=44,last=w.children.length-1;let t,touched=false;const home=()=>{if(!touched)w.scrollTop=(+w.dataset.sel||0)*H};home();requestAnimationFrame(home);setTimeout(home,250);
  ["pointerdown","wheel","touchstart","keydown"].forEach(ev=>w.addEventListener(ev,()=>{touched=true},{passive:true}));
  const mark=i=>[...w.children].forEach((c,k)=>c.setAttribute("aria-selected",String(k===i)));
  w.addEventListener("scroll",()=>{const i=Math.max(0,Math.min(last,Math.round(w.scrollTop/H)));mark(i);clearTimeout(t);t=setTimeout(()=>{if(touched&&+w.dataset.sel!==i){w.dataset.sel=i;wheelSet(w.dataset.wheel,i)}},110)},{passive:true});

}

/* clinical ranks per topic, from each question's latest answer */
const RANKS=["Intern","Resident","Chief","Fellow","Attending"];
const RANK_RULE=[null,{cov:.25,acc:.6},{cov:.5,acc:.7},{cov:.75,acc:.8,kn:.5},{cov:.9,acc:.85,kn:.7,mis:.05}];
function rankOf(id){let total=0,used=0,c=0,k=0,mis=0;
  S.qs.forEach(q=>{if(q.topic!==id)return;total++;const p=S.prog[q.id];if(!p||!p.n)return;used++;if(p.last==="c"){c++;if(p.conf===2)k++}if(p.mis)mis++});
  if(!used)return 0;const cov=used/total,acc=c/used,kn=c?k/c:0,mr=mis/used;let r=0;
  for(let i=1;i<RANK_RULE.length;i++){const R=RANK_RULE[i];if(cov>=R.cov&&acc>=R.acc&&(R.kn==null||kn>=R.kn)&&(R.mis==null||mr<=R.mis))r=i;else break}
  return r}
function rankSnap(b){const o={};b.ids.forEach(id=>{const t=S.byId[id]&&S.byId[id].topic;if(t&&o[t]==null)o[t]=rankOf(t)});return o}
function rankLine(){let top=0;TOPICS_().forEach(t=>{if(S.qs.some(q=>q.topic===t.id&&inField(q))&&rankOf(t.id)>=2)top++});return top?top+" topic"+(top===1?"":"s")+" at Chief or above · ":""}
function gameAfter(q,ok,conf,r0,d0){const b=S.block,tutor=b.mode==="tutor";
  if(tutor){S.fx={id:q.id,ok,conf};if(!RM()&&navigator.vibrate)try{navigator.vibrate(ok?12:[18,60,18])}catch(e){}
    const r1=rankOf(q.topic);if(r1>r0)toast(topicLabel(q.topic)+": "+RANKS[r1],"New rank")}
  else S.fx={id:q.id,seg:true};
  const g=goalN(),d1=days()[dayKey()]||0;if(d0<g&&d1>=g){S.goalJust=true;toast("Daily goal met",g+" questions today")}}
function gameFinish(b){if(b.gameDone)return;b.gameDone=1;
  const ans=b.ids.filter(id=>b.done[id]!=null),c=ans.filter(id=>b.done[id]).length,f=ans.length?c/ans.length:0;
  b.ups=Object.entries(b.r0||{}).map(([t,r])=>[t,rankOf(t),r]).filter(x=>x[1]>x[2]);
  if(b.browse)return;
  if(ans.length>=5&&c===ans.length)b.party="Perfect block";
  else if(ans.length>=10&&G.bestPct>0&&f>G.bestPct)b.party="New personal best";
  if(ans.length>=10&&f>G.bestPct){G.bestPct=f;putG()}}

  return bits.join("")}

const GOALS=[5,10,15,20,30,40];
const goalN=()=>{const v=S.set.goal||20;return GOALS.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a)};let TODAY_N=20,TODAY_DUE=15;

function weakTopics(){
  return TOPICS_().map(t=>({id:t.id,label:t.label,...tally(S.qs.filter(q=>q.topic===t.id&&inField(q)))})).filter(x=>x.used>=3&&x.total>x.used).sort((a,b)=>a.c/a.used-b.c/b.used||b.total-a.total).slice(0,3);
}
function todayPlan(){

  const due=S.qs.filter(q=>{const p=S.prog[q.id];return inField(q)&&p&&p.n&&p.due<=now}).sort((a,b)=>S.prog[a.id].due-S.prog[b.id].due);

function todayIds(){

  const picked=new Set(pl.due.slice(0,pl.nDue).map(q=>q.id));
  const take=(arr,n)=>{for(const q of shuffle(arr.slice())){if(n<=0)break;if(!picked.has(q.id)){picked.add(q.id);n--}}return n};

}

  if(t.id==="closeSheet"||t.id==="closeSheet2"){S.sheet=false;render();return}
  if(t.dataset.expand){S.open=S.open||{};S.open[t.dataset.expand]=!S.open[t.dataset.expand];if(S.open[t.dataset.expand])S.justOpened=t.dataset.expand;S.sheetOnly=true;render();return}
  if(t.id==="tabHome"){S.view=S.block&&!S.block.finished?"quiz":(S.block&&S.block.finished&&S.view==="cards"?"home":"home");render();return}
  if(t.id==="tabCards"){S.view="cards";render();return}
  if(t.id==="theme"){S.sheet="theme";render();return}
  if(t.dataset.mode){theme=t.dataset.mode;LS.put("rounds-theme",theme);applyTheme();render();return}
  if(t.dataset.palette){palette=t.dataset.palette;LS.put("rounds-palette",palette);applyTheme();render();return}
  if(t.dataset.multi){const k=t.dataset.multi,v=t.dataset.v;let a=S.set[k].slice();if(v==="__all")a=[];else a=a.includes(v)?a.filter(x=>x!==v):a.concat(v);S.set[k]=a;LS.put("rounds-set",S.set);S.sheetOnly=!!t.closest(".sheet");render();return}
  if(t.dataset.area){const ids=((dGroups().find(x=>x.id===t.dataset.area)||{}).topics||[]).filter(id=>S.qs.some(q=>q.topic===id&&inField(q)));const all=ids.every(i=>S.set.topics.includes(i));S.set.topics=all?S.set.topics.filter(i=>!ids.includes(i)):[...new Set(S.set.topics.concat(ids))];LS.put("rounds-set",S.set);S.sheetOnly=true;render();return}
  if(t.dataset.door){S.set.door=t.dataset.door;S.set.sub=[];pruneTopics();LS.put("rounds-set",S.set);render();return}
  if(t.dataset.sub){const v=t.dataset.sub;S.set.sub=v==="__all"?[]:S.set.sub.includes(v)?S.set.sub.filter(x=>x!==v):S.set.sub.concat(v);pruneTopics();LS.put("rounds-set",S.set);render();return}
  if(t.dataset.set){let v=t.dataset.v;if(v==="true")v=true;else if(v==="false")v=false;else if(/^\d+$/.test(v))v=+v;S.set[t.dataset.set]=v;if(t.dataset.set==="mode"&&S.set.n>maxN(v))S.set.n=maxN(v);LS.put("rounds-set",S.set);render();return}
  if(t.id==="goalEdit"){S.goalEdit=!S.goalEdit;render();return}
  if(t.dataset.goal){S.set.goal=+t.dataset.goal;LS.put("rounds-set",S.set);render();return}
  if(t.id==="startMM"){const l=mmList().slice(0,10).map(q=>q.id);if(l.length){startIds(l,"tutor",false);S.block.kind="mm"}return}
  if(t.id==="toggleMore"){S.showMore=!S.showMore;render();return}
  if(t.id==="start"){startBlock();return}
  if(t.id==="startToday"){startIds(todayIds(),"tutor",false);return}
  if(t.id==="startFromPage"){startFromPage();return}
  if(t.id==="openFind"){S.view="find";render();window.scrollTo(0,0);const i=$("#findIn");if(i)i.focus();return}
  if(t.id==="openMine"){S.view="mine";S.mineMax=50;render();window.scrollTo(0,0);return}
  if(t.id==="goHome"){S.view="home";render();window.scrollTo(0,0);return}
  if(t.dataset.ff){S.ff=t.dataset.ff;S.findMax=50;morph($("#findRes"),findResults());return}
  if(t.dataset.mf){S.mf=t.dataset.mf;S.mineMax=50;render();return}
  if(t.dataset.ms){S.ms=t.dataset.ms;render();return}
  if(t.dataset.more==="find"){S.findMax=(S.findMax||50)+50;morph($("#findRes"),findResults());return}
  if(t.dataset.more==="mine"){S.mineMax=(S.mineMax||50)+50;render();return}
  if(t.id==="findStart"){const l=findList();if(l&&l.length)startIds(shuffle(l.map(q=>q.id)).slice(0,maxN(S.set.mode)),S.set.mode,S.set.recall);return}
  if(t.id==="mineStart"){const l=mineList();if(l.length)startIds(shuffle(l.map(q=>q.id)).slice(0,maxN(S.set.mode)),S.set.mode,S.set.recall);return}
  if(t.dataset.open){const l=t.dataset.open==="find"?findList():mineList();if(l)startBrowse(l,+t.dataset.k,t.dataset.open);return}
  if(t.id==="showAll"){S.showAll=!S.showAll;render();return}
  const b=S.block;
  if(t.dataset.ch!=null&&b){const q=cur();if(b.done[q.id]!=null)return;b.pick[q.id]=+t.dataset.ch;pickInPlace(q);return}
  if(t.id==="showCh"){const r=$("#recallIn");b.recallText=b.recallText||{};if(r&&r.value.trim())b.recallText[cur().id]=r.value.trim();b.shown[cur().id]=true;render();return}
  if(t.dataset.conf!=null&&b){submit(+t.dataset.conf);return}
  if(t.dataset.jump!=null&&b){b.i=+t.dataset.jump;render();window.scrollTo(0,0);return}
  if(t.id==="next"){b.i++;render();window.scrollTo(0,0);return}
  if(t.id==="prev"){b.i--;render();window.scrollTo(0,0);return}
  if(t.id==="finish"){if(b.browse){leaveBrowse();return}finish();return}
  if(t.id==="flag"){toggleFlag(cur());render();return}
  if(t.id==="quit"){if(b.browse){leaveBrowse();return}if(b.finished){S.view="home";S.block=null;render()}else finish();return}
  if(t.dataset.rev!=null){b.i=+t.dataset.rev;S.view="quiz";render();window.scrollTo(0,0);return}
  if(t.id==="again"){S.block=null;S.view="home";render();return}
});
document.addEventListener("input",e=>{
  if(e.target&&e.target.id==="findIn"){S.q=e.target.value;S.findMax=50;const r=$("#findRes");if(r)morph(r,findResults())}
});
document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="goalIn"){const v=parseInt(e.target.value,10);if(v>0){S.set.goal=Math.min(v,200);LS.put("rounds-set",S.set)}setTimeout(render);return}
  if(e.target&&e.target.id==="nIn"){const v=parseInt(e.target.value,10);if(v>0){S.set.n=Math.min(v,maxN(S.set.mode));LS.put("rounds-set",S.set)}setTimeout(render)}
});
document.addEventListener("keydown",e=>{
  if(e.target&&(e.target.id==="nIn"||e.target.id==="goalIn")&&e.key==="Enter"){e.target.blur();return}
  if(e.key==="Escape"&&document.getElementById("zoomBg")){document.getElementById("zoomBg").remove();return}
  if(e.key==="Escape"&&S.sheet){S.sheet=false;render();return}
  if(e.key==="Enter"&&e.target&&e.target.id==="findIn"){e.target.blur();return}
  if(S.view!=="quiz"||!S.block)return;
  if(e.target&&e.target.tagName==="TEXTAREA"){if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){const b=$("#showCh");if(b)b.click()}return}
  const k=e.key.toUpperCase();
  if("ABCDE".includes(k)&&k.length===1){const btn=document.querySelector(`[data-ch="${"ABCDE".indexOf(k)}"]`);if(btn)btn.click()}
  else if("123".includes(e.key)&&e.key.length===1){const btn=document.querySelector(`.confBtns [data-conf="${+e.key-1}"]:not(:disabled)`);if(btn)btn.click()}
  else if(e.key==="Enter"){const btn=$("#next")||$("#finish");if(btn&&!btn.disabled)btn.click()}
});

/* launch animation (pilot): plays while the questions load; hands off as soon as both the animation and the data are ready */
const ADOPTED=true;
(function splash(){
  const el=document.getElementById("splash");if(!el)return;
  const RMq=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let seen=false;if(ADOPTED){try{seen=sessionStorage.getItem("rounds-splash")==="1";sessionStorage.setItem("rounds-splash","1")}catch(e){}}
  if(RMq||seen){el.remove();return}
  document.body.classList.add("spWait");
  const t0=performance.now(),MIN=950,MAX=2600;let done=false;
  const finish=fast=>{if(done)return;done=true;
    const logo=el.querySelector(".spLogo"),target=document.getElementById("logoHome");
    const view=document.getElementById("view");
    if(fast||!target){el.classList.add("skip");document.body.classList.remove("spWait");setTimeout(()=>el.remove(),180);return}
    /* land the ring on the header's ring: scale by the two rings' sizes, origin at the splash logo's top left */
    const L=logo.getBoundingClientRect(),A=logo.querySelector("svg").getBoundingClientRect(),B=target.querySelector("svg").getBoundingClientRect(),k=B.width/A.width;
    logo.style.transition="transform .48s cubic-bezier(.2,.75,.2,1)";
    logo.style.transform=`translate(${B.left-L.left-k*(A.left-L.left)}px,${B.top-L.top-k*(A.top-L.top)}px) scale(${k})`;
    el.classList.add("go");view.classList.add("spIn");
    setTimeout(()=>{document.body.classList.remove("spWait");el.remove();setTimeout(()=>view.classList.remove("spIn"),600)},500)};
  el.addEventListener("pointerdown",()=>finish(true));
  addEventListener("keydown",()=>finish(true),{once:true});
  (function wait(){if(done)return;const t=performance.now()-t0;
    if((S.qs.length&&t>=MIN)||t>=MAX){finish(false);return}setTimeout(wait,40)})();
})();
load();
})();
</script>
