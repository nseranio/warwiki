<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#F2F7FD"/>
      <stop offset="100%" stop-color="#E6EFFA"/>
    </linearGradient>
    <radialGradient id="glowA" cx="16%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#3691E2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3691E2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="90%" cy="94%" r="60%">
      <stop offset="0%" stop-color="#185FA5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#185FA5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#185FA5"/>
      <stop offset="55%" stop-color="#1B6CBD"/>
      <stop offset="100%" stop-color="#3691E2"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B6CBD"/>
      <stop offset="100%" stop-color="#3691E2"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glowA)"/>
  <rect width="1080" height="1080" fill="url(#glowB)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- wordmark -->
    <text x="540" y="232" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#title)">WARWIKI</text>
    <text x="540" y="276" font-size="23" font-weight="500" letter-spacing="3" fill="#7C8AA0">RECONSTRUCTION, CODIFIED.</text>

    <!-- play glyph -->
    <rect x="447" y="372" width="186" height="186" rx="42" fill="url(#play)"/>
    <path d="M515 432 L585 465 L515 498 Z" fill="#FFFFFF"/>

    <!-- headline -->
    <text x="540" y="700" font-size="118" font-weight="800" letter-spacing="-3" fill="#102A43">Video Library</text>

    <!-- subline -->
    <text x="540" y="772" font-size="40" font-weight="500" fill="#34465B">1,500+ operative &amp; teaching videos</text>
    <text x="540" y="828" font-size="40" font-weight="500" fill="#34465B">searchable, grouped by topic</text>
  </g>
</svg>
