<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F7FD"/>
      <stop offset="100%" stop-color="#E8F1FB"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#3691E2" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3691E2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="92%" r="55%">
      <stop offset="0%" stop-color="#185FA5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#185FA5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
