<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" role="img" aria-labelledby="heaney-title heaney-desc" preserveAspectRatio="xMidYMid meet">
  <title id="heaney-title">Heaney needle driver</title>
  <desc id="heaney-desc">Schematic line drawing showing the double curvature of the Heaney needle driver — angled shaft and angled jaws that allow perpendicular needle delivery to deep pelvic tissue while the surgeon's hand stays outside the operative cone.</desc>

  <!-- Finger rings -->
  <g fill="none" stroke="#222" stroke-width="3" stroke-linecap="round">
    <circle cx="42" cy="90" r="24"/>
    <circle cx="42" cy="135" r="24"/>
  </g>

  <!-- Crossing shanks to box lock -->
  <g fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round">
    <line x1="66" y1="90" x2="155" y2="108"/>
    <line x1="66" y1="135" x2="155" y2="117"/>
  </g>

  <!-- Box lock -->
  <rect x="155" y="103" width="20" height="18" fill="none" stroke="#222" stroke-width="2"/>

  <!-- First curvature: shaft sweeps up and forward -->
  <g fill="none" stroke="#222" stroke-width="2" stroke-linecap="round">
    <path d="M 175 108 Q 240 75, 310 50"/>
    <path d="M 175 116 Q 240 83, 310 58"/>
  </g>

  <!-- Second curvature: jaws angle perpendicular to tissue plane -->
  <g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round">
    <path d="M 310 50 Q 350 38, 400 70"/>
    <path d="M 310 58 Q 350 46, 400 76"/>
  </g>

  <!-- Cross-hatching on jaw -->
  <g stroke="#222" stroke-width="0.7">
    <line x1="368" y1="51" x2="372" y2="56"/>
    <line x1="378" y1="55" x2="382" y2="60"/>
    <line x1="388" y1="62" x2="392" y2="68"/>
  </g>

  <!-- Annotations -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#5a6473">
    <text x="42" y="35" text-anchor="middle">Hand stays outside</text>
    <text x="42" y="48" text-anchor="middle">the pelvic cone</text>
    <text x="240" y="148" text-anchor="middle">First angle · shaft sweep</text>
    <text x="395" y="105" text-anchor="middle">Second angle · jaw curve</text>
  </g>
</svg>
