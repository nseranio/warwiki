<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" role="img" aria-labelledby="tw-title tw-desc" preserveAspectRatio="xMidYMid meet">
  <title id="tw-title">Turner-Warwick Ryder needle holder</title>
  <desc id="tw-desc">Schematic line drawing showing the elongated shank, narrow box lock, fine tapered jaws, and tungsten-carbide finger rings characteristic of the Turner-Warwick Ryder modification of the Ryder needle holder.</desc>

  <!-- Finger rings with gold-accent tungsten carbide insert indicator -->
  <g fill="none" stroke-linecap="round">
    <circle cx="42" cy="38" r="24" stroke="#222" stroke-width="3"/>
    <circle cx="42" cy="38" r="18" stroke="#d4a437" stroke-width="2"/>
    <circle cx="42" cy="80" r="24" stroke="#222" stroke-width="3"/>
    <circle cx="42" cy="80" r="18" stroke="#d4a437" stroke-width="2"/>
  </g>

  <!-- Crossing shanks from rings into box lock -->
  <g fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round">
    <line x1="66" y1="38" x2="170" y2="55"/>
    <line x1="66" y1="80" x2="170" y2="63"/>
  </g>

  <!-- Narrow box lock -->
  <rect x="170" y="50" width="22" height="18" fill="none" stroke="#222" stroke-width="2"/>

  <!-- Elongated shank (Turner-Warwick signature) -->
  <g fill="none" stroke="#222" stroke-width="2" stroke-linecap="round">
    <line x1="192" y1="55" x2="490" y2="57"/>
    <line x1="192" y1="63" x2="490" y2="61"/>
  </g>

  <!-- Fine tapered jaw -->
  <g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round">
    <line x1="490" y1="57" x2="540" y2="59"/>
    <line x1="490" y1="61" x2="540" y2="59"/>
  </g>

  <!-- Cross-hatching on jaw working surface -->
  <g stroke="#222" stroke-width="0.7">
    <line x1="500" y1="56" x2="500" y2="62"/>
    <line x1="510" y1="56.5" x2="510" y2="61.5"/>
    <line x1="520" y1="57" x2="520" y2="61"/>
    <line x1="530" y1="57.5" x2="530" y2="60.5"/>
  </g>

  <!-- Annotations -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#5a6473">
    <text x="42" y="123" text-anchor="middle">Tungsten carbide rings</text>
    <text x="181" y="42" text-anchor="middle">Box lock</text>
    <text x="341" y="42" text-anchor="middle">Elongated shank · 18–23 cm</text>
    <text x="515" y="83" text-anchor="middle">Fine tapered jaw</text>
  </g>
</svg>
