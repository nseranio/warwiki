<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 344" width="860" height="344" role="img" aria-label="DeLancey hammock hypothesis of stress continence shown in axial section at the midurethra. Left panel, normal: the urethra rests on a taut supportive layer (anterior vaginal wall plus endopelvic fascia) anchored on both sides to the levator ani and arcus tendineus; a cough raises abdominal pressure and compresses the urethra against this stable backboard so the lumen closes and the patient stays continent. Right panel, stress incontinence: a lateral attachment is detached so the hammock sags, the urethra descends and rotates, and a cough no longer compresses it, so the lumen stays open and urine leaks. Key: continence depends on a stable suburethral backboard rather than a tighter urethra, which is why a midurethral sling restores the backboard; intrinsic sphincter deficiency is a separate mechanism.">
<defs>
<marker id="ch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="858" height="342" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">The hammock hypothesis &#8212; why a cough does (or doesn&#8217;t) stay dry</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">axial section at the midurethra: continence depends on the support beneath the urethra, not the urethra itself</text>
