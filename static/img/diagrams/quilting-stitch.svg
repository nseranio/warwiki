<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">a free graft has no blood supply; it survives only pressed flat on a vascularized bed (imbibition &#8594; inosculation &#8594; neovascularization)</text>
