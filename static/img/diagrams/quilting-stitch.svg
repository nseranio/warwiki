<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="The quilting stitch and graft survival, two panels. A free graft has no blood supply of its own and survives only when pressed flat against a vascularized bed through plasmatic imbibition, inosculation, and neovascularization. Without quilting, a hematoma or seroma collects between the graft and the bed, lifting the pale graft off and curling its edges so it loses contact and starves. With quilting, multiple tacking sutures hold the graft in intimate contact with the bed, eliminating dead space, so plasma and new vessels reach the graft and it takes.">
<defs>
<marker id="fd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
