<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 398" width="840" height="398" role="img" aria-label="Indiana pouch continent cutaneous urinary diversion. A low-pressure reservoir is built from detubularized right colon (cecum and ascending colon). The terminal ileum is tapered to about 14 French and brought to a catheterizable umbilical stoma; continence is supplied by the ileocecal valve plus plication of the ileal limb plus low reservoir pressure. The ureters are reimplanted into the pouch. The patient self-catheterizes the stoma every 4 to 6 hours and wears no external bag, in contrast to an orthotopic neobladder that is voided per urethra. Key: chosen for continent diversion when the patient is not an orthotopic-neobladder candidate due to positive urethral margin, sphincter damage, or prior pelvic radiation; continence is about 89 percent at 3 years; lifelong vitamin B12 and metabolic-acidosis surveillance is needed after ileocecal resection, and stomal stenosis and pouch stones are common late issues.">
<rect x="1" y="1" width="838" height="396" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Indiana pouch &#8212; continent cutaneous diversion</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">detubularized right colon reservoir + tapered ileal limb to a catheterizable stoma; the ileocecal valve gives continence</text>
<rect x="80" y="92" width="320" height="16" rx="4" fill="#F4E6DA" stroke="#D8C3B6" stroke-width="1.4"/>
<text x="96" y="86" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#D8C3B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">abdominal wall</text>
<ellipse cx="250" cy="100" rx="10" ry="6.5" fill="#FFFFFF" stroke="#CC9079" stroke-width="1.8"/>
<text x="250" y="78" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">catheterizable stoma</text>
<text x="250" y="126" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B">(umbilicus)</text>
<line x1="250" y1="62" x2="250" y2="96" stroke="#0F766E" stroke-width="3" stroke-dasharray="2 3" stroke-linecap="round"/>
<text x="296" y="64" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">CIC q4-6h</text>
<path d="M 250 108 C 254 150, 246 196, 250 224" fill="none" stroke="#CC9079" stroke-width="12" stroke-linecap="round"/>
<path d="M 250 108 C 254 150, 246 196, 250 224" fill="none" stroke="#FBEFE9" stroke-width="5" stroke-linecap="round"/>
<text x="320" y="168" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">tapered terminal</text>
<text x="320" y="180" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ileum (~14 Fr)</text>
<ellipse cx="250" cy="236" rx="20" ry="12" fill="#F3DBD2" stroke="#B45309" stroke-width="2.4"/>
<line x1="241" y1="230" x2="241" y2="242" stroke="#B45309" stroke-width="1.4"/>
<line x1="250" y1="230" x2="250" y2="242" stroke="#B45309" stroke-width="1.4"/>
<line x1="259" y1="230" x2="259" y2="242" stroke="#B45309" stroke-width="1.4"/>
<text x="320" y="232" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ileocecal valve</text>
<text x="320" y="244" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">+ plication = continence</text>
<path d="M 150 332 C 138 256, 220 244, 250 248 C 280 244, 362 256, 350 332 C 336 378, 164 378, 150 332 Z" fill="#F3DBD2" stroke="#CC9079" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M 162 300 Q 250 286 338 300" fill="none" stroke="#185FA5" stroke-width="1.4" stroke-dasharray="3 3"/>
<path d="M 170 340 Q 250 356 330 340" fill="none" stroke="#185FA5" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="250" y="322" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">detubularized</text>
<text x="250" y="338" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">right colon</text>
<path d="M 100 196 C 130 230, 154 256, 180 274" fill="none" stroke="#185FA5" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="180" cy="274" r="5" fill="none" stroke="#185FA5" stroke-width="1.8"/>
<path d="M 400 196 C 370 230, 346 256, 320 274" fill="none" stroke="#185FA5" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="320" cy="274" r="5" fill="none" stroke="#185FA5" stroke-width="1.8"/>
<text x="100" y="188" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ureters</text>
<rect x="560" y="110" width="236" height="208" rx="12" fill="#F8FAFC" stroke="#EAEDF1" stroke-width="1.2"/>
<text x="576" y="134" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Continent, no bag</text>
<circle cx="582" cy="158" r="3.4" fill="#15803D"/>
<text x="592" y="162" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Reservoir</text>
<text x="592" y="175" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">detubularized right colon = low pressure</text>
<circle cx="582" cy="196" r="3.4" fill="#15803D"/>
<text x="592" y="200" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Continence</text>
<text x="592" y="213" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ileocecal valve + tapered/plicated ileum</text>
<circle cx="582" cy="234" r="3.4" fill="#15803D"/>
<text x="592" y="238" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Emptying</text>
<text x="592" y="251" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">self-catheterize the stoma every 4-6 h</text>
<circle cx="582" cy="272" r="3.4" fill="#15803D"/>
<text x="592" y="276" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">vs neobladder</text>
<text x="592" y="289" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">cutaneous stoma, not voided per urethra</text>
</svg>
