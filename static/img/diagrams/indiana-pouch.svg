<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 461" width="840" height="461" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Indiana continent reservoir</title>
<desc id="figure-description">Detubularized right colon forms the reservoir; a tapered ileal outlet and reinforced ileocecal valve provide the catheterizable continence mechanism. Detailed construction and geometry need technical review; catheterization frequency depends on capacity, output and clinical plan. View: Ileocecal reservoir, simplified anterior view. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: Rowland and Kropp: evolution of the Indiana continent reservoir (1994 original technical article), https://pubmed.ncbi.nlm.nih.gov/7966719/; access: abstract checked; Detubularized reservoir, tapered efferent limb and ileocecal-valve plication; exact operative geometry still needs review. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
