<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 424" width="860" height="424" role="img" aria-label="Peyronie's disease curvature correction in three panels. Panel 1, the deformity: the penis curves toward the plaque, which lies on the concave or short side, opposite the convex or long side. Panel 2, plication or Nesbit: sutures shorten the convex long side to match, straightening the penis but making it slightly shorter. Panel 3, incision plus graft: the plaque on the concave side is incised and the defect bridged with a graft, lengthening the short side and straightening the penis while preserving length. Decision: plication for curves up to about 60 degrees with good length and erections; incision or grafting for curves over about 60 degrees, hourglass deformity, or a short penis with good rigidity. Plication trades length for simplicity, grafting preserves length but raises de-novo erectile-dysfunction risk, and a penile prosthesis is added when erectile function is inadequate.">
<rect x="1" y="1" width="858" height="422" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Peyronie's curvature correction &#8212; shorten the long side or lengthen the short side</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">the plaque is on the concave (short) side; straighten by plicating the convex side or grafting the concave side</text>
<line x1="150" y1="312" x2="150" y2="116" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 150 312 Q 150 210 114 138" fill="none" stroke="#F4E6DA" stroke-width="40" stroke-linecap="round"/>
<path d="M 150 312 Q 150 210 114 138" fill="none" stroke="#D8C3B6" stroke-width="40" stroke-linecap="round" opacity="0.0"/>
<circle cx="114" cy="134" r="15" fill="#F4E6DA" stroke="#D8C3B6" stroke-width="1.4"/>
<path d="M 130 228 Q 144 196 124 168" fill="none" stroke="#B91C1C" stroke-width="6" stroke-linecap="round"/>
<text x="106" y="196" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">plaque</text>
<text x="106" y="208" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">(concave /</text>
<text x="106" y="219" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">short side)</text>
<text x="180" y="210" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">convex /</text>
<text x="180" y="221" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">long side</text>
<path d="M 150 168 A 44 44 0 0 1 130 150" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
<text x="156" y="150" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">curve</text>
<text x="150" y="338" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B">1. The deformity</text>
<path d="M 430 312 L 430 150" fill="none" stroke="#F4E6DA" stroke-width="40" stroke-linecap="round"/>
<circle cx="430" cy="150" r="15" fill="#F4E6DA" stroke="#D8C3B6" stroke-width="1.4"/>
<path d="M 444 196 q 12 6 0 12" fill="none" stroke="#B45309" stroke-width="2"/>
<circle cx="448" cy="202" r="2.4" fill="#B45309"/>
<path d="M 444 226 q 12 6 0 12" fill="none" stroke="#B45309" stroke-width="2"/>
<circle cx="448" cy="232" r="2.4" fill="#B45309"/>
<path d="M 444 256 q 12 6 0 12" fill="none" stroke="#B45309" stroke-width="2"/>
<circle cx="448" cy="262" r="2.4" fill="#B45309"/>
<line x1="474" y1="196" x2="474" y2="244" stroke="#B45309" stroke-width="1.2"/>
<text x="480" y="224" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">convex side</text>
<text x="480" y="235" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">shortened</text>
<line x1="400" y1="135" x2="400" y2="312" stroke="#15803D" stroke-width="1.2"/>
<text x="394" y="220" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">&#10003;</text>
<text x="430" y="338" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B">2. Plication / Nesbit</text>
<text x="430" y="354" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B">straight, slightly shorter</text>
<path d="M 710 312 L 710 122" fill="none" stroke="#F4E6DA" stroke-width="40" stroke-linecap="round"/>
<circle cx="710" cy="122" r="15" fill="#F4E6DA" stroke="#D8C3B6" stroke-width="1.4"/>
<rect x="686" y="186" width="18" height="58" rx="6" fill="#DCE7F1" stroke="#185FA5" stroke-width="2.4"/>
<line x1="688" y1="196" x2="702" y2="196" stroke="#185FA5" stroke-width="0.9"/>
<line x1="688" y1="208" x2="702" y2="208" stroke="#185FA5" stroke-width="0.9"/>
<line x1="688" y1="220" x2="702" y2="220" stroke="#185FA5" stroke-width="0.9"/>
<line x1="688" y1="232" x2="702" y2="232" stroke="#185FA5" stroke-width="0.9"/>
<text x="680" y="200" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">graft</text>
<text x="680" y="212" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">lengthens</text>
<text x="680" y="223" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">concave side</text>
<text x="740" y="215" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">&#10003;</text>
<text x="710" y="338" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B">3. Incision + graft</text>
<text x="710" y="354" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B">straight, length preserved</text>
<line x1="40" y1="372" x2="820" y2="372" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="391" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E293B">Choose by curve, length, and rigidity: plication for &#8804; ~60° with good length + erections; incision/graft for &gt; ~60°, hourglass, or short penis with good rigidity.</text>
<text x="40" y="409" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Plication trades length for simplicity (shortening is universal); grafting preserves length but raises de-novo-ED risk. Add a penile prosthesis when erections are inadequate.</text>
</svg>
