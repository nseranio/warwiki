<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="Stylized midsagittal schematic of the vaginal canal showing the six POP-Q points (Aa, Ba, C, D, Ap, Bp), the hymen as the zero reference plane, the genital hiatus, perineal body and total vaginal length landmarks, and a stage ruler relating leading-edge position to POP-Q stage.">
<rect x="1" y="1" width="898" height="538" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="40" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">POP-Q &#8212; the six measurement points</text>
<text x="40" y="59" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">all positions in cm relative to the hymen (0): negative = above (supported), positive = below (prolapsed)</text>
<text x="70" y="100" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#64748B">&#8592; anterior</text>
<text x="470" y="100" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#64748B">posterior &#8594;</text>
<rect x="56" y="118" width="266" height="82" rx="8" fill="#F8FAFC" stroke="#EAEDF1" stroke-width="1.2"/>
<text x="70" y="138" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E293B">Reading the points</text>
<text x="70" y="156" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="500" fill="#64748B">Aa, Ap &#8212; fixed, 3 cm above hymen</text>
<text x="70" y="172" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="500" fill="#64748B">Ba, Bp &#8212; lowest point, upper wall</text>
<text x="70" y="188" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="500" fill="#64748B">C &#8212; cervix / cuff&#160;&#160;&#160;&#160;&#160;D &#8212; posterior fornix</text>
