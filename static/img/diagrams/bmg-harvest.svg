<path d="M 92 183 C 72 211, 72 211, 92 239" fill="none" stroke="#D88A95" stroke-width="2.4"/>
<text x="94" y="94" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">commissure (avoid)</text>
<circle cx="239" cy="154" r="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2.2"/>
