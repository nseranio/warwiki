<path d="M 232 278 l 0 14 M 232 285 l -34 0" fill="none" stroke="#0F766E" stroke-width="1.2"/>
<text x="190" y="289" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">~1 cm margin</text>
