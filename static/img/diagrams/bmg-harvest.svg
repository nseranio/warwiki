<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 358" width="820" height="358" role="img" aria-label="Buccal mucosa graft harvest shown as an intraoral view of the cheek, framed by the upper and lower teeth and gingiva with the oral commissure anteriorly. Stensen's parotid duct papilla sits high on the cheek opposite the second maxillary molar, with a dashed line marking the stay-below boundary. The graft is outlined as an ellipse in the central cheek below the duct line and clear of the commissure, up to about 2.5 centimeters wide by the needed length, with roughly 1 centimeter margins from the gingiva. Key: non-keratinized epithelium with thin lamina propria gives excellent graft take; mark with the cheek tented, infiltrate, and harvest at partial thickness; spare Stensen's duct, the commissure, and the lip; open versus closed donor closure gives similar pain; use bilateral cheeks or add lingual or labial mucosa for long or panurethral grafts.">
<rect x="1" y="1" width="818" height="356" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Buccal mucosa graft harvest &#8212; the workhorse urethroplasty graft</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">intraoral view of the cheek: harvest centrally, clear of Stensen&#8217;s duct and the oral commissure</text>
<rect x="90" y="96" width="510" height="230" rx="40" fill="#F2C9CE" stroke="#D88A95" stroke-width="1.6"/>
