<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 335" width="820" height="335" role="img" aria-label="Heineke-Mikulicz principle: a longitudinal incision is made across a short luminal narrowing (panel 1) and then closed transversely at 90 degrees (panel 2), widening the caliber at the former stricture while slightly shortening the segment; key notes it preserves blood supply because no tissue is removed and the lumen is not transected, used for non-transecting bulbar urethroplasty, Fenger pyeloplasty, and transverse ureterotomy closure.">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="818" height="333" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="38" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Heineke-Mikulicz principle &#8212; incise long, close transverse</text>
<text x="40" y="57" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">a longitudinal cut across a short narrowing, closed at 90&#176; &#8212; the waist widens, the segment shortens slightly</text>
<path d="M 70 148 C 139 148, 165 182, 195 182 C 225 182, 251 148, 320 148 L 320 228 C 251 228, 225 194, 195 194 C 165 194, 139 228, 70 228 Z" fill="#E2ECF5"/>
<path d="M 70 142 C 139 142, 165 176, 195 176 C 225 176, 251 142, 320 142" fill="none" stroke="#475569" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 70 234 C 139 234, 165 200, 195 200 C 225 200, 251 234, 320 234" fill="none" stroke="#475569" stroke-width="2.6" stroke-linecap="round"/>
<ellipse cx="195" cy="188" rx="34" ry="22" fill="none" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="195" y="158" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">stricture</text>
<line x1="131" y1="188" x2="259" y2="188" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
<line x1="195" y1="182" x2="195" y2="148" stroke="#0F766E" stroke-width="2.2" marker-end="url(#ah)"/>
<line x1="195" y1="194" x2="195" y2="228" stroke="#0F766E" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="267" y="192" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">longitudinal</text>
<text x="267" y="205" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">incision</text>
<text x="195" y="280" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">1. Incise the narrowing</text>
<line x1="350" y1="188" x2="402" y2="188" stroke="#0F766E" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="376" y="177" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0F766E">rotate 90&#176;</text>
<path d="M 430 148 C 510 148, 532 138, 560 138 C 588 138, 610 148, 690 148 L 690 228 C 610 228, 588 238, 560 238 C 532 238, 510 228, 430 228 Z" fill="#E2ECF5"/>
<path d="M 430 148 C 510 148, 532 138, 560 138 C 588 138, 610 148, 690 148" fill="none" stroke="#475569" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 430 228 C 510 228, 532 238, 560 238 C 588 238, 610 228, 690 228" fill="none" stroke="#475569" stroke-width="2.6" stroke-linecap="round"/>
<line x1="560" y1="138" x2="560" y2="238" stroke="#185FA5" stroke-width="2.8" stroke-linecap="round"/>
<line x1="552" y1="148" x2="568" y2="148" stroke="#185FA5" stroke-width="1.4"/>
<line x1="552" y1="168" x2="568" y2="168" stroke="#185FA5" stroke-width="1.4"/>
