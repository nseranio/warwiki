<line x1="552" y1="228" x2="568" y2="228" stroke="#185FA5" stroke-width="1.4"/>
<text x="560" y="124" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">transverse suture line</text>
<path d="M 702 138 L 710 138 M 706 138 L 706 238 M 702 238 L 710 238" fill="none" stroke="#15803D" stroke-width="1.4"/>
<text x="716" y="180" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">wider</text>
<text x="716" y="196" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">caliber</text>
<text x="560" y="280" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">2. Close transversely</text>
</svg>
