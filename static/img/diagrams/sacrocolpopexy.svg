<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 404" width="860" height="404" role="img" aria-label="Sagittal pelvis showing sacrocolpopexy. A Y-shaped mesh has an anterior arm sutured along the anterior vaginal wall and a posterior arm along the posterior vaginal wall; the two arms join at the vault into a single stem that runs back and up to the sacral promontory, where it is fixed to the anterior longitudinal ligament just below S1. The bladder lies anterior, the rectum posterior. Key: gold-standard durable apical repair restoring the natural vaginal axis; suture to the anterior longitudinal ligament avoiding the left common iliac vein and middle sacral vessels; keep the mesh bridging not taut and re-peritonealize it.">
<defs>
<marker id="sa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
</defs>
<rect x="1" y="1" width="858" height="402" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Sacrocolpopexy &#8212; Y-mesh from vaginal vault to sacral promontory</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">sagittal view: anterior and posterior mesh arms join into one stem fixed to the anterior longitudinal ligament at S1</text>
<text x="96" y="90" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#64748B">anterior</text>
