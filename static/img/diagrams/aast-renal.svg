<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-label="Five stylized kidney panels showing AAST renal injury grades one through five: contusion or subcapsular hematoma, shallow laceration with perirenal hematoma, deep laceration sparing the collecting system, laceration into the collecting system with urinary extravasation, and shattered kidney or hilar avulsion.">
