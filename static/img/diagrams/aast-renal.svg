<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" width="900" height="408" role="img" aria-label="Five stylized kidney panels showing AAST renal injury grades I-V with a legend. Each kidney has a blue collecting system and dashed Gerota's fascia. Grade I: subcapsular hematoma. Grade II: shallow laceration plus perirenal hematoma. Grade III: deep laceration sparing the collecting system. Grade IV: laceration into the collecting system with amber urinary extravasation. Grade V: shattered kidney with hilar avulsion, devascularized.">
