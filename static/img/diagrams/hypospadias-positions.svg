<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 512" width="780" height="512" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Hypospadias meatal positions</title>
<desc id="figure-description">Markers group ectopic meatal positions into distal, shaft and proximal locations. Meatal position is descriptive; curvature, glans and plate characteristics also determine severity and reconstruction. View: Penis, ventral surface schematic. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: EAU Paediatric Urology (2026 guideline), https://uroweb.org/guidelines/paediatric-urology; access: official guideline landing page; Source mapped for congenital anatomy, pyeloplasty and reimplantation. Exact operative construction requires chapter-level clinical verification. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
