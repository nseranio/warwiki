<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 432" width="780" height="432" role="img" aria-label="Stylized lateral view of the penis, scrotum and perineum with eight numbered hypospadias meatal positions along the ventral aspect, colour-coded into anterior, middle and posterior groups, with a grouped legend listing the positions and approximate frequencies.">
