<text x="596" y="262" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">lateral sulci restored</text>
<text x="588" y="372" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">2. Paravaginal repair</text>
<text x="410" y="92" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#A9A18C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">arcus tendineus fascia pelvis ("white line")</text>
<text x="410" y="105" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">the lateral anchor of the anterior vaginal wall</text>
