<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 396" width="820" height="396" role="img" aria-label="Paravaginal defect and repair in two axial panels. The anterior vaginal wall and pubocervical fascia normally hang between the two arcus tendineus fasciae pelvis, the white line, on each pelvic sidewall, supporting the bladder above. Panel 1: a paravaginal defect detaches the lateral vaginal wall from the ATFP on the left, so that lateral sulcus and the bladder descend as a lateral cystocele while the right side stays intact. Panel 2: paravaginal repair re-suspends the lateral vaginal wall to the ATFP with several sutures, restoring the lateral sulci and a level anterior wall.">
<rect x="1" y="1" width="818" height="394" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Paravaginal defect and repair</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">axial view: the anterior vaginal wall hangs from the arcus tendineus (&#8220;white line&#8221;) on each pelvic sidewall</text>
