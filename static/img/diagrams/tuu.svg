<text x="450" y="320" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">diseased distal</text>
<text x="450" y="331" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ureter excluded</text>
<circle cx="266" cy="232" r="7" fill="none" stroke="#B45309" stroke-width="2.2"/>
<text x="254" y="222" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">end-to-side</text>
<text x="254" y="234" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">anastomosis</text>
<text x="360" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">gentle curve</text>
<text x="360" y="207" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">no tension, no kink</text>
</svg>
