<text x="180" y="300" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">recipient</text>
<text x="180" y="312" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ureter</text>
<text x="180" y="324" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">(healthy)</text>
