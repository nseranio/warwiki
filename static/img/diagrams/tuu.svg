<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 398" width="820" height="398" role="img" aria-label="Transureteroureterostomy in anterior view. The donor ureter from the affected side is mobilized and brought across the midline, cephalad to the inferior mesenteric artery and aortic bifurcation through a window in the sigmoid mesentery, in a gentle tension-free curve to an end-to-side anastomosis with the healthy recipient ureter, which continues intact to the bladder; the diseased distal donor ureter is excluded. Key: a salvage option when a long distal ureteral defect cannot reach the bladder and bladder-based repair is exhausted; contraindicated when disease threatens the recipient ureter such as stones, reflux, urothelial cancer, prior pelvic radiation, or retroperitoneal fibrosis, because the one good ureter must never be risked.">
<rect x="1" y="1" width="818" height="396" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Transureteroureterostomy (TUU) &#8212; cross to the good ureter</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">anterior view: the donor ureter crosses the midline above the IMA to an end-to-side anastomosis with the healthy recipient</text>
<path d="M 318 96 L 318 250 L 290 320" fill="none" stroke="#C2728A" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
<path d="M 342 96 L 342 250 L 370 320" fill="none" stroke="#C2728A" stroke-width="7" stroke-linecap="round" opacity="0.3"/>
<text x="330" y="90" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#C2728A" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">aorta / IVC</text>
<line x1="318" y1="224" x2="286" y2="232" stroke="#C2728A" stroke-width="3" opacity="0.5"/>
<text x="270" y="232" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#C2728A" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">IMA</text>
<line x1="260" y1="246" x2="400" y2="246" stroke="#64748B" stroke-width="1" stroke-dasharray="3 4"/>
<text x="404" y="250" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">aortic bifurcation</text>
<path d="M 168 96 C 150 104, 150 150, 170 158 C 192 162, 196 110, 168 96 Z" fill="#F3DBD2" stroke="#CC9079" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M 492 96 C 510 104, 510 150, 490 158 C 468 162, 464 110, 492 96 Z" fill="#F3DBD2" stroke="#CC9079" stroke-width="1.6" stroke-linejoin="round"/>
<text x="180" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">kidney</text>
<text x="480" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">kidney</text>
<path d="M 266 392 C 258 344, 402 344, 394 392 C 384 414, 276 414, 266 392 Z" fill="#E2ECF5" stroke="#4F6F92" stroke-width="2" stroke-linejoin="round"/>
<text x="330" y="384" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4F6F92" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">bladder</text>
