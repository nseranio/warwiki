<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 408" width="820" height="408" role="img" aria-label="Anderson-Hynes dismembered pyeloplasty in three panels. Panel 1: an obstructed ureteropelvic junction with a dilated renal pelvis, a pinched UPJ, and a lower-pole crossing vessel compressing it. Panel 2: the diseased UPJ segment is excised, the redundant pelvis trimmed along a dashed line, and the ureter spatulated along its lateral wall. Panel 3: a dependent funnel anastomosis is sewn from the spatulated ureter to the most dependent corner of the trimmed pelvis with an apical stitch, drained by a double-J stent, with the ureter transposed anterior to the crossing vessel.">
