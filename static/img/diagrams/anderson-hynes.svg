<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 488" width="820" height="488" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Anderson-Hynes pyeloplasty</title>
<desc id="figure-description">The narrowed ureteropelvic junction is divided, the ureter is spatulated, and a dependent anastomosis is reconstructed. A crossing-vessel relationship is shown as one scenario. Crossing-vessel transposition is individualized; vessel preservation, ischemia assessment and posterior suturing are not fully illustrated. View: Upper urinary tract, simplified anterior operative sequence. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: EAU Paediatric Urology (2026 guideline), https://uroweb.org/guidelines/paediatric-urology; access: official guideline landing page; Source mapped for congenital anatomy, pyeloplasty and reimplantation. Exact operative construction requires chapter-level clinical verification. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
