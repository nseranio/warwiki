<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 432" width="820" height="432" role="img" aria-label="Ileal ureter replacement in two panels. Panel 1: a 15 to 25 cm ileal segment is isolated from the small bowel on its mesenteric pedicle, shown hanging below as a urinary segment, while bowel continuity is restored above by an ileoileostomy bridging the gap. Panel 2: the segment is interposed isoperistaltically, with its oral end sewn to the renal pelvis as an ileopyelostomy and its aboral end implanted into the bladder as a refluxing ileovesical anastomosis, peristalsis carrying urine antegrade from kidney to bladder.">
