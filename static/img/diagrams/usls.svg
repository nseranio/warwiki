<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 376" width="820" height="376" role="img" aria-label="Uterosacral ligament suspension shown in a bird's-eye pelvic view with the sacrum posterior at top and the bladder anterior at bottom. The vaginal vault is suspended by sutures to the intermediate portion of each uterosacral ligament at the ischial-spine level and drawn back toward the sacrum. The ureters run about 1 to 2 centimeters lateral to the ligaments, the signature danger, so intraoperative cystoscopy is mandatory to confirm ureteral jets after suture placement; ureteral kinking is the characteristic complication. Key: a native-tissue apical repair equally effective to sacrospinous ligament fixation in the OPTIMAL trial, restoring a near-midline vaginal axis, placing sutures medial and cephalad on the ligament and releasing any suture that obstructs a ureter.">
<rect x="1" y="1" width="818" height="374" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Uterosacral ligament suspension (USLS) &#8212; mind the ureter</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">bird&#8217;s-eye pelvic view: suspend the vault to the intermediate uterosacral ligaments &#8212; the ureter runs ~1&#8211;2 cm lateral</text>
<text x="360" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#64748B">posterior (sacrum)</text>
<text x="360" y="360" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#64748B">anterior (bladder)</text>
<path d="M 290 96 C 330 84, 390 84, 430 96 C 410 120, 310 120, 290 96 Z" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.6" stroke-linejoin="round"/>
<text x="360" y="102" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">sacrum (S2-4)</text>
<path d="M 210 214 l 16 -7 l -2 16 z" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.3"/>
<text x="192" y="214" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ischial</text>
<text x="192" y="225" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">spine</text>
<path d="M 510 214 l -16 -7 l 2 16 z" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.3"/>
<text x="528" y="214" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ischial</text>
<text x="528" y="225" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">spine</text>
<ellipse cx="360" cy="312" rx="40" ry="24" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="2"/>
<text x="360" y="316" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#CF9DA3" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">vaginal vault</text>
<path d="M 330 296 C 264 240, 290 150, 324 116" fill="none" stroke="#B0995F" stroke-width="9" stroke-linecap="round"/>
<path d="M 390 296 C 456 240, 430 150, 396 116" fill="none" stroke="#B0995F" stroke-width="9" stroke-linecap="round"/>
<text x="456" y="250" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B0995F" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">uterosacral</text>
<text x="456" y="262" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B0995F" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ligament</text>
<path d="M 228 120 C 210 190, 240 268, 296 322" fill="none" stroke="#B91C1C" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="9 4"/>
