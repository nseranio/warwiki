<text x="210" y="162" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">~1-2 cm lateral</text>
<circle cx="290" cy="212" r="4.5" fill="#185FA5"/>
<circle cx="290" cy="212" r="11" fill="none" stroke="#15803D" stroke-width="1.5"/>
<path d="M 334 300 C 310 260, 294 228, 290 218" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="430" cy="212" r="4.5" fill="#185FA5"/>
<circle cx="430" cy="212" r="11" fill="none" stroke="#15803D" stroke-width="1.5"/>
<path d="M 386 300 C 410 260, 426 228, 430 218" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round"/>
<text x="360" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">intermediate USL</text>
<text x="360" y="207" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">(ischial-spine level)</text>
<text x="264" y="300" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">suspension</text>
<text x="264" y="311" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">sutures</text>
<rect x="556" y="120" width="232" height="86" rx="10" fill="#FEF2F2" stroke="#F3C6C6" stroke-width="1.3"/>
<text x="572" y="142" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C">Cystoscopy is mandatory</text>
<text x="572" y="160" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">confirm ureteral jets after suture</text>
<text x="572" y="174" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">placement; ureteral kinking is the</text>
<text x="572" y="188" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">signature USLS complication.</text>
</svg>
