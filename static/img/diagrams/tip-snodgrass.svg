<text x="110" y="211" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">incisions</text>
