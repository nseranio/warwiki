<text x="746" y="146" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">(too tight to roll)</text>
