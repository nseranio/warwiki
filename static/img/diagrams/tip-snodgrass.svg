<text x="164" y="291" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">meatus</text>
<rect x="141" y="124" width="18" height="150" rx="6" fill="#E2ECF5" stroke="none"/>
