<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 398" width="880" height="398" role="img" aria-label="Tubularized incised plate (TIP / Snodgrass) hypospadias repair. Step 1, ventral view: the urethral plate from the ectopic meatus to the glans tip is outlined by two parallel incisions and a single deep dorsal-midline relaxing incision. Step 2: the plate is tubularized over a catheter with a two-layer midline closure and dartos cover, creating a neourethra with a new slit meatus at the glans tip. A cross-section ladder shows why the plate is incised: a narrow flat plate is too tight to roll; the midline incision splays it wider; it then tubularizes over a catheter, the raw dorsal strip re-epithelializing. Key: default single-stage distal repair, correct chordee first, lowest fistula rate versus Mathieu, main risk meatal stenosis.">
<defs>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="878" height="396" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Tubularized Incised Plate (TIP / Snodgrass)</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">a single deep dorsal-midline incision widens a narrow urethral plate so it can be tubularized tension-free</text>
