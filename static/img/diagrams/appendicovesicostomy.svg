<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 483" width="820" height="483" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Mitrofanoff appendicovesicostomy</title>
<desc id="figure-description">A vascularized appendix connects the bladder to an accessible catheterizable stoma. A bladder-wall tunnel supplies a flap-valve continence mechanism. A tunnel does not guarantee dryness. Pedicle viability, channel length, easy catheterization and reservoir pressure require separate assessment. View: Bladder and appendix, conceptual frontal view. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: Cerchia et al.: minimally invasive Mitrofanoff in children (2026 technical case series), https://pmc.ncbi.nlm.nih.gov/articles/PMC12986302/; access: abstract checked; Appendicovesicostomy concept; seven-child exploratory series is not evidence of universal continence. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
