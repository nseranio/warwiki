<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="820" height="390" role="img" aria-label="Appendicovesicostomy or Mitrofanoff continent catheterizable channel. The appendix, kept on its mesoappendix blood supply, runs from a catheterizable skin stoma at the umbilicus or right lower quadrant down to the bladder, where it is reimplanted through a submucosal tunnel that creates a flap-valve. A cross-section inset shows the flap-valve: the channel lies in a submucosal tunnel between the detrusor and the mucosa, and a full bladder presses it flat against the wall so the patient stays dry between catheterizations. Key: it is the first-line catheterizable channel needing about a 4 to 5 to 1 tunnel-to-diameter ratio; the appendix is end-arterial so protect the mesoappendix; if the appendix is absent or used for a MACE, build a Yang-Monti channel instead; stomal stenosis is the commonest late problem and umbilical stomas tend to fare better.">
<defs>
<marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F6F92"/></marker>
</defs>
<rect x="1" y="1" width="818" height="388" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Appendicovesicostomy (Mitrofanoff) &#8212; a continent catheterizable channel</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">appendix on its mesoappendix: tunneled into the bladder for a flap-valve, brought to the skin as a dry, catheterizable stoma</text>
<rect x="70" y="92" width="360" height="16" rx="4" fill="#F4E6DA" stroke="#D8C3B6" stroke-width="1.4"/>
<text x="90" y="86" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#D8C3B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">abdominal wall</text>
<ellipse cx="250" cy="100" rx="11" ry="7" fill="#FFFFFF" stroke="#CC9079" stroke-width="1.8"/>
<text x="250" y="78" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">catheterizable stoma</text>
<text x="250" y="126" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B">umbilicus or RLQ</text>
<line x1="250" y1="70" x2="250" y2="96" stroke="#0F766E" stroke-width="3" stroke-dasharray="2 3" stroke-linecap="round"/>
<text x="298" y="92" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">CIC catheter</text>
<path d="M 250 108 C 252 160, 244 210, 250 250" fill="none" stroke="#CC9079" stroke-width="16" stroke-linecap="round"/>
<path d="M 250 108 C 252 160, 244 210, 250 250" fill="none" stroke="#FBEFE9" stroke-width="8" stroke-linecap="round"/>
<text x="196" y="180" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">appendix</text>
<path d="M 268 120 C 300 160, 296 210, 274 244" fill="none" stroke="#B99873" stroke-width="1.6"/>
<line x1="262" y1="150" x2="288" y2="150" stroke="#B91C1C" stroke-width="1.2"/>
<line x1="263" y1="184" x2="288" y2="184" stroke="#B91C1C" stroke-width="1.2"/>
<line x1="264" y1="218" x2="288" y2="218" stroke="#B91C1C" stroke-width="1.2"/>
<text x="316" y="188" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#B99873" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">mesoappendix</text>
<text x="316" y="199" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">(blood supply)</text>
<path d="M 120 360 C 108 280, 200 256, 250 258 C 300 256, 392 280, 380 360 C 368 396, 132 396, 120 360 Z" fill="#E2ECF5" stroke="#4F6F92" stroke-width="2.2" stroke-linejoin="round"/>
<text x="180" y="330" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#4F6F92" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">bladder</text>
<path d="M 250 256 C 250 278, 244 296, 232 308" fill="none" stroke="#0F766E" stroke-width="2.4" stroke-dasharray="4 3"/>
<text x="300" y="280" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">submucosal</text>
<text x="300" y="292" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">tunnel (flap-valve)</text>
<rect x="470" y="154" width="200" height="210" rx="12" fill="#F8FAFC" stroke="#EAEDF1" stroke-width="1.2"/>
<text x="570" y="176" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E293B">Flap-valve</text>
<text x="570" y="191" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B">continence = passive</text>
<rect x="490" y="216" width="160" height="30" fill="#E2ECF5" stroke="#4F6F92" stroke-width="1.4"/>
<text x="500" y="210" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#4F6F92" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">detrusor</text>
<rect x="490" y="246" width="160" height="8" fill="#C6485B" opacity="0.5"/>
<text x="646" y="254" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#C6485B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">mucosa</text>
<ellipse cx="560" cy="240" rx="22" ry="7" fill="#FBEFE9" stroke="#CC9079" stroke-width="2"/>
<line x1="553" y1="240" x2="567" y2="240" stroke="#CC9079" stroke-width="1.6"/>
<line x1="538" y1="200" x2="538" y2="226" stroke="#4F6F92" stroke-width="1.6" marker-end="url(#av)"/>
<line x1="560" y1="200" x2="560" y2="226" stroke="#4F6F92" stroke-width="1.6" marker-end="url(#av)"/>
<line x1="582" y1="200" x2="582" y2="226" stroke="#4F6F92" stroke-width="1.6" marker-end="url(#av)"/>
<text x="570" y="290" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B">a full bladder presses the</text>
<text x="570" y="302" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B">channel flat against the wall</text>
<text x="570" y="320" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B">&#8594; stays dry between caths</text>
</svg>
