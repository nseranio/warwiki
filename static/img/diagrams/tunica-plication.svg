<line x1="684" y1="205" x2="716" y2="205" stroke="#185FA5" stroke-width="1.6"/>
<line x1="684" y1="214" x2="716" y2="214" stroke="#185FA5" stroke-width="1.6"/>
<line x1="630" y1="196" x2="660" y2="196" stroke="#15803D" stroke-width="2.2" marker-end="url(#sh)"/>
<line x1="770" y1="196" x2="740" y2="196" stroke="#15803D" stroke-width="2.2" marker-end="url(#sh)"/>
<text x="700" y="156" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">longitudinal cut,</text>
<text x="700" y="167" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">transverse close</text>
<text x="700" y="254" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Yachia</text>
<text x="700" y="268" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Heineke-Mikulicz</text>
</svg>
