<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-label="Tunica plication mechanics for Peyronie's disease, shown as close-ups of the tunica albuginea on the convex long side opposite the plaque. A small orienting glyph shows the curved corpus with the plaque on the concave side and the maneuvers applied to the convex side. Nesbit: an elliptical wedge of tunica is excised and the defect closed with sutures, shortening the convex side. 16-dot plication: plicating sutures infold and pleat the tunica without removing tissue. Yachia: a longitudinal incision in the tunica is closed transversely by the Heineke-Mikulicz principle. Green arrows in each panel show shortening of the convex side.">
<defs>
<marker id="sh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
</defs>
<rect x="1" y="1" width="818" height="358" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Tunica plication mechanics for Peyronie&#8217;s</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">three ways to shorten the convex (long) side of the tunica opposite the plaque &#8212; close-ups of the tunica</text>
<path d="M 96 290 C 82 250 82 220 96 180" fill="none" stroke="#B6A98A" stroke-width="10" stroke-linecap="round"/>
<path d="M 122 290 C 136 250 136 220 122 180" fill="none" stroke="#B6A98A" stroke-width="10" stroke-linecap="round"/>
<rect x="78" y="232" width="10" height="22" rx="3" fill="#7A4A3A"/>
<text x="102" y="316" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#7A4A3A" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">plaque</text>
<text x="136" y="226" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">convex</text>
<text x="136" y="238" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">side</text>
<rect x="212" y="170" width="156" height="52" rx="9" fill="#ECE6D8" stroke="#B6A98A" stroke-width="2.2"/>
<ellipse cx="290" cy="140" rx="16" ry="11" fill="#FBE4E4" stroke="#C0504D" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M 282 170 L 282 150 M 298 170 L 298 150" fill="none" stroke="#C0504D" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="283" y1="178" x2="297" y2="178" stroke="#185FA5" stroke-width="1.6"/>
<line x1="283" y1="187" x2="297" y2="187" stroke="#185FA5" stroke-width="1.6"/>
<line x1="283" y1="196" x2="297" y2="196" stroke="#185FA5" stroke-width="1.6"/>
<line x1="283" y1="205" x2="297" y2="205" stroke="#185FA5" stroke-width="1.6"/>
<line x1="283" y1="214" x2="297" y2="214" stroke="#185FA5" stroke-width="1.6"/>
<line x1="290" y1="172" x2="290" y2="220" stroke="#185FA5" stroke-width="2"/>
<line x1="220" y1="196" x2="250" y2="196" stroke="#15803D" stroke-width="2.2" marker-end="url(#sh)"/>
<line x1="360" y1="196" x2="330" y2="196" stroke="#15803D" stroke-width="2.2" marker-end="url(#sh)"/>
<text x="290" y="122" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#C0504D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">excise wedge</text>
<text x="290" y="254" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Nesbit</text>
<text x="290" y="268" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">excise + close</text>
<path d="M 422 170 L 480 170 C 492 186 508 186 520 170 L 578 170 L 578 222 L 520 222 C 508 206 492 206 480 222 L 422 222 Z" fill="#ECE6D8" stroke="#B6A98A" stroke-width="2.2"/>
<circle cx="482" cy="182" r="2.4" fill="#185FA5"/>
<circle cx="482" cy="210" r="2.4" fill="#185FA5"/>
<circle cx="518" cy="182" r="2.4" fill="#185FA5"/>
<circle cx="518" cy="210" r="2.4" fill="#185FA5"/>
<line x1="482" y1="182" x2="518" y2="182" stroke="#185FA5" stroke-width="1.5"/>
<line x1="482" y1="210" x2="518" y2="210" stroke="#185FA5" stroke-width="1.5"/>
<line x1="430" y1="196" x2="460" y2="196" stroke="#15803D" stroke-width="2.2" marker-end="url(#sh)"/>
<line x1="570" y1="196" x2="540" y2="196" stroke="#15803D" stroke-width="2.2" marker-end="url(#sh)"/>
<text x="500" y="156" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">plicating sutures</text>
<text x="500" y="254" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">16-dot plication</text>
<text x="500" y="268" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">infold &#8212; no excision</text>
<rect x="622" y="170" width="156" height="52" rx="9" fill="#ECE6D8" stroke="#B6A98A" stroke-width="2.2"/>
<line x1="700" y1="176" x2="700" y2="216" stroke="#334155" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="684" y1="178" x2="716" y2="178" stroke="#185FA5" stroke-width="1.6"/>
<line x1="684" y1="187" x2="716" y2="187" stroke="#185FA5" stroke-width="1.6"/>
