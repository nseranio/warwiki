<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 335" width="820" height="335" role="img" aria-label="Y-V plasty geometry: a Y-shaped incision with a triangular flap (panel A) whose flap advances distally along the stem so the wound closes as a V and the tissue lengthens by the advancement distance x (panel B), with a key noting it lengthens without undermining and is used for bladder-neck contracture, VUAS, Foley pyeloplasty, and meatoplasty.">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="818" height="333" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="38" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Y-V plasty &#8212; advancement geometry</text>
<text x="40" y="57" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">the triangular flap slides along the stem &#8212; the Y becomes a V and the tissue lengthens</text>
<line x1="188" y1="90" x2="188" y2="264" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 4"/>
<polygon points="138,114 238,114 188,168" fill="#DCE7F1" stroke="none"/>
<path d="M 138 114 L 188 168 L 238 114 M 188 168 L 188 252" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="188" y="138" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7FA3C4" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">flap</text>
<text x="196" y="224" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">stem</text>
<text x="188" y="284" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Y incision</text>
<line x1="312" y1="168" x2="362" y2="168" stroke="#0F766E" stroke-width="2.4" marker-end="url(#ar)"/>
<text x="337" y="156" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0F766E">advance</text>
<line x1="430" y1="168" x2="586" y2="168" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="500" y1="90" x2="500" y2="264" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 4"/>
<polygon points="450,114 550,114 500,210" fill="#DCE7F1" stroke="none"/>
<path d="M 450 114 L 500 210 L 550 114" fill="none" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 500 210 L 500 252" fill="none" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round"/>
<line x1="458.5" y1="134" x2="466.5" y2="142" stroke="#185FA5" stroke-width="1.3"/>
<line x1="541.5" y1="134" x2="533.5" y2="142" stroke="#185FA5" stroke-width="1.3"/>
<line x1="472" y1="159.9" x2="480" y2="167.9" stroke="#185FA5" stroke-width="1.3"/>
