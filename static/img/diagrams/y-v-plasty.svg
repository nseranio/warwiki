<line x1="485.5" y1="185.8" x2="493.5" y2="193.8" stroke="#185FA5" stroke-width="1.3"/>
<line x1="514.5" y1="185.8" x2="506.5" y2="193.8" stroke="#185FA5" stroke-width="1.3"/>
<path d="M 578 168 L 586 168 M 582 168 L 582 210 M 578 210 L 586 210" fill="none" stroke="#15803D" stroke-width="1.4"/>
<text x="592" y="193" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">+ x</text>
<text x="500" y="284" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">V closure</text>
