<path d="M 222 162.9 A 52 52 0 1 1 178 162.9" fill="none" stroke="#E7B6AC" stroke-width="18" stroke-linecap="round"/>
<path d="M 222 162.9 A 52 52 0 1 1 178 162.9" fill="none" stroke="#C0705E" stroke-width="18" stroke-linecap="round" opacity="0"/>
<circle cx="222" cy="162.9" r="9" fill="#E7B6AC" stroke="#C0705E" stroke-width="1.4"/>
<circle cx="178" cy="162.9" r="9" fill="#E7B6AC" stroke="#C0705E" stroke-width="1.4"/>
<path d="M 182 160.9 Q 200 144 218 160.9" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="3 3"/>
<text x="200" y="170" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">anterior defect</text>
<text x="140" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#C0705E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">EAS</text>
<text x="256" y="240" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#9B7FB8" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">IAS</text>
<text x="200" y="114" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">perineal body</text>
<text x="200" y="330" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">1. Disrupted EAS</text>
<line x1="300" y1="210" x2="346" y2="210" stroke="#0F766E" stroke-width="2.6" marker-end="url(#sp)"/>
<text x="323" y="200" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#0F766E">overlap</text>
<circle cx="470" cy="210" r="22" fill="#FBF3EF" stroke="#94A3B8" stroke-width="1.2"/>
<circle cx="470" cy="210" r="32" fill="none" stroke="#D9CCE3" stroke-width="9"/>
<ellipse cx="470" cy="132" rx="22" ry="12" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.2"/>
<path d="M 499.8 167.4 A 52 52 0 1 1 440.2 167.4" fill="none" stroke="#E7B6AC" stroke-width="18" stroke-linecap="round"/>
<path d="M 440.2 167.4 Q 470 140 499.8 167.4" fill="none" stroke="#E7B6AC" stroke-width="20" stroke-linecap="round"/>
