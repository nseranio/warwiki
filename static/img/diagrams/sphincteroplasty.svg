<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 416" width="820" height="416" role="img" aria-label="Overlapping anal sphincteroplasty in perineal view with anterior at top. Panel 1: the external anal sphincter ring is disrupted by an anterior defect, its two ends retracted with scar between them, around an intact internal anal sphincter and anal lumen, below the perineal body. Panel 2: the ends are mobilized and overlapped vest-over-pants, secured with two rows of horizontal mattress sutures, restoring a continuous ring with extra anterior bulk. A detail inset shows the double-breasted overlap with mattress sutures passing through both muscle layers, giving more bulk and circumference than an end-to-end apposition. Key: used for symptomatic external-sphincter defects after obstetric injury or trauma; mobilize the scarred ends fully and keep the scar on the muscle for suture purchase; overlapping and end-to-end repairs give similar long-term continence per Cochrane, and continence often deteriorates over years.">
<defs>
<marker id="sp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="818" height="414" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Overlapping anal sphincteroplasty &#8212; repair the disrupted sphincter ring</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">perineal view (anterior up): mobilize the retracted EAS ends, divide the scar, and overlap them</text>
<circle cx="200" cy="210" r="22" fill="#FBF3EF" stroke="#94A3B8" stroke-width="1.2"/>
<circle cx="200" cy="210" r="32" fill="none" stroke="#D9CCE3" stroke-width="9"/>
