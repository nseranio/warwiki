<line x1="451" y1="160" x2="461" y2="160" stroke="#185FA5" stroke-width="1.8"/>
<line x1="479" y1="150" x2="489" y2="150" stroke="#185FA5" stroke-width="1.8"/>
<line x1="479" y1="160" x2="489" y2="160" stroke="#185FA5" stroke-width="1.8"/>
<text x="470" y="172" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">overlapped + mattress sutures</text>
<text x="470" y="330" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">2. Overlapping repair</text>
<rect x="622" y="114" width="156" height="150" rx="12" fill="#F8FAFC" stroke="#EAEDF1" stroke-width="1.2"/>
<text x="700" y="132" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">"Vest-over-pants"</text>
<path d="M 640 166 L 718 166 Q 730 166 730 178 L 730 180" fill="none" stroke="#E7B6AC" stroke-width="12" stroke-linecap="round"/>
<path d="M 760 190 L 682 190 Q 670 190 670 178 L 670 176" fill="none" stroke="#E7B6AC" stroke-width="12" stroke-linecap="round"/>
<path d="M 692 160 L 692 196 M 686 160 L 698 160 M 686 196 L 698 196" fill="none" stroke="#185FA5" stroke-width="1.6"/>
<path d="M 708 160 L 708 196 M 702 160 L 714 160 M 702 196 L 714 196" fill="none" stroke="#185FA5" stroke-width="1.6"/>
<text x="700" y="224" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ends double-breasted &#8594;</text>
<text x="700" y="236" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">more bulk + circumference</text>
<text x="700" y="250" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">than end-to-end apposition</text>
<line x1="40" y1="362" x2="780" y2="362" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="381" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E293B">For symptomatic EAS defects (obstetric OASIS or trauma). Mobilize the scarred ends fully and keep the scar on the muscle for suture purchase.</text>
<text x="40" y="399" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Overlapping and end-to-end give similar long-term continence (Cochrane); continence often deteriorates over years &#8212; counsel accordingly.</text>
</svg>
