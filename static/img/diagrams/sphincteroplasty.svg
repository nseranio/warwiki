<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 461" width="820" height="461" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Overlapping external anal sphincter repair</title>
<desc id="figure-description">Selected full-thickness EAS defects can be repaired by overlapping mobilized ends. End-to-end repair is another option; partial-thickness EAS tears are repaired end-to-end. Overlap does not establish superior long-term continence. An IAS injury requires its own repair; acute obstetric and delayed sphincteroplasty contexts differ. View: Perineal view; anterior up. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: RCOG Green-top Guideline No. 29 (June 2015, third edition), https://www.rcog.org.uk/globalassets/documents/guidelines/gtg-29.pdf; access: official full text; OASIS classification and overlap versus end-to-end repair by injury extent; not a full management pathway. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
