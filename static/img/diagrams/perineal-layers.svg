<text x="478" y="137" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">roof; interface with intrapelvic surgery</text>
