<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 388" width="880" height="388" role="img" aria-label="Coronal section of the urogenital perineum showing its layered architecture between the two ischiopubic rami. From top to bottom: levator ani (pelvic floor) with a midline hiatus; the deep perineal pouch containing the membranous urethra ringed by the rhabdosphincter (the pelvic-fracture urethroplasty plane); the fibrous perineal membrane (roof of the superficial pouch, floor of the deep pouch, and AUS transcorporal landmark); the superficial perineal pouch containing the midline bulb and two lateral crura with their bulbospongiosus and ischiocavernosus muscles (the plane of bulbar urethroplasty and AUS); Colles' fascia (the Fournier's-gangrene spread plane, continuous with dartos and Scarpa's fascia); and skin. A legend tags each layer with its surgical plane.">
<rect x="1" y="1" width="878" height="386" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Layered architecture of the urogenital perineum &#8212; skin to pelvic floor</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">coronal slice: two fascial pouches separated by the perineal membrane &#8212; each layer is a surgical plane</text>
