<circle cx="118" cy="148" r="5" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.8"/>
<text x="108" y="139" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">native</text>
