<text x="380" y="139" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">native</text>
