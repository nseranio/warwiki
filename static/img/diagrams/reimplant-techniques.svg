<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-label="Three antireflux ureteral reimplantation techniques shown on the bladder trigone. Cohen cross-trigonal: an intravesical submucosal tunnel carries the ureter across the trigone to a neo-orifice on the contralateral wall. Politano-Leadbetter: a new superolateral hiatus is created and the ureter tunnels down to a trigonal neo-orifice while the old hiatus is closed. Lich-Gregoir: an extravesical detrusor trough is closed over the ureter at the native orifice, with a cross-section inset showing the detrusor-over-mucosa flap valve. All target a 4 to 5 to 1 tunnel-length to ureter-diameter ratio. Key compares intravesical versus extravesical morbidity and each technique's main penalty.">
<rect x="1" y="1" width="878" height="390" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Antireflux ureteral reimplantation &#8212; three classic tunnels</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">each builds a submucosal flap-valve to a ~4&#8211;5:1 tunnel-length-to-ureter-diameter target</text>
<path d="M 76 282 C 64 114, 118 84, 168 84 C 218 84, 272 114, 260 282 C 248 324, 88 324, 76 282 Z" fill="#F2F6FA" stroke="#4F6F92" stroke-width="2.2" stroke-linejoin="round"/>
