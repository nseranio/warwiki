<text x="168" y="118" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#7FA3C4" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">cross-trigonal tunnel</text>
<text x="168" y="350" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Cohen</text>
