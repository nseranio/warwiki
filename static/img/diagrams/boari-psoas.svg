<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 505" width="860" height="505" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Psoas hitch and Boari flap</title>
<desc id="figure-description">Psoas hitch mobilizes the bladder cephalad; a Boari flap adds a tubularized bladder extension to bridge a longer defect. Reach and flap ratios are approximate planning examples, not guaranteed distances; protect the genitofemoral nerve and preserve a viable broad base. View: Adult distal ureter and bladder, anterior view. Scale: Conceptual schematic; not to scale. Units: Approximate planning lengths: cm. Clinical review pending; no named clinician has signed off. Concept sources: EAU Urological Trauma: urogenital trauma guidelines (2026 web guideline), https://uroweb.org/guidelines/urological-trauma/chapter/urogenital-trauma-guidelines; access: official full text; Renal injury, bladder rupture and ureteral reconstruction principles; figures omit parts of the management algorithms. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
