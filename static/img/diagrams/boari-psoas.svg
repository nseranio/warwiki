<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="Psoas hitch versus Boari flap for bridging a distal ureteral gap. Left panel: a psoas hitch fixes the bladder cephalad to the psoas with hitch sutures and a spatulated submucosal-tunnel ureteroneocystostomy, reaching about 5 to 8 centimeters. Right panel: a Boari flap tubularizes a bladder-wall flap into a ureteral substitute rising to meet the ureter at its apex, reaching about 10 to 15 centimeters, with a base at least 4 centimeters wide and a length-to-base ratio under 3 to 1. Key: often combined, add downward nephropexy for upper-ureteral reach, spatulate the ureter and tubularize over a stent.">
