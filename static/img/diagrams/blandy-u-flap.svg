<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410" role="img" aria-label="Blandy U-flap female vaginal-flap urethroplasty: panel 1 shows a U-shaped anterior-vaginal-wall flap with a proximal pedicle outlined over a strictured urethra with a planned ventral 6 o'clock urethrotomy; panel 2 shows the flap inlaid as a ventral onlay over a 16 to 18 French Foley catheter, sutured to the opened native urethral plate; a cross-section inset shows the native dorsal plate above and the vaginal-flap ventral onlay below around the catheter lumen. Key notes it is a pedicled flap that preserves its vascular plexus, is best for distal and mid-urethral strictures, is contraindicated in lichen sclerosus, and that lateral-based variants reduce the retrusive-meatus problem.">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="838" height="408" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Blandy U-flap &#8212; female ventral-onlay vaginal-flap urethroplasty</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">anterior-vaginal-wall flap (proximal pedicle) inlaid into a ventral (6 o&#8217;clock) urethrotomy to widen the lumen</text>
<rect x="70" y="92" width="180" height="228" rx="16" fill="#F4EEF0" stroke="#D9C6CC" stroke-width="1.3"/>
<text x="160" y="110" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">anterior vaginal wall</text>
<line x1="160" y1="152" x2="160" y2="280" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 4"/>
<path d="M 126 150 L 126 270 Q 126 292 160 292 Q 194 292 194 270 L 194 150" fill="#DCE7F1" fill-opacity="0.7" stroke="#334155" stroke-width="2.6" stroke-linejoin="round"/>
<text x="160" y="174" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7FA3C4" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">U-flap</text>
<ellipse cx="160" cy="228" rx="20" ry="24" fill="none" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="186" y="232" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">stricture</text>
<line x1="160" y1="186" x2="160" y2="264" stroke="#185FA5" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M 126 143 L 126 137 L 194 137 L 194 143" fill="none" stroke="#7FA3C4" stroke-width="1.4"/>
<text x="160" y="131" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#7FA3C4" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">proximal pedicle</text>
<ellipse cx="160" cy="292" rx="9" ry="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<text x="178" y="296" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">meatus</text>
<text x="160" y="342" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">1. U-flap raised, ventral urethrotomy</text>
<line x1="270" y1="206" x2="320" y2="206" stroke="#0F766E" stroke-width="2.6" marker-end="url(#ab)"/>
<rect x="340" y="92" width="180" height="228" rx="16" fill="#F4EEF0" stroke="#D9C6CC" stroke-width="1.3"/>
<path d="M 400 134 C 384 200, 384 200, 412 266" fill="none" stroke="#94A3B8" stroke-width="2.4"/>
<path d="M 460 134 C 476 200, 476 200, 448 266" fill="none" stroke="#94A3B8" stroke-width="2.4"/>
<path d="M 408 140 C 396 200, 396 200, 418 262 L 442 262 C 464 200, 464 200, 452 140 Z" fill="#DCE7F1" stroke="#7FA3C4" stroke-width="1.6"/>
<line x1="430" y1="136" x2="430" y2="268" stroke="#0F766E" stroke-width="3" stroke-dasharray="2 4" stroke-linecap="round"/>
<line x1="402" y1="164.4" x2="412" y2="164.4" stroke="#185FA5" stroke-width="1.3"/>
<line x1="448" y1="164.4" x2="458" y2="164.4" stroke="#185FA5" stroke-width="1.3"/>
<line x1="402" y1="188.8" x2="412" y2="188.8" stroke="#185FA5" stroke-width="1.3"/>
<line x1="448" y1="188.8" x2="458" y2="188.8" stroke="#185FA5" stroke-width="1.3"/>
<line x1="402" y1="213.2" x2="412" y2="213.2" stroke="#185FA5" stroke-width="1.3"/>
<line x1="448" y1="213.2" x2="458" y2="213.2" stroke="#185FA5" stroke-width="1.3"/>
<line x1="402" y1="237.6" x2="412" y2="237.6" stroke="#185FA5" stroke-width="1.3"/>
<line x1="448" y1="237.6" x2="458" y2="237.6" stroke="#185FA5" stroke-width="1.3"/>
<text x="430" y="124" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#7FA3C4" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">inlaid flap</text>
<text x="470" y="192" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Foley</text>
<text x="470" y="206" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">16&#8211;18 Fr</text>
<ellipse cx="430" cy="282" rx="9" ry="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<text x="430" y="342" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">2. Flap inlaid as ventral onlay</text>
<rect x="600" y="110" width="180" height="200" rx="12" fill="#F8FAFC" stroke="#EAEDF1" stroke-width="1.2"/>
<text x="690" y="130" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E293B">Cross-section</text>
<text x="690" y="145" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">ventral-onlay augmentation</text>
<circle cx="690" cy="202" r="50" fill="#E2ECF5"/>
<path d="M 640 202 A 50 50 0 0 1 740 202" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
<path d="M 640 202 A 50 50 0 0 0 740 202" fill="none" stroke="#185FA5" stroke-width="5" stroke-linecap="round"/>
<circle cx="690" cy="202" r="9" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="2 3"/>
<text x="690" y="178" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#94A3B8" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">native dorsal plate</text>
<text x="690" y="236" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">vaginal flap (ventral)</text>
<line x1="40" y1="354" x2="800" y2="354" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="375" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E293B">Pedicled (not a free graft): the flap keeps its submucosal vascular plexus, avoiding buccal-graft donor morbidity. Best for distal / mid strictures.</text>
<text x="40" y="394" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Contraindicated in lichen sclerosus or vaginal atrophy. Lateral-based variants (Romero-Maroto, Simonato) reduce the midline U-flap&#8217;s retrusive meatus.</text>
</svg>
