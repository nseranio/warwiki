<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 453" width="840" height="453" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Blandy vaginal flap urethroplasty</title>
<desc id="figure-description">A proximally based anterior vaginal wall flap augments a ventral urethrotomy while preserving the native dorsal urethral plate. Flap size, tissue quality, pedicle anatomy and catheter size are individualized; the drawing does not specify safe dissection depth. View: Female urethra, ventral operative view and section. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: EAU Urethral Strictures: disease management in females (2026 web guideline), https://uroweb.org/guidelines/urethral-strictures/chapter/disease-management-in-females; access: official full text; Vaginal flap and graft reconstruction concepts; exact operative geometry remains for clinical review. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
