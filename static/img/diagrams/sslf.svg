<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 466" width="860" height="466" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Sacrospinous ligament fixation</title>
<desc id="figure-description">Vaginal suspension sutures engage the sacrospinous ligament medial to the ischial spine, near important pudendal and sciatic neurovascular structures. Distances are approximate; no location is guaranteed nerve-free and suture depth matters. View: Female right pelvic sidewall, posterior schematic. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: An anatomic evaluation of the sacrospinous ligament colpopexy (1989 anatomical study), https://pubmed.ncbi.nlm.nih.gov/2928906/; access: abstract checked; Suture location and adjacent neurovascular risk; fingerbreadths cannot be converted to a fixed centimeter distance. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
