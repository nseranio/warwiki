<path d="M 560 232 C 596 220, 604 264, 580 300 L 560 296 C 572 268, 568 246, 552 236 Z" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.6" stroke-linejoin="round"/>
<text x="590" y="214" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ischial spine</text>
<path d="M 506 230 L 168 280 L 172 300 L 510 248 Z" fill="#E0D4B4" stroke="#B0995F" stroke-width="1.6" stroke-linejoin="round"/>
<text x="330" y="256" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#B0995F" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">sacrospinous ligament</text>
<text x="330" y="269" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">(coccygeus muscle)</text>
<path d="M 470 110 C 520 140, 548 170, 556 210" fill="none" stroke="#CA8A04" stroke-width="8" stroke-linecap="round"/>
<text x="452" y="104" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#CA8A04" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">sciatic nerve</text>
<path d="M 556 206 C 582 232, 580 270, 556 304 C 540 322, 520 326, 506 318" fill="none" stroke="#B91C1C" stroke-width="5" stroke-linecap="round"/>
<text x="626" y="300" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">pudendal</text>
<text x="626" y="312" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">nerve &amp; vessels</text>
<circle cx="556" cy="246" r="16" fill="none" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="556" y="332" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">danger zone</text>
