<text x="354" y="360" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#CF9DA3" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">vaginal apex</text>
