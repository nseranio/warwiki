<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 382" width="860" height="382" role="img" aria-label="Sacrospinous ligament fixation shown on a posterior view of the right pelvic sidewall. The sacrospinous ligament with its overlying coccygeus muscle runs from the ischial spine to the sacrum and coccyx. The pudendal nerve and vessels loop behind the ischial spine and the sciatic nerve passes above it, marking a danger zone at the spine. Suspension sutures from the vaginal apex are placed into the ligament 1.5 to 2 centimeters, about two fingerbreadths, medial to the ischial spine, in the safe zone. Key: a native-tissue apical repair usually done right-sided and unilateral; placing sutures too lateral risks the pudendal bundle and sciatic nerve causing gluteal pain; the repair pulls the apex posteriorly, raising later anterior-compartment recurrence compared with sacrocolpopexy.">
<rect x="1" y="1" width="858" height="380" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Sacrospinous ligament fixation (SSLF) &#8212; suspend the apex, spare the nerve</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">posterior view of the right pelvic sidewall: place sutures 1.5&#8211;2 cm medial to the ischial spine</text>
<path d="M 130 96 C 188 110, 196 220, 176 296 L 150 318 L 124 296 C 110 220, 104 120, 130 96 Z" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.8" stroke-linejoin="round"/>
<line x1="138" y1="150" x2="162" y2="150" stroke="#B6A98C" stroke-width="0.9"/>
<line x1="138" y1="194" x2="162" y2="194" stroke="#B6A98C" stroke-width="0.9"/>
<line x1="138" y1="238" x2="162" y2="238" stroke="#B6A98C" stroke-width="0.9"/>
<text x="150" y="90" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">sacrum</text>
<text x="150" y="334" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">coccyx</text>
