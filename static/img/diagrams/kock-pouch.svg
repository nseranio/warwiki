<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Kock pouch continent cutaneous urinary diversion. The main drawing shows a detubularized low-pressure ileal reservoir with two intussuscepted nipple valves: an afferent antireflux valve on the left receiving both ureters, and an efferent continence valve at the bottom leading through the efferent limb to a flush catheterizable stoma emptied by self-catheterization. An inset shows the nipple-valve mechanism: bowel intussuscepted into the reservoir forms a double-walled finger whose central channel is compressed shut by rising pouch pressure, making it a one-way valve that provides continence and prevents reflux.">
