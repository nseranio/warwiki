<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Kock continent ileal reservoir</title>
<desc id="figure-description">A detubularized ileal reservoir has an afferent antireflux nipple and an efferent continence nipple connected to the catheterizable stoma. Historical urinary diversion configuration. Intussusception and fixation are simplified; valve failure, obstruction and reoperation remain possible. View: Reservoir and valve mechanism, conceptual view. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: Skinner et al.: clinical experience with the Kock ileal reservoir (1984 original series), https://pubmed.ncbi.nlm.nih.gov/6502796/; access: abstract checked; Afferent and efferent intussuscepted limbs; historical construction, not a present-day preferred diversion claim. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
