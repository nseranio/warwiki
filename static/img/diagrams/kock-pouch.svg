<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">a low-pressure ileal reservoir guarded by two intussuscepted nipple valves: antireflux in, continence out</text>
