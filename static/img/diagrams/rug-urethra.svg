<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 384" width="820" height="384" role="img" aria-label="Retrograde urethrogram urethral silhouette: the contrast column from the bladder through the prostatic, membranous (a normal narrowing), bulbar, and penile urethra to the fossa navicularis and meatus, with a focal bulbar stricture and a dashed outline marking the spongiofibrosis that is not opacified, so RUG underestimates the true stricture length.">
<defs>
<marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
</defs>
<rect x="1" y="1" width="818" height="382" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="38" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Retrograde urethrogram &#8212; reading the urethral silhouette</text>
<text x="40" y="57" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">the contrast column (RPO 45&#176; view); a stricture is a focal narrowing &#8212; and RUG underestimates its true length</text>
<ellipse cx="120" cy="196" rx="42" ry="46" fill="#DCE7F2" stroke="#5B7FA6" stroke-width="2"/>
<text x="112" y="262" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#5B7FA6">bladder</text>
<rect x="388" y="170" width="64" height="52" rx="10" fill="none" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="4 3"/>
<polygon points="182,181 216,178 246,183 266,188 292,187 326,175 380,178 402,183 411,192 420,192 429,183 452,179 505,183 598,184 658,181 690,188 700,192 700,200 690,204 658,211 598,208 505,209 452,213 429,209 420,200 411,200 402,209 380,214 326,217 292,205 266,204 246,209 216,214 182,211" fill="#8C99A8" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="216" y1="178" x2="216" y2="112" stroke="#475569" stroke-width="1"/>
<circle cx="216" cy="178" r="1.8" fill="#475569"/>
<text x="216" y="108" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">prostatic</text>
<line x1="326" y1="175" x2="332" y2="112" stroke="#475569" stroke-width="1"/>
<circle cx="326" cy="175" r="1.8" fill="#475569"/>
<text x="332" y="108" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">bulbar</text>
<line x1="560" y1="184" x2="560" y2="112" stroke="#475569" stroke-width="1"/>
<circle cx="560" cy="184" r="1.8" fill="#475569"/>
<text x="560" y="108" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">penile (pendulous)</text>
<line x1="266" y1="204" x2="250" y2="300" stroke="#475569" stroke-width="1"/>
<circle cx="266" cy="204" r="1.8" fill="#475569"/>
<text x="250" y="304" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">membranous</text>
<text x="250" y="318" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">(normal narrowing)</text>
<line x1="674" y1="210" x2="690" y2="300" stroke="#475569" stroke-width="1"/>
<circle cx="674" cy="210" r="1.8" fill="#475569"/>
<text x="700" y="304" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">fossa navicularis</text>
<text x="715" y="196" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">meatus</text>
<line x1="415" y1="200" x2="415" y2="286" stroke="#B91C1C" stroke-width="1"/>
<circle cx="415" cy="200" r="1.8" fill="#B91C1C"/>
<text x="415" y="300" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">stricture</text>
<path d="M 450 172 C 505 134, 550 138, 568 146" fill="none" stroke="#C0392B" stroke-width="1.1" marker-end="url(#fa)"/>
<text x="574" y="140" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#C0392B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">spongiofibrosis</text>
<text x="574" y="154" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">not opacified &#8212; true length is</text>
<text x="574" y="167" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">~1 cm longer at each shoulder</text>
</svg>
