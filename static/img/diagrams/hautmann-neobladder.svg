<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 408" width="820" height="408" role="img" aria-label="Hautmann W-configuration ileal neobladder in two panels. Panel 1: 60 to 70 cm of distal ileum is opened along the antimesenteric border and folded into a four-limb W, the adjacent limb edges joined by suture seams to form the posterior plate. Panel 2: the plate is closed anteriorly into a near-spherical low-pressure reservoir (Laplace P equals 2T over r), with the ureters reimplanted at the top by a Le Duc-Camey trough or chimney and the urethra anastomosed at the most dependent point for voiding per urethra.">
