<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 488" width="820" height="488" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Hautmann W neobladder</title>
<desc id="figure-description">Detubularized ileum is folded in a W configuration and closed into a reservoir connected to the urethra and ureters. Bowel length is illustrative. The Laplace relationship is for an ideal thin-walled sphere; a biological reservoir is not a perfect sphere or guaranteed low-pressure system. View: Bowel folding sequence and reservoir schematic. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: Hautmann et al.: the ileal neobladder (1988 original technical series), https://pubmed.ncbi.nlm.nih.gov/3336101/; access: abstract checked; Antimesenteric detubularization and reservoir construction. Ideal-sphere pressure model is a teaching approximation. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
