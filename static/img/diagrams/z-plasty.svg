<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Z-plasty transposition geometry</title>
<desc id="figure-description">Two triangular flaps transpose across a central limb to reorient a scar and increase length along the original axis. Angle-dependent gains are theoretical geometry. Calculated ideal equal-limb gains are about 24%, 47%, 73%, 99% and 124% for 30°, 45°, 60°, 75° and 90°. Actual gain depends on tissue mobility; 90-degree reorientation applies to the 60-degree example. View: Equal-limb planar flap model, 60-degree example. Scale: Conceptual schematic; not to scale. Units: Angles: degrees; theoretical length change: percent. Clinical review pending; no named clinician has signed off. Concept sources: Salam and Amin: the basic Z-plasty (2003 authored procedural guide), https://www.aafp.org/afp/2003/0601/p2329.pdf; access: full-text excerpts checked; Equal-limb geometric transposition; theoretical length gain differs from living-tissue gain. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
