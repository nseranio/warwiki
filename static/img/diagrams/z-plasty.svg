<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Z-plasty geometry: a central limb along the scar with two 60-degree triangular flaps that transpose across it, rotating the scar 90 degrees and lengthening the central axis, with a reference table of limb angle versus theoretical lengthening.">
<defs>
<marker id="az" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="758" height="428" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="40" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Z-plasty &#8212; transposition geometry</text>
<text x="40" y="59" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">two triangular flaps swap across the central limb: the scar reorients 90&#176; and the central axis lengthens</text>
<line x1="240" y1="126" x2="240" y2="346" stroke="#64748B" stroke-width="1" stroke-dasharray="3 4"/>
<polygon points="160.3,144 240,190 240,282" fill="#DCE7F1" stroke="none"/>
<polygon points="240,190 240,282 319.7,328" fill="#FCE9CD" stroke="none"/>
<line x1="160.3" y1="144" x2="240" y2="190" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
<line x1="240" y1="282" x2="319.7" y2="328" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
<line x1="240" y1="190" x2="240" y2="282" stroke="#185FA5" stroke-width="3.4" stroke-linecap="round"/>
<text x="178.3" y="163" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.3" stroke-linejoin="round">a</text>
<text x="301.7" y="313" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.3" stroke-linejoin="round">b</text>
<text x="228" y="210" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.3" stroke-linejoin="round">60&#176;</text>
<text x="252" y="270" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.3" stroke-linejoin="round">60&#176;</text>
<text x="248" y="239" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.3" stroke-linejoin="round">central limb</text>
<text x="248" y="253" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.3" stroke-linejoin="round">(the scar)</text>
<path d="M 174.3 170 C 236 206, 276 202, 270 224" fill="none" stroke="#0F766E" stroke-width="1.6" marker-end="url(#az)"/>
<path d="M 305.7 302 C 244 266, 204 270, 210 248" fill="none" stroke="#0F766E" stroke-width="1.6" marker-end="url(#az)"/>
<text x="240" y="368" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.3" stroke-linejoin="round">flaps transpose &#8594; scar rotates 90&#176;,</text>
<text x="240" y="384" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.3" stroke-linejoin="round">central axis lengthens</text>
<rect x="470" y="110" width="252" height="206" rx="10" fill="#F8FAFC" stroke="#EAEDF1" stroke-width="1.2"/>
<text x="490" y="138" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Limb angle &#8594; lengthening</text>
<text x="490" y="154" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">theoretical gain along the central axis</text>
<text x="496" y="180" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#334155">30&#176;</text>
<text x="590" y="180" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#334155">25%</text>
<text x="496" y="204" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#334155">45&#176;</text>
<text x="590" y="204" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#334155">50%</text>
<rect x="482" y="213" width="228" height="22" rx="5" fill="#DCFCE7"/>
<text x="496" y="228" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">60&#176;</text>
<text x="590" y="228" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">75%</text>
<text x="496" y="252" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#334155">75&#176;</text>
<text x="590" y="252" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#334155">100%</text>
<text x="496" y="276" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#334155">90&#176;</text>
<text x="590" y="276" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#334155">120%</text>
<text x="490" y="306" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B">60&#176; is the workhorse (50&#8211;70% clinically)</text>
</svg>
