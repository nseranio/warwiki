<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Male pressure-flow classification</title>
<desc id="figure-description">BOOI equals Pdet at Qmax minus twice Qmax. Greater than 40 is obstructed, 20 through 40 is equivocal, and below 20 is unobstructed. At Qmax 10 mL/s, Pdet 40 gives BOOI 20, Pdet 60 gives 40, and Pdet 70 gives 50. Applies to the male ICS classification, not female BOO. Low-pressure low-flow does not independently establish detrusor underactivity; dots are synthetic. View: Adult male pressure-flow study; hypothetical dots. Scale: Quantitative axes; synthetic examples. Units: Qmax: mL/s; Pdet at Qmax: cm H2O; BOOI: index. Clinical review pending; no named clinician has signed off. Concept sources: ICS Standards 2020–2021 (2020–2021 collected terminology), https://www.ics.org/Publications/ICS%20Standards%202020-2021.pdf; access: official full text; Female POP terminology and male pressure-flow definitions; BOOI section 5.12 of adult male terminology. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
