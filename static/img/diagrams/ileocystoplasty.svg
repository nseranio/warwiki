<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 384" width="860" height="384" role="img" aria-label="Three-step clam ileocystoplasty: detubularize the ileal segment along its antimesenteric border into a flat plate; reconfigure it into a U-shaped cup; and sew the cup onto the bivalved native bladder at an equatorial anastomosis to form a high-capacity low-pressure reservoir.">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
</defs>
<rect x="1" y="1" width="858" height="382" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="38" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Clam ileocystoplasty &#8212; the cup-patch</text>
<text x="40" y="57" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">a detubularized ileal cup sewn onto the bivalved bladder makes a low-pressure, high-capacity reservoir</text>
<line x1="276" y1="172" x2="312" y2="172" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="548" y1="172" x2="584" y2="172" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="92" y="132" width="116" height="66" rx="10" fill="#F3E2D6" stroke="#B89B7A" stroke-width="2"/>
<path d="M 100 150 Q 150 155 200 150" fill="none" stroke="#B89B7A" stroke-width="1" opacity="0.5"/>
<path d="M 100 166 Q 150 171 200 166" fill="none" stroke="#B89B7A" stroke-width="1" opacity="0.5"/>
<path d="M 100 182 Q 150 187 200 182" fill="none" stroke="#B89B7A" stroke-width="1" opacity="0.5"/>
<path d="M 110 198 L 150 236 L 190 198 Z" fill="#F3C7C0" stroke="#D89B92" stroke-width="1.2"/>
<line x1="128" y1="198" x2="141.2" y2="230" stroke="#D89B92" stroke-width="1"/>
<line x1="150" y1="198" x2="150" y2="230" stroke="#D89B92" stroke-width="1"/>
<line x1="172" y1="198" x2="158.8" y2="230" stroke="#D89B92" stroke-width="1"/>
<line x1="92" y1="132" x2="208" y2="132" stroke="#B91C1C" stroke-width="2.4" stroke-dasharray="5 3"/>
<text x="150" y="122" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#B91C1C">antimesenteric border opened</text>
<text x="150" y="256" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">1. Detubularize</text>
<text x="150" y="272" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B">open the ileal segment flat</text>
<path d="M 384 130 L 384 178 Q 384 212 430 212 Q 476 212 476 178 L 476 130 L 460 130 L 460 178 Q 460 196 430 196 Q 400 196 400 178 L 400 130 Z" fill="#E9D6BE" stroke="#B89B7A" stroke-width="2"/>
<text x="430" y="256" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">2. Reconfigure</text>
<text x="430" y="272" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B">fold into a U / S-shaped cup</text>
<path d="M 654 172 Q 654 116 706 116 Q 758 116 758 172 Z" fill="#E9D6BE" stroke="#B89B7A" stroke-width="2"/>
<path d="M 654 172 Q 654 232 706 232 Q 758 232 758 172 Z" fill="#DCE7F2" stroke="#5B7FA6" stroke-width="2"/>
<line x1="654" y1="172" x2="758" y2="172" stroke="#185FA5" stroke-width="2"/>
<line x1="662" y1="168" x2="666" y2="176" stroke="#185FA5" stroke-width="1.4"/>
<line x1="676" y1="168" x2="680" y2="176" stroke="#185FA5" stroke-width="1.4"/>
<line x1="690" y1="168" x2="694" y2="176" stroke="#185FA5" stroke-width="1.4"/>
<line x1="704" y1="168" x2="708" y2="176" stroke="#185FA5" stroke-width="1.4"/>
<line x1="718" y1="168" x2="722" y2="176" stroke="#185FA5" stroke-width="1.4"/>
<line x1="732" y1="168" x2="736" y2="176" stroke="#185FA5" stroke-width="1.4"/>
<line x1="746" y1="168" x2="750" y2="176" stroke="#185FA5" stroke-width="1.4"/>
<text x="706" y="136" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#B89B7A">ileal cup-patch</text>
<text x="706" y="212" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5B7FA6">native bladder</text>
<text x="764" y="172" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">anastomosis</text>
<text x="706" y="256" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">3. Augment</text>
<text x="706" y="272" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B">sew the cup onto the bivalved bladder</text>
</svg>
