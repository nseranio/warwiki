<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 474" width="860" height="474" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Three-piece penile implant</title>
<desc id="figure-description">Two corporal cylinders connect to a scrotal pump and a fluid reservoir. Inflation transfers fluid to the cylinders; deflation returns it to the reservoir. Current model-specific IFU and review of reservoir hazards remain required; this is not implantation guidance. View: Male pelvis and penile section, conceptual device view. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: Boston Scientific: AMS 700 penile implant (manufacturer product family), https://www.bostonscientific.com/us/en/healthcare-professionals/products/penile-prosthesis/ams-700-inflatable-penile-prosthesis/fp00000138.html; access: official product information; current IFU not checked; Three-piece device concept only. Volume, preparation and reservoir placement require the selected device IFU. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
