<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 339" width="820" height="339" role="img" aria-label="Vesicovaginal fistula repair shown in cross-section through the vesicovaginal septum. Left panel: a fistula tract connects the bladder lumen above to the vagina lumen below through gaps in both the bladder and vaginal walls, with edges freshened. Right panel: after wide mobilization, the bladder and vaginal walls are closed as independent layers with a watertight first layer and an imbricating second layer, and the bladder and vaginal suture lines are deliberately offset so they do not stack; an optional vascularized interposition flap lies between the layers. Key: mobilize at least 1 to 2 centimeters beyond the defect for a tension-free repair, offset the seams to avoid a through-and-through weak point and re-fistulization, and add a Martius, peritoneal, or omental interposition for recurrent, radiated, or large fistulae though it is not mandatory for a simple primary repair.">
<defs>
<marker id="vv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="818" height="337" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Vesicovaginal fistula &#8212; tension-free, non-overlapping layered closure</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">cross-section of the vesicovaginal septum: mobilize widely, then close in layers with the suture lines offset</text>
