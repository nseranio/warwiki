<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-label="Yang-Monti catheterizable channel construction in three steps. Step 1: a short 2 to 2.5 centimeter ileal segment on its mesentery. Step 2: the segment is opened (detubularized) into a flat sheet and re-rolled the perpendicular way, so the bowel circumference becomes the new tube length. Step 3: re-tubularized over a 12 to 14 French catheter into a long narrow channel about 5 to 6 centimeters, or about 10 to 12 centimeters as a double spiral Monti. Key: a Mitrofanoff alternative when the appendix is unusable, sparing bowel and the ileocecal valve, implanted with a flap-valve continence mechanism, with the bowel-loop end prone to stomal stenosis.">
<defs>
<marker id="ym" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
<marker id="ym2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#185FA5"/></marker>
</defs>
<rect x="1" y="1" width="878" height="342" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Yang-Monti channel &#8212; re-tubularize the perpendicular way</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">a short ileal segment opened and re-rolled across its axis: the old circumference becomes the new length</text>
<path d="M 104 226 L 196 226 L 170 282 L 130 282 Z" fill="#E7D9CB" stroke="#B99873" stroke-width="1.2"/>
<line x1="132" y1="230" x2="141" y2="278" stroke="#B99873" stroke-width="0.9"/>
<line x1="150" y1="230" x2="150" y2="278" stroke="#B99873" stroke-width="0.9"/>
<line x1="168" y1="230" x2="159" y2="278" stroke="#B99873" stroke-width="0.9"/>
<text x="150" y="296" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#B99873" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">mesentery</text>
<rect x="106" y="166" width="88" height="60" rx="8" fill="#F3DBD2" stroke="#CC9079" stroke-width="2"/>
<ellipse cx="106" cy="196" rx="10" ry="30" fill="#E2ECF5" stroke="#CC9079" stroke-width="2"/>
<ellipse cx="194" cy="196" rx="10" ry="30" fill="#F3DBD2" stroke="#CC9079" stroke-width="2"/>
<path d="M 106 152 L 106 146 L 194 146 L 194 152" fill="none" stroke="#64748B" stroke-width="1.2"/>
<text x="150" y="138" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1E293B">~2&#8211;2.5 cm</text>
<text x="150" y="328" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B">1. Short ileal segment</text>
<line x1="218" y1="196" x2="262" y2="196" stroke="#0F766E" stroke-width="2.4" marker-end="url(#ym)"/>
<text x="240" y="186" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#0F766E">open</text>
<rect x="300" y="162" width="140" height="68" rx="5" fill="#F3DBD2" stroke="#CC9079" stroke-width="2"/>
<rect x="300" y="226" width="140" height="8" fill="#E7D9CB" stroke="#B99873" stroke-width="1"/>
<line x1="310" y1="196" x2="430" y2="196" stroke="#94A3B8" stroke-width="1.1" stroke-dasharray="3 4"/>
<text x="370" y="200" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">old bowel axis</text>
<path d="M 284 166 C 270 190, 270 202, 284 226" fill="none" stroke="#185FA5" stroke-width="1.8" marker-end="url(#ym2)"/>
<text x="370" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">re-roll the long way</text>
<path d="M 300 246 L 300 252 L 440 252 L 440 246" fill="none" stroke="#15803D" stroke-width="1.2"/>
<text x="370" y="266" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">circumference &#8594; new length</text>
<text x="370" y="328" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B">2. Detubularize</text>
<line x1="460" y1="196" x2="504" y2="196" stroke="#0F766E" stroke-width="2.4" marker-end="url(#ym)"/>
<text x="482" y="186" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#0F766E">roll</text>
<rect x="540" y="183" width="180" height="26" rx="13" fill="#F3DBD2" stroke="#CC9079" stroke-width="2"/>
<line x1="546" y1="183" x2="714" y2="183" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="526" y1="196" x2="734" y2="196" stroke="#0F766E" stroke-width="3" stroke-dasharray="2 4" stroke-linecap="round"/>
<path d="M 540 220 L 540 226 L 720 226 L 720 220" fill="none" stroke="#15803D" stroke-width="1.2"/>
<text x="630" y="240" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#15803D">~5&#8211;6 cm  (12&#8211;14 Fr)</text>
<text x="630" y="172" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">over catheter</text>
<text x="630" y="328" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B">3. Re-tubularize</text>
<text x="630" y="260" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B">double (spiral) Monti &#8594; ~10&#8211;12 cm</text>
</svg>
