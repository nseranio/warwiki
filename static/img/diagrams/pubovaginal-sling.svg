<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">sagittal: the patient&#8217;s own fascia slung under the bladder neck, arms tied over the rectus sheath &#8212; mesh-free</text>
