<text x="590" y="232" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">meatus</text>
