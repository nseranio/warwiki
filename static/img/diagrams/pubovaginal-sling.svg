<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 379" width="820" height="379" role="img" aria-label="Autologous fascial pubovaginal sling in sagittal view. A strip of the patient's own fascia, from the rectus abdominis or fascia lata, is placed as a hammock beneath the bladder neck; its two arms pass retropubically behind the pubic symphysis and are tied over the anterior rectus fascia, where the graft was harvested and the defect closed. A cough compresses the urethra against the pubis. An inset compares where slings sit: the pubovaginal sling is autologous and compressive at the bladder neck, while the synthetic midurethral sling is supportive at the midurethra. Key: AUA/SUFU prefers the pubovaginal sling for intrinsic sphincter deficiency, a fixed urethra, mesh-averse patients, prior radiation, and concurrent urethral reconstruction; it uses a combined vaginal and abdominal approach with tension set just snug, is durable and mesh-free, but has higher early retention and de novo urgency than the midurethral sling.">
<defs>
<marker id="ps" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="818" height="377" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
