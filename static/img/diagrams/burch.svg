<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 352" width="820" height="352" role="img" aria-label="Burch colposuspension shown in a retropubic space-of-Retzius view. The back of the pubic symphysis is at top with the superior pubic rami sweeping laterally, each carrying Cooper's iliopectineal ligament. The bladder, bladder neck, and urethra lie in the midline. Two non-absorbable sutures per side pass through the anterior vaginal wall lateral to the bladder neck (paravaginal tissue) and are tied up to Cooper's ligament, elevating the bladder neck. A note contrasts the Marshall-Marchetti-Krantz procedure, which anchors to the pubic symphysis periosteum and risks osteitis pubis, which Burch avoids. Key: a mesh-free retropubic urethropexy with durable cure comparable to retropubic midurethral sling at 13 years, sutures tied snug and not over-corrected to avoid voiding dysfunction, best used at the time of sacrocolpopexy or in mesh-averse patients, with a higher posterior-prolapse rate than the midurethral sling, and cystoscopy is performed.">
<defs>
<marker id="bu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
</defs>
<rect x="1" y="1" width="818" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Burch colposuspension &#8212; lift the bladder neck to Cooper&#8217;s ligament</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">retropubic (space of Retzius) view: paravaginal sutures lateral to the bladder neck, tied to the iliopectineal ligament</text>
<rect x="312" y="118" width="36" height="40" rx="6" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.4"/>
<text x="330" y="110" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">pubic symphysis (back)</text>
<path d="M 314 126 C 260 120, 210 132, 180 158" fill="none" stroke="#B6A98C" stroke-width="12" stroke-linecap="round"/>
<path d="M 306 120 C 256 114, 212 124, 184 148" fill="none" stroke="#B0995F" stroke-width="5" stroke-linecap="round"/>
<path d="M 346 126 C 400 120, 450 132, 480 158" fill="none" stroke="#B6A98C" stroke-width="12" stroke-linecap="round"/>
<path d="M 354 120 C 404 114, 448 124, 476 148" fill="none" stroke="#B0995F" stroke-width="5" stroke-linecap="round"/>
<text x="180" y="138" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#B0995F" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Cooper's</text>
<text x="180" y="150" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#B0995F" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ligament</text>
<text x="480" y="138" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#B0995F" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Cooper's</text>
<text x="480" y="150" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#B0995F" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ligament</text>
<path d="M 274 224 C 266 178, 394 178, 386 224 C 376 252, 284 252, 274 224 Z" fill="#E2ECF5" stroke="#4F6F92" stroke-width="1.8" stroke-linejoin="round"/>
<text x="330" y="206" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4F6F92" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">bladder</text>
<rect x="323" y="248" width="14" height="62" rx="7" fill="#64748B"/>
<rect x="327.5" y="248" width="5" height="62" rx="2.5" fill="#FFFFFF"/>
<text x="344" y="300" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">urethra</text>
<text x="318" y="262" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">bladder neck</text>
<ellipse cx="290" cy="276" rx="22" ry="16" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="1.6"/>
<ellipse cx="370" cy="276" rx="22" ry="16" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="1.6"/>
<text x="330" y="312" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#CF9DA3" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">anterior vaginal wall (paravaginal)</text>
<path d="M 300 268 C 260 210, 240 170, 234 134" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round"/>
<circle cx="234" cy="134" r="2.6" fill="#185FA5"/>
