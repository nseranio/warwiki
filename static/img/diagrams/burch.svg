<path d="M 360 268 C 400 210, 420 170, 426 134" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round"/>
<circle cx="426" cy="134" r="2.6" fill="#185FA5"/>
<path d="M 376 276 C 400 210, 420 170, 448 140" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round"/>
<circle cx="448" cy="140" r="2.6" fill="#185FA5"/>
<line x1="374 " y1="262" x2="382" y2="244" stroke="#15803D" stroke-width="1.8" marker-end="url(#bu)"/>
<text x="238" y="214" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">2 sutures</text>
<text x="238" y="226" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">per side</text>
<text x="426" y="210" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">elevate</text>
<circle cx="330" cy="158" r="4" fill="none" stroke="#B45309" stroke-width="1.8"/>
<line x1="330" y1="162" x2="330" y2="246" stroke="#B45309" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="592" y="120" width="196" height="84" rx="10" fill="#FFF7ED" stroke="#F4D9B0" stroke-width="1.2"/>
<text x="606" y="142" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#B45309">vs MMK</text>
<text x="606" y="158" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Marshall-Marchetti-Krantz</text>
<text x="606" y="172" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">anchors to the symphysis</text>
<text x="606" y="186" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">periosteum &#8594; osteitis-pubis</text>
<text x="606" y="198" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">risk (Burch avoids this).</text>
</svg>
