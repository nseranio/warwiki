<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 454" width="860" height="454" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">S3 neuromodulation lead</title>
<desc id="figure-description">A tined quadripolar lead enters a sacral foramen and connects to an implanted pulse generator. Bellows and toe responses can support S3 targeting. Combine imaging, motor and sensory responses; device-specific lead and generator placement vary. View: Posterior sacrum, conceptual device placement. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: Matzel et al.: standardized SNM electrode placement (2017 expert technical standard), https://pubmed.ncbi.nlm.nih.gov/28975677/; access: abstract checked; Fluoroscopic anatomy plus motor/sensory responses; a response alone does not establish optimal lead placement. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
