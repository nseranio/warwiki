<path d="M 319 229 l 7 -5 M 319 229 l 7 5" fill="none" stroke="#334155" stroke-width="1.2"/>
<text x="285" y="194" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">quadripolar lead</text>
<text x="351" y="246" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">tines anchor it</text>
<rect x="468" y="232" width="52" height="40" rx="10" fill="#CBD5E1" stroke="#64748B" stroke-width="1.8"/>
<circle cx="494" cy="252" r="9" fill="none" stroke="#64748B" stroke-width="1.4"/>
<text x="494" y="290" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">IPG</text>
<text x="494" y="303" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B">pulse generator</text>
<text x="494" y="316" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B">(upper buttock)</text>
<rect x="588" y="120" width="234" height="180" rx="12" fill="#F0FAF3" stroke="#CDEBD7" stroke-width="1.3"/>
<text x="604" y="144" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#166534">S3 response = correct lead</text>
<text x="604" y="160" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">seen on intraoperative test stimulation</text>
<circle cx="610" cy="182" r="3.4" fill="#15803D"/>
<text x="622" y="186" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Bellows</text>
<text x="622" y="199" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">inward levator/perineal contraction</text>
<circle cx="610" cy="216" r="3.4" fill="#15803D"/>
<text x="622" y="220" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Great-toe</text>
<text x="622" y="233" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">plantar flexion of the ipsilateral hallux</text>
<circle cx="610" cy="250" r="3.4" fill="#15803D"/>
<text x="622" y="254" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Sensation</text>
<text x="622" y="267" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">pulling in rectum / perineum / genitals</text>
<text x="604" y="290" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B">S2 = clamp/heel rotation; S4 = bellows only, no toe.</text>
</svg>
