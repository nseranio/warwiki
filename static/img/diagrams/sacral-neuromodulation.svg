<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 398" width="860" height="398" role="img" aria-label="Sacral neuromodulation shown on a posterior sacrum with the S1 through S4 foramina. A tined quadripolar lead is placed through the S3 foramen, with four electrode contacts straddling the foramen and tines anchoring it, tunneled to an implantable pulse generator in the upper buttock. A callout lists the S3 responses that confirm correct placement on test stimulation: the bellows (inward levator and perineal contraction), plantar flexion of the great toe, and a pulling sensation in the rectum, perineum, or genitals; S2 gives clamp and heel rotation, S4 gives bellows without toe movement. Key: two-stage or PNE testing for refractory urgency-frequency, urge incontinence, non-obstructive retention, and fecal incontinence, progressing to implant only after at least 50 percent symptom improvement.">
<rect x="1" y="1" width="858" height="396" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Sacral neuromodulation &#8212; tined lead in the S3 foramen</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">posterior sacrum: a quadripolar lead through S3, tunneled to a buttock pulse generator; the S3 response confirms placement</text>
<path d="M 162 108 C 154 150, 180 250, 220 320 L 242 344 L 258 344 L 280 320 C 320 250, 346 150, 338 108 C 290 96, 210 96, 162 108 Z" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.8" stroke-linejoin="round"/>
