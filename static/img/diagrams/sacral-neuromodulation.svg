<text x="250" y="181.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">S2</text>
<ellipse cx="219" cy="216" rx="9" ry="6.5" fill="#FBF5EF" stroke="#B91C1C" stroke-width="2"/>
<ellipse cx="281" cy="216" rx="9" ry="6.5" fill="#FBF5EF" stroke="#B91C1C" stroke-width="2"/>
<text x="250" y="219.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">S3</text>
<ellipse cx="224" cy="252" rx="9" ry="6.5" fill="#FBF5EF" stroke="#C4B79A" stroke-width="1.2"/>
<ellipse cx="276" cy="252" rx="9" ry="6.5" fill="#FBF5EF" stroke="#C4B79A" stroke-width="1.2"/>
<text x="250" y="255.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">S4</text>
<circle cx="281" cy="216" r="15" fill="none" stroke="#B91C1C" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="250" y="92" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">posterior sacrum</text>
<text x="250" y="358" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">coccyx</text>
<path d="M 470 250 C 400 250, 360 235, 299 224" fill="none" stroke="#334155" stroke-width="3.4" stroke-linecap="round"/>
<rect x="294" y="220" width="6" height="6" rx="1.5" fill="#185FA5"/>
