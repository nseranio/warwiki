<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" role="img" aria-label="Webster progressive perineal maneuvers for a posterior urethral distraction defect, shown as four escalating steps that shorten the route from the mobilized bulbar urethra to the prostatic apex. Step 1, mobilize the bulbar urethra distally. Step 2, split the corpora by separating the crura in the midline. Step 3, inferior pubectomy, wedge-resecting the lower pubis to create a subpubic tunnel. Step 4, supracrural rerouting around a penile crus, which closes the gap but underperforms. Key: climb the ladder only as far as a tension-free mucosa-to-mucosa anastomosis requires; partial inferior pubectomy is preferred over abandoned total pubectomy; supracrural rerouting has about 75 percent restenosis in Kizer 2007 versus about 80 percent success with the abdominoperineal approach; a high proximal stump above the inferior pubic margin on MRI predicts needing pubectomy or an abdominoperineal repair.">
<defs>
<marker id="pw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="898" height="430" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Webster progressive perineal maneuvers &#8212; closing a posterior distraction defect</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">each step shortens the route from the mobilized bulbar urethra to the prostatic apex &#8212; do the least that achieves a tension-free anastomosis</text>
<ellipse cx="150" cy="110" rx="16" ry="11" fill="#E7D2A6" stroke="#C29B52" stroke-width="1.6"/>
<circle cx="150" cy="110" r="4" fill="#FFFFFF" stroke="#C29B52" stroke-width="1.4"/>
<rect x="114" y="130" width="72" height="22" rx="6" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.4"/>
<ellipse cx="130" cy="184" rx="13" ry="19" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="1.5"/>
<ellipse cx="170" cy="184" rx="13" ry="19" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="1.5"/>
<line x1="150" y1="250" x2="150" y2="196" stroke="#185FA5" stroke-width="6" stroke-linecap="round"/>
<circle cx="150" cy="250" r="3.5" fill="#185FA5"/>
<line x1="178" y1="122" x2="178" y2="196" stroke="#B91C1C" stroke-width="3" stroke-linecap="round"/>
<text x="184" y="162" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">gap</text>
<circle cx="98" cy="282" r="11" fill="#EAF1F8" stroke="#185FA5" stroke-width="1.5"/>
<text x="98" y="286" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#185FA5">1</text>
<text x="116" y="286" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Mobilize bulb</text>
<ellipse cx="370" cy="110" rx="16" ry="11" fill="#E7D2A6" stroke="#C29B52" stroke-width="1.6"/>
<circle cx="370" cy="110" r="4" fill="#FFFFFF" stroke="#C29B52" stroke-width="1.4"/>
<rect x="334" y="130" width="72" height="22" rx="6" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.4"/>
<ellipse cx="338" cy="184" rx="13" ry="19" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="1.5"/>
<ellipse cx="402" cy="184" rx="13" ry="19" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="1.5"/>
<line x1="362" y1="184" x2="350" y2="184" stroke="#0F766E" stroke-width="1.6" marker-end="url(#pw)"/>
<line x1="378" y1="184" x2="390" y2="184" stroke="#0F766E" stroke-width="1.6" marker-end="url(#pw)"/>
<line x1="370" y1="250" x2="370" y2="172" stroke="#185FA5" stroke-width="6" stroke-linecap="round"/>
<circle cx="370" cy="250" r="3.5" fill="#185FA5"/>
<line x1="398" y1="122" x2="398" y2="172" stroke="#B91C1C" stroke-width="3" stroke-linecap="round"/>
<text x="404" y="150" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">gap</text>
<circle cx="318" cy="282" r="11" fill="#EAF1F8" stroke="#185FA5" stroke-width="1.5"/>
<text x="318" y="286" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#185FA5">2</text>
<text x="336" y="286" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Split corpora</text>
<ellipse cx="590" cy="110" rx="16" ry="11" fill="#E7D2A6" stroke="#C29B52" stroke-width="1.6"/>
<circle cx="590" cy="110" r="4" fill="#FFFFFF" stroke="#C29B52" stroke-width="1.4"/>
<path d="M 554 130 L 626 130 L 626 146 L 602 146 L 590 158 L 578 146 L 554 146 Z" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.4" stroke-linejoin="round"/>
<text x="590" y="172" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">wedge out</text>
<ellipse cx="558" cy="184" rx="13" ry="19" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="1.5"/>
<ellipse cx="622" cy="184" rx="13" ry="19" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="1.5"/>
<line x1="582" y1="184" x2="570" y2="184" stroke="#0F766E" stroke-width="1.6" marker-end="url(#pw)"/>
<line x1="598" y1="184" x2="610" y2="184" stroke="#0F766E" stroke-width="1.6" marker-end="url(#pw)"/>
<line x1="590" y1="250" x2="590" y2="150" stroke="#185FA5" stroke-width="6" stroke-linecap="round"/>
<circle cx="590" cy="250" r="3.5" fill="#185FA5"/>
<line x1="618" y1="122" x2="618" y2="150" stroke="#B91C1C" stroke-width="3" stroke-linecap="round"/>
<text x="624" y="139" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">gap</text>
<circle cx="538" cy="282" r="11" fill="#EAF1F8" stroke="#185FA5" stroke-width="1.5"/>
<text x="538" y="286" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#185FA5">3</text>
<text x="556" y="286" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Inferior pubectomy</text>
<ellipse cx="810" cy="110" rx="16" ry="11" fill="#E7D2A6" stroke="#C29B52" stroke-width="1.6"/>
<circle cx="810" cy="110" r="4" fill="#FFFFFF" stroke="#C29B52" stroke-width="1.4"/>
<path d="M 774 130 L 846 130 L 846 146 L 822 146 L 810 158 L 798 146 L 774 146 Z" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.4" stroke-linejoin="round"/>
<text x="810" y="172" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">wedge out</text>
<ellipse cx="778" cy="184" rx="13" ry="19" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="1.5"/>
<ellipse cx="842" cy="184" rx="13" ry="19" fill="#F3DBDC" stroke="#CF9DA3" stroke-width="1.5"/>
<line x1="802" y1="184" x2="790" y2="184" stroke="#0F766E" stroke-width="1.6" marker-end="url(#pw)"/>
<line x1="818" y1="184" x2="830" y2="184" stroke="#0F766E" stroke-width="1.6" marker-end="url(#pw)"/>
<path d="M 810 250 L 810 208 C 780 184, 780 120, 810 122" fill="none" stroke="#185FA5" stroke-width="6" stroke-linecap="round"/>
<circle cx="810" cy="250" r="3.5" fill="#185FA5"/>
<text x="834" y="134" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">&#10003;</text>
<circle cx="758" cy="282" r="11" fill="#EAF1F8" stroke="#185FA5" stroke-width="1.5"/>
<text x="758" y="286" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#185FA5">4</text>
<text x="776" y="286" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Supracrural reroute</text>
<text x="116" y="300" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">free the bulbar urethra distally</text>
<text x="336" y="300" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">separate the crura in the midline</text>
<text x="556" y="300" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">wedge-resect the inferior pubis</text>
<text x="776" y="300" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">route around a penile crus</text>
<text x="150" y="94" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#C29B52" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">prostatic apex</text>
<text x="96" y="186" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#CF9DA3" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">crura</text>
<text x="150" y="264" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">bulbar urethra</text>
<line x1="40" y1="350" x2="860" y2="350" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="372" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E293B">Climb the ladder only as far as a tension-free, mucosa-to-mucosa anastomosis requires; partial inferior pubectomy is preferred (total pubectomy is abandoned).</text>
<text x="40" y="392" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#B45309">Supracrural rerouting (step 4) underperforms: Kizer 2007 found ~75% restenosis vs ~80% success with the abdominoperineal repair &#8212; prefer it over rerouting.</text>
<text x="40" y="412" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">A high / above-the-inferior-pubic-margin proximal stump on MRI strongly predicts needing pubectomy or an abdominoperineal repair.</text>
</svg>
