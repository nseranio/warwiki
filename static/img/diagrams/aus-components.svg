<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 436" width="860" height="436" role="img" aria-label="Artificial urinary sphincter AMS 800 on a male pelvic sagittal with its three fluid-connected components: a cuff occluding the bulbar urethra, a pressure-regulating balloon in the retropubic space of Retzius behind the pubic symphysis and in front of the bladder set to 61 to 70 centimeters of water, and a control pump in the scrotum. The bulbar urethra passes beneath the subpubic arch. A how-it-cycles panel: at rest the cuff is fluid-filled and the urethra is closed for continence; to void the patient squeezes the pump, moving fluid from the cuff to the balloon so the cuff opens; the balloon then auto-refills the cuff over one to three minutes to re-close it. Key: leave deactivated about 6 weeks before activation, always deactivate the cuff before any catheterization or cystoscopy, use a bladder-neck cuff for female, pediatric, or redo cases, and recognize urethral atrophy and erosion as the signature late failures.">
<rect x="1" y="1" width="858" height="434" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Artificial urinary sphincter (AMS 800) &#8212; three components</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">cuff + scrotal pump + pressure-regulating balloon, all fluid-connected &#8212; the gold standard for male SUI</text>
<ellipse cx="214" cy="150" rx="54" ry="40" fill="#E2ECF5" stroke="#4F6F92" stroke-width="2"/>
<text x="208" y="150" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4F6F92" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">bladder</text>
<path d="M 220 188 C 226 224, 232 250, 250 270 C 274 296, 322 306, 364 312 C 398 316, 424 318, 446 320" fill="none" stroke="#94A3B8" stroke-width="9" stroke-linecap="round"/>
<path d="M 220 188 C 226 224, 232 250, 250 270 C 274 296, 322 306, 364 312 C 398 316, 424 318, 446 320" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="420" y="338" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#94A3B8" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">bulbar urethra</text>
<g transform="rotate(-10 312 250)">
  <rect x="298" y="214" width="28" height="74" rx="13" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.6"/>
  <line x1="305" y1="227" x2="305" y2="275" stroke="#B6A98C" stroke-width="1" opacity="0.5"/>
</g>
<line x1="324" y1="218" x2="338" y2="210" stroke="#E2E8F0" stroke-width="1"/>
<text x="340" y="210" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">pubic symphysis</text>
<ellipse cx="261" cy="212" rx="22" ry="16" fill="#CFE0F0" stroke="#185FA5" stroke-width="2.4"/>
<text x="261" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">PRB</text>
<g transform="rotate(-4 360 312)"><rect x="343" y="303" width="34" height="18" rx="9" fill="#CFE0F0" stroke="#185FA5" stroke-width="4"/></g>
<text x="360" y="296" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">cuff</text>
<ellipse cx="378" cy="392" rx="20" ry="26" fill="#CFE0F0" stroke="#185FA5" stroke-width="2.4"/>
<ellipse cx="378" cy="390" rx="40" ry="30" fill="none" stroke="#B6A98C" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="378" y="396" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">pump</text>
<text x="422" y="392" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">scrotum</text>
<path d="M 366 320 C 378 340, 378 356, 378 366" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/>
<path d="M 378 366 C 330 322, 286 254, 270 228" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/>
<line x1="283" y1="210" x2="470" y2="196" stroke="#E2E8F0" stroke-width="1"/>
<text x="474" y="194" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Pressure-reg. balloon</text>
<text x="474" y="206" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">retropubic &#183; 61-70 cmH&#8322;O</text>
<line x1="378" y1="312" x2="470" y2="250" stroke="#E2E8F0" stroke-width="1"/>
<text x="474" y="248" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Cuff</text>
<text x="474" y="260" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">occludes bulbar urethra</text>
<line x1="398" y1="392" x2="470" y2="304" stroke="#E2E8F0" stroke-width="1"/>
<text x="474" y="302" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Control pump</text>
<text x="474" y="314" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">scrotal; squeeze to void</text>
<rect x="600" y="96" width="222" height="248" rx="12" fill="#F0FAF3" stroke="#CDEBD7" stroke-width="1.3"/>
<text x="616" y="120" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#166534">How it cycles</text>
<circle cx="622" cy="150" r="9" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/>
<text x="622" y="154" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#166534" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">1</text>
<text x="640" y="150" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">At rest</text>
<text x="640" y="164" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">cuff is fluid-filled &#8594;</text>
<text x="640" y="176" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">urethra closed &#8594; continent</text>
<circle cx="622" cy="208" r="9" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/>
<text x="622" y="212" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#166534" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">2</text>
<text x="640" y="208" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">To void</text>
<text x="640" y="222" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">squeeze the pump &#8594; fluid moves</text>
<text x="640" y="234" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">cuff &#8594; PRB &#8594; cuff opens</text>
<circle cx="622" cy="266" r="9" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/>
<text x="622" y="270" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#166534" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">3</text>
<text x="640" y="266" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Auto-refill</text>
<text x="640" y="280" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">PRB pushes fluid back over</text>
<text x="640" y="292" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">1-3 min &#8594; cuff re-closes</text>
</svg>
