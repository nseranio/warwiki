<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 436" width="860" height="436" role="img" aria-label="Artificial urinary sphincter AMS 800 in sagittal view with its three fluid-connected components: a cuff occluding the bulbar urethra, a pressure-regulating balloon in the retropubic space set to 61 to 70 centimeters of water, and a control pump in the scrotum. A how-it-cycles panel: at rest the cuff is fluid-filled and the urethra is closed for continence; to void the patient squeezes the pump, moving fluid from the cuff to the balloon so the cuff opens; the balloon then auto-refills the cuff over one to three minutes to re-close it. Key: leave deactivated about 6 weeks before activation, always deactivate the cuff before any catheterization or cystoscopy, use a bladder-neck cuff for female, pediatric, or redo cases, and recognize urethral atrophy and erosion as the signature late failures.">
<rect x="1" y="1" width="858" height="434" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Artificial urinary sphincter (AMS 800) &#8212; three components</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">cuff + scrotal pump + pressure-regulating balloon, all fluid-connected &#8212; the gold standard for male SUI</text>
<ellipse cx="160" cy="214" rx="16" ry="30" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.4"/>
<text x="150" y="256" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">pubis</text>
<path d="M 196 168 C 188 116, 268 104, 300 132 C 318 150, 312 184, 292 196 C 262 214, 210 200, 196 168 Z" fill="#E2ECF5" stroke="#4F6F92" stroke-width="2" stroke-linejoin="round"/>
<text x="252" y="150" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4F6F92" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">bladder</text>
<path d="M 232 196 C 224 230, 214 252, 220 280 C 226 308, 260 322, 320 326 C 360 328, 392 330, 420 332" fill="none" stroke="#94A3B8" stroke-width="9" stroke-linecap="round"/>
<path d="M 232 196 C 224 230, 214 252, 220 280 C 226 308, 260 322, 320 326 C 360 328, 392 330, 420 332" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="395" y="348" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#94A3B8" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">bulbar urethra</text>
<ellipse cx="250" cy="244" rx="24" ry="18" fill="#CFE0F0" stroke="#185FA5" stroke-width="2.4"/>
<text x="250" y="248" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">PRB</text>
<rect x="244" y="302" width="38" height="18" rx="9" fill="#CFE0F0" stroke="#185FA5" stroke-width="4"/>
<text x="263" y="294" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">cuff</text>
<ellipse cx="360" cy="392" rx="20" ry="26" fill="#CFE0F0" stroke="#185FA5" stroke-width="2.4"/>
<ellipse cx="360" cy="392" rx="40" ry="30" fill="none" stroke="#B6A98C" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="360" y="396" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">pump</text>
<text x="404" y="392" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">scrotum</text>
<path d="M 274 318 C 320 340, 344 360, 354 368" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/>
<path d="M 360 366 C 320 320, 268 280, 256 262" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/>
<line x1="274" y1="244" x2="430" y2="200" stroke="#E2E8F0" stroke-width="1"/>
<text x="434" y="198" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Pressure-reg. balloon</text>
<text x="434" y="210" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">61-70 cmH&#8322;O</text>
<line x1="282" y1="310" x2="430" y2="252" stroke="#E2E8F0" stroke-width="1"/>
<text x="434" y="250" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Cuff</text>
<text x="434" y="262" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">occludes bulbar urethra</text>
<line x1="380" y1="392" x2="430" y2="304" stroke="#E2E8F0" stroke-width="1"/>
<text x="434" y="302" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Control pump</text>
<text x="434" y="314" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">scrotal; squeeze to void</text>
<rect x="600" y="96" width="222" height="248" rx="12" fill="#F0FAF3" stroke="#CDEBD7" stroke-width="1.3"/>
<text x="616" y="120" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#166534">How it cycles</text>
<circle cx="622" cy="150" r="9" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/>
<text x="622" y="154" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#166534" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">1</text>
<text x="640" y="150" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">At rest</text>
<text x="640" y="164" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">cuff is fluid-filled &#8594;</text>
<text x="640" y="176" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">urethra closed &#8594; continent</text>
<circle cx="622" cy="208" r="9" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/>
<text x="622" y="212" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#166534" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">2</text>
<text x="640" y="208" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">To void</text>
<text x="640" y="222" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">squeeze the pump &#8594; fluid moves</text>
<text x="640" y="234" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">cuff &#8594; PRB &#8594; cuff opens</text>
<circle cx="622" cy="266" r="9" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/>
<text x="622" y="270" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#166534" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">3</text>
<text x="640" y="266" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Auto-refill</text>
<text x="640" y="280" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">PRB pushes fluid back over</text>
<text x="640" y="292" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">1-3 min &#8594; cuff re-closes</text>
</svg>
