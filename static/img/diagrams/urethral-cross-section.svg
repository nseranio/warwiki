<text x="40" y="59" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">a stricture is scar within the corpus spongiosum that encases and compresses the lumen</text>
