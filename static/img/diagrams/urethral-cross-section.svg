<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" role="img" aria-label="Two transverse urethral cross-sections. Normal: an open stellate lumen lined by epithelium within the vascular corpus spongiosum and tunica. Stricture: a ring of spongiofibrosis scar encases and compresses the lumen to a pinhole.">
