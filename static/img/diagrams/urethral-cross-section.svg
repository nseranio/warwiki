<text x="410" y="384" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">the depth of spongiofibrosis (Devine classification) determines severity and favors open reconstruction over endoscopic repair</text>
