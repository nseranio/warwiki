<path d="M 246 200 C 300 210, 346 216, 372 226 C 390 232, 396 242, 386 250 C 396 258, 418 270, 450 282 C 500 300, 542 304, 568 308" fill="none" stroke="#9A6A03" stroke-width="6" stroke-linecap="round"/>
<path d="M 246 200 C 300 210, 346 216, 372 226 C 390 232, 396 242, 386 250 C 396 258, 418 270, 450 282 C 500 300, 542 304, 568 308" fill="none" stroke="#C98A04" stroke-width="4" stroke-linecap="round"/>
