<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 556" width="840" height="556" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Pudendal nerve course</title>
<desc id="figure-description">The nerve leaves through the greater sciatic foramen, passes near the ischial spine and sacrospinous ligament, enters the lesser sciatic foramen, and travels in Alcock&apos;s canal before branching. Branches and their origins vary. The drawing is not a needle trajectory or a safe zone for blind suturing or nerve block. View: Pelvic sidewall, schematic lateral view. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: Chhabra et al.: pudendal MR neurography with cadaveric correlation (2016 cadaver study), https://pubmed.ncbi.nlm.nih.gov/27551340/; access: abstract checked; Proximal course at the sciatic notch, ischial spine and Alcock canal; distal branching varies. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
