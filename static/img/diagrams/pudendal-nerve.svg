<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 476" width="840" height="476" role="img" aria-label="Posterolateral schematic of the pudendal nerve course: S2-S4 roots converge and exit the greater sciatic foramen below piriformis, hook around the ischial spine and sacrospinous ligament, re-enter the lesser sciatic foramen into Alcock's canal on the obturator internus, then divide into the inferior rectal, perineal, and dorsal nerves. The ischial spine (sacrospinous-fixation suture zone and pudendal-block landmark) and Alcock's canal (entrapment) are flagged as risk zones.">
<rect x="1" y="1" width="838" height="474" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="38" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Pudendal nerve (S2&#8211;S4) &#8212; course and surgical risk zones</text>
<text x="40" y="57" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">greater sciatic foramen &#8594; hook around the ischial spine &#8594; lesser sciatic foramen &#8594; Alcock&#8217;s canal &#8594; three branches</text>
<path d="M 96 92 L 168 98 L 154 268 L 120 272 Z" fill="#E8E3D6" stroke="#A89B80" stroke-width="1.6"/>
<text x="118" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">sacrum</text>
<path d="M 150 128 C 230 118, 320 122, 372 140 L 360 162 C 300 150, 220 150, 152 156 Z" fill="#E7C8C1" stroke="#C49A92" stroke-width="1.4"/>
<text x="258" y="134" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#9A6A62">piriformis</text>
<path d="M 150 258 L 384 232 L 388 246 L 152 272 Z" fill="#E3CFA8" stroke="#BB9F68" stroke-width="1.4"/>
<path d="M 138 268 L 402 352 L 392 366 L 130 282 Z" fill="#E3CFA8" stroke="#BB9F68" stroke-width="1.4"/>
<path d="M 416 220 L 420 260 L 378 240 Z" fill="#E8E3D6" stroke="#A89B80" stroke-width="1.6"/>
<ellipse cx="402" cy="392" rx="24" ry="26" fill="#E8E3D6" stroke="#A89B80" stroke-width="1.6"/>
<text x="352" y="404" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B">ischial tuberosity</text>
<path d="M 506 314 C 560 308, 602 330, 604 366 C 606 398, 566 414, 524 408 C 498 404, 492 374, 496 348 C 498 330, 498 320, 506 314 Z" fill="#E7C8C1" stroke="#C49A92" stroke-width="1.4"/>
<text x="550" y="372" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#9A6A62">obturator</text>
<text x="550" y="385" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#9A6A62">internus</text>
<text x="304" y="176" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B">greater sciatic</text>
<text x="304" y="188" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B">foramen</text>
<text x="356" y="304" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B">lesser sciatic</text>
<text x="356" y="316" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B">foramen</text>
<text x="196" y="250" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#BB9F68">sacrospinous lig.</text>
<path d="M 162 156 C 200 156, 222 178, 246 200" fill="none" stroke="#C98A04" stroke-width="3" stroke-linecap="round"/>
<text x="150" y="159" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9A6A03">S2</text>
