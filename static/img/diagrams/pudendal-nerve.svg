<circle cx="650" cy="372" r="3.2" fill="#C98A04"/>
<text x="668" y="380" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#9A6A03" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">perineal n.</text>
<path d="M 568 308 C 612 304, 648 302, 684 300" fill="none" stroke="#C98A04" stroke-width="3" stroke-linecap="round"/>
<circle cx="684" cy="300" r="3.2" fill="#C98A04"/>
<text x="690" y="300" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#9A6A03" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">dorsal n. of penis / clitoris</text>
<line x1="388" y1="240" x2="470" y2="150" stroke="#B91C1C" stroke-width="1"/>
<circle cx="388" cy="240" r="1.8" fill="#B91C1C"/>
<text x="476" y="142" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">ischial spine</text>
<text x="476" y="156" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#64748B">SSLF suture zone &amp; pudendal-block</text>
<text x="476" y="169" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#64748B">landmark &#8212; NVB just lateral</text>
<line x1="498" y1="296" x2="560" y2="200" stroke="#B91C1C" stroke-width="1"/>
<circle cx="498" cy="296" r="1.8" fill="#B91C1C"/>
<text x="566" y="192" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Alcock's canal</text>
<text x="566" y="206" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#64748B">entrapment &#8594; pudendal neuralgia</text>
</svg>
