<path d="M 396 158 L 404 158 M 400 158 L 400 258 M 396 258 L 404 258" fill="none" stroke="#15803D" stroke-width="1.3"/>
<text x="360" y="340" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">BMG onlay + stent</text>
