<text x="150" y="156" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">stricture</text>
<text x="150" y="334" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">longitudinal</text>
