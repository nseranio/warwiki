<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 398" width="820" height="398" role="img" aria-label="Buccal mucosa graft ureteroplasty. On the left, a ureteral stricture is opened by a non-transecting longitudinal ureterotomy across the narrowing. In the middle, a buccal mucosa graft is sewn in as an onlay patch over a double-J stent, widening the caliber, with suture lines around the graft. The cross-section inset shows the buccal graft replacing the dorsal arc of the ureter wall around the lumen, the whole repair wrapped in a lobulated ring of omentum or perinephric fat that supplies the free graft; the graft may be placed as a dorsal or ventral onlay.">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="818" height="396" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Buccal mucosa graft ureteroplasty</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">open the stricture longitudinally, patch it with an onlay graft over a stent, and wrap the free graft for vascular take</text>
