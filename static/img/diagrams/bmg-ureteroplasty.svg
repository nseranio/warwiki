<text x="600" y="226" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#7FA3C4" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">lumen</text>
<text x="600" y="302" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#CBB668" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">omental / fat wrap</text>
<text x="600" y="314" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">feeds the free graft</text>
<text x="600" y="354" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">dorsal or ventral onlay</text>
