<text x="224" y="314" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Extraperitoneal  ~63%</text>
<rect x="138" y="326" width="172" height="24" rx="12" fill="#DCFCE7" stroke="#166534" stroke-width="1.2"/>
