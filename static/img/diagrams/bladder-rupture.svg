<text x="522" y="152" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">(intraperitoneal)</text>
<text x="674" y="122" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">urinary</text>
<text x="674" y="136" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">ascites</text>
<line x1="626" y1="126" x2="670" y2="128" stroke="#475569" stroke-width="1"/>
