<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 512" width="820" height="512" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Bladder rupture compartments</title>
<desc id="figure-description">Extraperitoneal leakage stays around the bladder; intraperitoneal leakage communicates with the peritoneal cavity. Uncomplicated extraperitoneal injury usually permits catheter drainage; traumatic intraperitoneal rupture usually requires repair. Complex extraperitoneal and selected iatrogenic injuries need separate management. View: Bladder and peritoneum, conceptual sagittal sections. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: EAU Urological Trauma: urogenital trauma guidelines (2026 web guideline), https://uroweb.org/guidelines/urological-trauma/chapter/urogenital-trauma-guidelines; access: official full text; Renal injury, bladder rupture and ureteral reconstruction principles; figures omit parts of the management algorithms. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
