<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 432" width="820" height="432" role="img" aria-label="Two coronal bladder panels. Extraperitoneal rupture: a tear at the bladder base leaks urine into the perivesical space below the peritoneal reflection, usually managed by catheter drainage. Intraperitoneal rupture: a dome tear spills urine into the peritoneal cavity among bowel loops as urinary ascites, requiring operative repair.">
<rect x="1" y="1" width="818" height="430" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="38" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Bladder rupture &#8212; extraperitoneal vs intraperitoneal</text>
<text x="40" y="57" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">the tear&#8217;s position relative to the peritoneal reflection drives the urine-leak pattern and the management</text>
