<text x="596" y="314" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Intraperitoneal  ~32%</text>
<rect x="510" y="326" width="172" height="24" rx="12" fill="#FEE2E2" stroke="#991B1B" stroke-width="1.2"/>
<text x="596" y="342" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#991B1B">always operative repair</text>
</svg>
