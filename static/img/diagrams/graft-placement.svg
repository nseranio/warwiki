<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" role="img" aria-label="Buccal-mucosa graft placement configurations shown in cross-section of the bulbar urethra, with dorsal toward the corpora cavernosa and ventral toward the skin. Dorsal onlay (Barbagli): the graft lines the dorsal wall of the lumen and is quilted to the tunica albuginea of the corpora. Ventral onlay: the graft lines the ventral wall and is supported by the corpus spongiosum closed over it. Dorsal inlay (Asopa): the urethra is opened ventrally and the graft is inlaid into the dorsal plate. Key: no side always wins, dorsal is currently preferred for bulbar strictures about 66 to 34 percent, and the graft must be quilted to well-vascularized support to avoid shear, hematoma, and dead space.">
<rect x="1" y="1" width="878" height="382" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">BMG graft placement &#8212; where the graft sits decides its bed</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">cross-section of the bulbar urethra (dorsal = toward corpora) &#8212; the graft must lie on well-vascularized support</text>
<text x="76" y="134" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">dorsal</text>
<line x1="76" y1="142" x2="76" y2="234" stroke="#64748B" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="76" y="250" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">ventral</text>
<circle cx="140" cy="132" r="20" fill="#E7D9CB" stroke="#B99873" stroke-width="1.4"/>
<circle cx="180" cy="132" r="20" fill="#E7D9CB" stroke="#B99873" stroke-width="1.4"/>
<circle cx="160" cy="188" r="44" fill="#F3DEDF" stroke="#CF9DA3" stroke-width="1.8"/>
<path d="M 149.7 184.2 A 11 11 0 0 1 170.3 184.2" fill="none" stroke="#185FA5" stroke-width="6" stroke-linecap="round"/>
<line x1="153" y1="176" x2="153" y2="154" stroke="#B45309" stroke-width="1.3"/>
<line x1="160" y1="176" x2="160" y2="154" stroke="#B45309" stroke-width="1.3"/>
<line x1="167" y1="176" x2="167" y2="154" stroke="#B45309" stroke-width="1.3"/>
<circle cx="160" cy="188" r="11" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
<text x="160" y="266" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Dorsal onlay</text>
<text x="160" y="282" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Barbagli</text>
<text x="160" y="300" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">bed: tunica albuginea</text>
<circle cx="420" cy="132" r="20" fill="#E7D9CB" stroke="#B99873" stroke-width="1.4"/>
<circle cx="460" cy="132" r="20" fill="#E7D9CB" stroke="#B99873" stroke-width="1.4"/>
<circle cx="440" cy="188" r="44" fill="#F3DEDF" stroke="#CF9DA3" stroke-width="1.8"/>
<path d="M 450.3 191.8 A 11 11 0 0 1 429.7 191.8" fill="none" stroke="#185FA5" stroke-width="6" stroke-linecap="round"/>
<line x1="433" y1="200" x2="433" y2="218" stroke="#B45309" stroke-width="1.3"/>
<line x1="440" y1="200" x2="440" y2="218" stroke="#B45309" stroke-width="1.3"/>
<line x1="447" y1="200" x2="447" y2="218" stroke="#B45309" stroke-width="1.3"/>
<circle cx="440" cy="188" r="11" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
<text x="440" y="266" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Ventral onlay</text>
<text x="440" y="282" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">spongioplasty over graft</text>
<text x="440" y="300" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">bed: corpus spongiosum</text>
<circle cx="700" cy="132" r="20" fill="#E7D9CB" stroke="#B99873" stroke-width="1.4"/>
<circle cx="740" cy="132" r="20" fill="#E7D9CB" stroke="#B99873" stroke-width="1.4"/>
<circle cx="720" cy="188" r="44" fill="#F3DEDF" stroke="#CF9DA3" stroke-width="1.8"/>
<path d="M 710 232 L 720 200 L 730 232" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="3 3"/>
<path d="M 709 184 A 11 11 0 0 1 731 184" fill="#DCE7F1" stroke="#185FA5" stroke-width="4"/>
<circle cx="720" cy="188" r="11" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
<line x1="750" y1="222" x2="732" y2="208" stroke="#94A3B8" stroke-width="1.2"/>
<text x="754" y="226" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#94A3B8" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">ventral access</text>
<text x="720" y="266" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Dorsal inlay</text>
<text x="720" y="282" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Asopa</text>
<text x="720" y="300" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">ventral access, dorsal bed</text>
<line x1="204" y1="132" x2="230" y2="124" stroke="#B99873" stroke-width="0.9"/>
<text x="232" y="126" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#B99873" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">corpora</text>
<line x1="200" y1="212" x2="226" y2="220" stroke="#CF9DA3" stroke-width="0.9"/>
<text x="228" y="222" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#CF9DA3" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.1" stroke-linejoin="round">spongiosum</text>
<line x1="40" y1="334" x2="840" y2="334" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="354" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E293B">No side always wins. Dorsal is currently preferred for bulbar strictures (~66% vs 34%); ventral suits a robust spongiosum.</text>
<text x="40" y="372" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Whichever side: quilt the graft to its bed to eliminate shear, hematoma, and dead space &#8212; graft take depends on imbibition, inosculation, and neovascularization.</text>
</svg>
