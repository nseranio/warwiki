<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 483" width="860" height="483" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Studer orthotopic neobladder</title>
<desc id="figure-description">A detubularized reservoir connects to the urethra, while a separate tubular afferent limb receives the ureters. Low-pressure storage alone does not establish continence or upper-tract safety; outlet competence, unobstructed drainage, emptying and surveillance matter. View: Ileal reservoir and afferent limb, conceptual view. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: Bianchi et al.: Studer orthotopic neobladder, a modified technique (2016 technical series), https://pubmed.ncbi.nlm.nih.gov/26627374/; access: abstract checked; Detubularized reservoir and separate tubular afferent limb. Modified technique, not universal dimensions. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
