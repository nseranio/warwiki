<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="860" height="390" role="img" aria-label="Studer orthotopic ileal neobladder. The distal ileum is detubularized and cross-folded into a spherical low-pressure reservoir, which is anastomosed to the urethra at its most dependent point; the proximal ileum stays intact as an isoperistaltic afferent Studer limb that receives both ureters. An inset explains why detubularization matters: an intact tube generates peristaltic pressure spikes, but opening and folding it into a large-radius sphere breaks the contraction waves and lowers pressure by the law of Laplace, which protects the kidneys and enables daytime continence. Key: continent orthotopic diversion to the native urethra needs a competent rhabdosphincter and a tumor-free urethral margin, is emptied by Valsalva plus scheduled clean intermittent catheterization, the afferent limb gives a low-grade antireflux effect, and lifelong vitamin B12 and metabolic-acidosis surveillance is required after ileal resection with common early nocturnal enuresis.">
<defs>
<marker id="sn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
<rect x="1" y="1" width="858" height="388" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Studer orthotopic ileal neobladder</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">detubularized ileum cross-folded into a low-pressure sphere; an intact afferent limb takes the ureters</text>
<path d="M 210 96 C 222 130, 294 150, 300 162" fill="none" stroke="#185FA5" stroke-width="3.4" stroke-linecap="round"/>
<path d="M 330 96 C 318 130, 294 150, 300 162" fill="none" stroke="#185FA5" stroke-width="3.4" stroke-linecap="round"/>
<text x="210" y="90" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">ureters</text>
<path d="M 300 162 C 306 188, 300 200, 294 208" fill="none" stroke="#CC9079" stroke-width="15" stroke-linecap="round"/>
<path d="M 300 162 C 306 188, 300 200, 294 208" fill="none" stroke="#FBEFE9" stroke-width="7" stroke-linecap="round"/>
<text x="366" y="168" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">afferent</text>
<text x="366" y="180" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">(Studer) limb</text>
<circle cx="300" cy="162" r="6" fill="none" stroke="#185FA5" stroke-width="1.8"/>
<ellipse cx="270" cy="250" rx="92" ry="76" fill="#F3DBD2" stroke="#CC9079" stroke-width="2.2"/>
<path d="M 190 230 Q 270 214 350 234" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="3 3"/>
<path d="M 186 268 Q 270 286 352 266" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="270" y="248" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">detubularized</text>
<text x="270" y="264" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#CC9079" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">reservoir</text>
<path d="M 270 326 L 270 354" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
<path d="M 270 326 L 270 354" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="270" cy="328" r="5" fill="none" stroke="#64748B" stroke-width="1.8"/>
<text x="262" y="350" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">urethra</text>
<text x="262" y="362" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">(most dependent point)</text>
<rect x="546" y="92" width="278" height="208" rx="12" fill="#F8FAFC" stroke="#EAEDF1" stroke-width="1.2"/>
<text x="560" y="112" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Why detubularize?</text>
<rect x="566" y="132" width="120" height="26" rx="13" fill="#F3DBD2" stroke="#CC9079" stroke-width="1.8"/>
<path d="M 590 145 q 14 -12 28 0 q 14 12 28 0" fill="none" stroke="#B91C1C" stroke-width="2"/>
<text x="700" y="142" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">intact tube</text>
<text x="700" y="154" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">peristaltic pressure spikes</text>
<line x1="626" y1="164" x2="626" y2="184" stroke="#0F766E" stroke-width="1.8" marker-end="url(#sn)"/>
<circle cx="626" cy="214" r="26" fill="#F3DBD2" stroke="#CC9079" stroke-width="1.8"/>
<line x1="604" y1="208" x2="648" y2="210" stroke="#185FA5" stroke-width="1.3" stroke-dasharray="2 3"/>
<text x="700" y="208" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#15803D" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">folded sphere</text>
<text x="700" y="220" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">big radius, broken waves</text>
<text x="700" y="232" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">&#8594; low pressure (Laplace)</text>
<text x="566" y="266" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Low storage pressure protects the kidneys</text>
<text x="566" y="278" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">and is what makes daytime continence possible.</text>
</svg>
