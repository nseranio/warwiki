<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 512" width="820" height="512" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Bricker and Wallace anastomoses</title>
<desc id="figure-description">Bricker joins each ureter separately to bowel; Wallace joins spatulated ureters into a shared plate before the bowel anastomosis. A shared outlet can endanger both upper tracts; this drawing does not rank outcomes. View: Ureters and ileal conduit, conceptual anterior view. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: EAU Muscle-invasive and Metastatic Bladder Cancer: urinary diversion (2026 web guideline), https://uroweb.org/guidelines/muscle-invasive-and-metastatic-bladder-cancer/chapter/disease-management; access: official full text; Diversion families and selection; not a technical atlas or comparative stricture-rate source. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
