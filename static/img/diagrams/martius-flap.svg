<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">fibrofatty flap from the labium majus, tunneled to the midline as a vascularized buttress over a repair</text>
