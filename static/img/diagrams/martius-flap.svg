<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 475" width="830" height="475" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Martius labial fat-pad flap</title>
<desc id="figure-description">A labial fibrofatty flap is mobilized on a preserved vascular pedicle and tunneled to cover a nearby urethral or vaginal repair. Pedicle choice and dissection depend on anatomy; avoid inferring that every illustrated vessel or flap size is universal. Interposition is selective. View: Female perineum, anterior up. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: EAU Non-neurogenic Female LUTS: disease management (2026 web guideline), https://uroweb.org/guidelines/non-neurogenic-female-luts/chapter/disease-management; access: official full text; Continence operations and fistula-repair principles; does not validate exact suture trajectories. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
