<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 382" width="830" height="382" role="img" aria-label="Martius labial fat-pad flap shown on a frontal vulva in two steps. Step 1, harvest: a vertical incision over the right labium majus exposes the fibrofatty pad, which has a dual blood supply — an anterior pedicle from the external pudendal artery and a posterior pedicle from the internal pudendal artery. Step 2, interposition: the flap is raised on one pedicle, tunneled subcutaneously to the midline, and laid over the repair as a vascularized buttress. Key: keep the posterior pedicle for anterior or urethral targets such as vesicovaginal fistula, urethral diverticulum, and female urethroplasty; keep the anterior pedicle for posterior targets such as rectovaginal fistula. The right labium is the default for its greater vascular density; the skin is preserved and no drain is needed.">
<defs>
<marker id="mf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
</defs>
