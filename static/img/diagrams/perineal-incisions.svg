<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 432" width="820" height="432" role="img" aria-label="Three stylized perineal fields comparing the midline vertical, inverted-U, and lambda urethroplasty skin incisions, colour-coded by wound-complication rate, with the midline vertical marked preferred.">
<rect x="1" y="1" width="818" height="430" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="40" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Perineal skin incisions for bulbar / posterior urethroplasty</text>
<text x="40" y="59" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">the midline vertical incision is the contemporary default — lowest wound-complication rate, fewest neurovascular structures injured</text>
<ellipse cx="178" cy="208" rx="66" ry="104" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
<line x1="178" y1="120" x2="178" y2="296" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 4"/>
<circle cx="178" cy="300" r="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
<path d="M 178 132 L 178 282" fill="none" stroke="#16A34A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="144" y="86" width="68" height="19" rx="9.5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
<text x="178" y="99" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#166534">preferred</text>
<text x="178" y="350" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#16A34A" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Midline vertical</text>
<text x="178" y="369" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">SSI 1.9–3.1%</text>
<ellipse cx="410" cy="208" rx="66" ry="104" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
<line x1="410" y1="120" x2="410" y2="296" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 4"/>
<circle cx="410" cy="300" r="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
<path d="M 372 282 L 372 168 Q 372 132 410 132 Q 448 132 448 168 L 448 282" fill="none" stroke="#EA580C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="410" y="350" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#EA580C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Inverted-U</text>
<text x="410" y="369" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">SSI 16–19%</text>
<ellipse cx="642" cy="208" rx="66" ry="104" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
<line x1="642" y1="120" x2="642" y2="296" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 4"/>
<circle cx="642" cy="300" r="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
<path d="M 642 282 L 642 190 L 604 140 M 642 190 L 680 140" fill="none" stroke="#DC2626" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="642" y="350" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#DC2626" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Lambda (LPI)</text>
<text x="642" y="369" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">wound comp. ~23%</text>
<text x="410" y="408" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">perineum viewed from below — anterior (scrotum) above, posterior (anus, &#9679;) below</text>
</svg>
