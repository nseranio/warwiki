<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 412" width="820" height="412" role="img" aria-label="Anatomical enucleation of the prostate in two panels. The axial cross-section shows the transition-zone adenoma as two lateral lobes plus a posterior median lobe compressing the central urethra, all enclosed by the fibrous surgical capsule; a dashed enucleation plane runs between adenoma and capsule, with perforating vessels crossing it and an instrument developing the plane, the capsule left behind. The sagittal panel shows the bladder, bladder neck, prostate, prostatic urethra with the verumontanum as the distal safety landmark, the external sphincter below the apex, and a retrograde arrow enucleating from apex toward the bladder neck.">
