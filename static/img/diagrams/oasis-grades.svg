<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 446" width="820" height="446" role="img" aria-label="Depth ladder of perineal laceration grades: tissue planes stacked by depth (perineal skin/mucosa, perineal muscles, external anal sphincter, internal anal sphincter, anorectal epithelium) with a severity bar for each grade (1, 2, 3a, 3b, 3c, 4) showing how deep the tear extends.">
<defs>
<marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L5,9 L10,0" fill="none" stroke="#64748B" stroke-width="1.6"/></marker>
</defs>
<rect x="1" y="1" width="818" height="444" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="40" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Perineal laceration grades &#8212; depth of injury</text>
<text x="40" y="59" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">Sultan classification (ACOG / RCOG); the third-degree tier (OASIS) is subclassified by anal-sphincter involvement</text>
<line x1="58" y1="122" x2="58" y2="344" stroke="#64748B" stroke-width="1.4" marker-end="url(#dn)"/>
<text transform="translate(48,230) rotate(-90)" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">increasing depth</text>
<rect x="150" y="116" width="302" height="44" fill="#F1F5F9" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="164" y="142" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Perineal skin / vaginal mucosa</text>
<rect x="150" y="160" width="302" height="46" fill="#E6EDF4" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="164" y="181" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Perineal muscles</text>
<text x="164" y="196" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">bulbospongiosus · transverse perinei</text>
<rect x="150" y="206" width="302" height="50" fill="#DBE6F0" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="164" y="229" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">External anal sphincter (EAS)</text>
<text x="164" y="244" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">3a &lt; 50% · 3b &gt; 50% thickness</text>
<line x1="150" y1="231" x2="452" y2="231" stroke="#64748B" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="150" y="256" width="302" height="44" fill="#D0DEEC" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="164" y="282" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Internal anal sphincter (IAS)</text>
<rect x="150" y="300" width="302" height="44" fill="#C6D8EA" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="164" y="326" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Anorectal epithelium</text>
<line x1="452" y1="160" x2="710" y2="160" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="452" y1="206" x2="710" y2="206" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="452" y1="256" x2="710" y2="256" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="452" y1="300" x2="710" y2="300" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="452" y1="344" x2="710" y2="344" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 4"/>
<text x="610" y="102" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B">how deep each grade reaches</text>
<line x1="498" y1="116" x2="720" y2="116" stroke="#64748B" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="506" y="116" width="26" height="44" rx="4" fill="#16A34A" opacity="0.88"/>
<text x="519" y="134" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1°</text>
<rect x="542" y="116" width="26" height="90" rx="4" fill="#4D7C0F" opacity="0.88"/>
<text x="555" y="134" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2°</text>
<rect x="578" y="116" width="26" height="115" rx="4" fill="#D97706" opacity="0.88"/>
<text x="591" y="134" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3a</text>
<rect x="614" y="116" width="26" height="140" rx="4" fill="#EA580C" opacity="0.88"/>
<text x="627" y="134" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3b</text>
<rect x="650" y="116" width="26" height="184" rx="4" fill="#DC2626" opacity="0.88"/>
<text x="663" y="134" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3c</text>
<rect x="686" y="116" width="26" height="228" rx="4" fill="#991B1B" opacity="0.88"/>
<text x="699" y="134" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4°</text>
</svg>
