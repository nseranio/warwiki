<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">both excise the tract, close bladder and vagina as separate layers, and interpose omentum &#8212; the difference is the access</text>
