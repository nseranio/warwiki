<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 412" width="820" height="412" role="img" aria-label="Transabdominal vesicovaginal fistula repair comparing two approaches. The extravesical panel shows the bladder left intact and unopened while the vesicovaginal space is dissected from outside, the tract excised, and the bladder base and vagina closed as separate layers with omentum interposed between them. The O'Conor transvesical panel shows the bladder bivalved by a sagittal cystotomy down to the fistula, exposing both ureteral orifices and the fistula from inside, before separate layered closure of vagina and bladder with omental interposition. Both interpose omentum between the non-overlapping suture lines.">
<defs>
<marker id="th" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
