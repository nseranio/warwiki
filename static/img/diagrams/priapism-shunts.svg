<text x="110" y="236" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">saphenous vein</text>
