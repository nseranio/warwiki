<line x1="640" y1="127" x2="664" y2="127" stroke="#B91C1C" stroke-width="2.4" marker-end="url(#bld)"/>
<text x="636" y="80" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">distal corporoglanular shunt</text>
<line x1="636" y1="84" x2="632" y2="115" stroke="#64748B" stroke-width="1"/>
