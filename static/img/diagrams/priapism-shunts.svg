<path d="M 70 234 C 124 234 150 200 170 168 C 186 142 196 126 210 106" fill="none" stroke="#2F6DB3" stroke-width="7" stroke-linecap="round"/>
<path d="M 70 234 C 124 234 150 200 170 168 C 186 142 196 126 210 106" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="1 8" stroke-linecap="round"/>
