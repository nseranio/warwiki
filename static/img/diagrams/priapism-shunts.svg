<text x="196" y="270" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B">&#8212; smallest to largest opening</text>
<rect x="128" y="290" width="44" height="44" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
<circle cx="150" cy="312" r="3.4" fill="#6E3D4C"/>
<text x="150" y="354" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Winter</text>
<text x="150" y="367" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">needle core</text>
<rect x="298" y="290" width="44" height="44" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
<line x1="320" y1="303" x2="320" y2="321" stroke="#6E3D4C" stroke-width="3.4" stroke-linecap="round"/>
<text x="320" y="354" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">Ebbehoj</text>
<text x="320" y="367" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">blade stab</text>
<rect x="468" y="290" width="44" height="44" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
