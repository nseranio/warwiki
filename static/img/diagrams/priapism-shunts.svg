<text x="312" y="100" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6E3D4C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round">corpus cavernosum (ischemic)</text>
