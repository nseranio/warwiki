<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="Surgical shunts for ischemic priapism on one longitudinal penile schematic from proximal crus on the left to glans on the right. The corpus cavernosum is drawn dark with ischemic blood; the corpus spongiosum and urethra run ventrally to the glans. A distal corporoglanular shunt opens a window at the corpus-cavernosum-to-glans junction draining dark blood out; the Burnett snake maneuver passes a Hegar dilator from that distal window down the corpus to the crus. Proximally, the Quackels shunt opens a cavernosum-to-spongiosum window and the Grayhack shunt grafts a saphenous vein to the corpus cavernosum. An inset compares the four distal tunical windows from smallest to largest: Winter needle core, Ebbehoj blade stab, T-shunt cruciate, and Al-Ghorab excised disc.">
<defs>
<marker id="bld" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
<marker id="stl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="gn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
</defs>
<rect x="1" y="1" width="818" height="428" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Surgical shunts for ischemic priapism</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">drainage routes from the congested corpus cavernosum, drawn on one organ &#8212; proximal crus (left) to glans (right)</text>
<path d="M 156 104 L 156 150 L 104 141 C 96 133 96 121 104 111 Z" fill="#6E3D4C" stroke="#4A2733" stroke-width="2"/>
