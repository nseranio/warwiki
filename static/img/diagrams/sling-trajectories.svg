<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="Anterior-pelvis view comparing three midurethral-sling trajectories around the pubic symphysis and obturator foramina. All place a tension-free tape as a hammock under the midurethra. The retropubic (TVT) route passes behind the pubis to a suprapubic exit, carrying bladder-perforation and vascular risk so cystoscopy is mandatory. The transobturator (TOT) route passes through the obturator foramen to a groin exit, with less bladder injury but more groin and thigh pain. The single-incision (SIMS) route is anchored in the obturator internus with no skin exit and the least pain. Key notes comparable cure rates and non-inferior modern single-incision slings.">
<rect x="1" y="1" width="858" height="468" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="36" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Midurethral sling &#8212; three trajectories, one hammock</text>
<text x="40" y="55" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">anterior-pelvis view: same suburethral sling, different passage (and different risks)</text>
<rect x="331" y="150" width="18" height="46" rx="4" fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.4"/>
<text x="340" y="142" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">pubic symphysis</text>
<path d="M 334 156
    C 270 150, 192 168, 188 212
    C 186 300, 252 332, 274 326
    C 322 318, 330 250, 332 200 Z"
    fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.4" stroke-linejoin="round"/>
<ellipse cx="244" cy="248" rx="34" ry="48" fill="#FFFFFF" stroke="#B6A98C" stroke-width="1.3"/>
<text x="244" y="250" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">obturator</text>
<text x="244" y="261" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">foramen</text>
<path d="M 346 156
    C 410 150, 488 168, 492 212
    C 494 300, 428 332, 406 326
    C 358 318, 350 250, 348 200 Z"
    fill="#ECE4D4" stroke="#B6A98C" stroke-width="1.4" stroke-linejoin="round"/>
<ellipse cx="436" cy="248" rx="34" ry="48" fill="#FFFFFF" stroke="#B6A98C" stroke-width="1.3"/>
<text x="436" y="250" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">obturator</text>
<text x="436" y="261" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#B6A98C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">foramen</text>
<rect x="331" y="214" width="18" height="92" rx="9" fill="#64748B"/>
<rect x="337" y="214" width="6" height="92" rx="3" fill="#FFFFFF"/>
<text x="340" y="322" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">urethra</text>
<path d="M 300 292 Q 340 308 380 292" fill="none" stroke="#185FA5" stroke-width="5" stroke-linecap="round"/>
<text x="340" y="324" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#185FA5" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">suburethral sling</text>
<path d="M 314 286 C 310 230, 316 150, 310 96" fill="none" stroke="#B91C1C" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="310" cy="96" r="3.4" fill="#B91C1C"/>
<path d="M 366 286 C 370 230, 364 150, 370 96" fill="none" stroke="#B91C1C" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="370" cy="96" r="3.4" fill="#B91C1C"/>
<text x="340" y="88" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">retropubic exit (suprapubic)</text>
<path d="M 310 288 C 280 292, 244 268, 190 250" fill="none" stroke="#0F766E" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="190" cy="250" r="3.4" fill="#0F766E"/>
<path d="M 370 288 C 400 292, 436 268, 490 250" fill="none" stroke="#0F766E" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="490" cy="250" r="3.4" fill="#0F766E"/>
<text x="190" y="234" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">groin</text>
<text x="490" y="234" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">groin</text>
<path d="M 312 288 C 296 286, 284 262, 276 250" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 280 244 l -8 0 l 4 10 z" fill="#B45309"/>
<path d="M 368 288 C 384 286, 396 262, 404 250" fill="none" stroke="#B45309" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 400 244 l 8 0 l -4 10 z" fill="#B45309"/>
<rect x="584" y="104" width="244" height="206" rx="12" fill="#F8FAFC" stroke="#EAEDF1" stroke-width="1.2"/>
<text x="600" y="124" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Route &#8594; trade-off</text>
<line x1="600" y1="154" x2="622" y2="154" stroke="#B91C1C" stroke-width="3.4" stroke-linecap="round"/>
<text x="630" y="151" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Retropubic (TVT)</text>
<text x="630" y="165" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">behind pubis; bladder-perf</text>
<text x="630" y="177" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">and vascular risk &#8594; do cysto</text>
<line x1="600" y1="204" x2="622" y2="204" stroke="#0F766E" stroke-width="3.4" stroke-linecap="round"/>
<text x="630" y="201" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Transobturator (TOT)</text>
<text x="630" y="215" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">through foramen; less bladder</text>
<text x="630" y="227" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">injury, more groin/thigh pain</text>
<line x1="600" y1="254" x2="622" y2="254" stroke="#B45309" stroke-width="3.4" stroke-linecap="round"/>
<text x="630" y="251" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">Single-incision (SIMS)</text>
<text x="630" y="265" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">anchored in obturator</text>
<text x="630" y="277" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">internus; no exit, least pain</text>
<line x1="40" y1="402" x2="820" y2="402" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="422" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E293B">All three place a tension-free polypropylene tape at the midurethra; they differ only in how the arms are passed and anchored.</text>
<text x="40" y="440" text-anchor="start" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Retropubic and transobturator have comparable cure; modern SIMS (e.g., Altis) are non-inferior in trials. Cystoscopy is mandatory after the retropubic pass.</text>
</svg>
