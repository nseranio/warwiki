<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 421" width="860" height="421" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Midurethral sling trajectories</title>
<desc id="figure-description">Retropubic arms travel behind the pubis toward suprapubic exits; transobturator arms traverse the obturator region toward the groin; single-incision designs anchor without an external exit. Directions, anchors and comparative harms depend on the device; the diagram is not a trocar-passage guide. View: Female pelvis, anterior conceptual view. Scale: Conceptual schematic; not to scale. Units: No measured geometry; any dimensions are illustrative. Clinical review pending; no named clinician has signed off. Concept sources: FDA: stress urinary incontinence and surgical mesh (web overview accessed September 2026), https://www.fda.gov/medical-devices/urogynecologic-surgical-mesh-implants/stress-urinary-incontinence-sui; access: official full text; Retropubic, transobturator and single-incision routes. No universal least-pain ranking is inferred. WARWIKI original vector schematic; individual illustrator not recorded. No separate figure reuse license recorded; linked sources are concept references, not artwork licenses.</desc>
