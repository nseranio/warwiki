<svg xmlns="http://www.w3.org/2000/svg" width="840" height="580" viewBox="0 0 840 580" role="img" aria-labelledby="title desc">
  <title id="title">Wound healing: four overlapping processes</title>
  <desc id="desc">Hemostasis forms a platelet and fibrin scaffold. Inflammation clears damaged tissue and coordinates repair. Proliferation restores epithelium, matrix and vessels. Remodeling reorganizes collagen and matures the scar. These processes overlap; the diagram does not give a healing timetable.</desc>
  <rect width="840" height="580" rx="18" fill="#f4f7fb"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="32" y="48" font-size="28" font-weight="700" fill="#142840">Wound healing</text>
    <text x="32" y="79" font-size="19" fill="#475569">Four overlapping processes</text>
    <g stroke="#cbd5e1" stroke-width="2"><path d="M62 148V461"/></g>
    <g>
      <rect x="96" y="112" width="710" height="86" rx="12" fill="#fff"/>
      <circle cx="62" cy="155" r="23" fill="#a63b3b"/>
      <text x="62" y="163" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
      <text x="118" y="146" font-size="23" font-weight="700" fill="#142840">Hemostasis</text>
      <text x="118" y="176" font-size="19" fill="#475569">Platelets and fibrin limit bleeding and form a scaffold.</text>
    </g>
    <g>
      <rect x="96" y="214" width="710" height="86" rx="12" fill="#fff"/>
      <circle cx="62" cy="257" r="23" fill="#9a5b10"/>
      <text x="62" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
      <text x="118" y="248" font-size="23" font-weight="700" fill="#142840">Inflammation</text>
      <text x="118" y="278" font-size="19" fill="#475569">Immune cells clear debris and coordinate repair.</text>
    </g>
    <g>
      <rect x="96" y="316" width="710" height="86" rx="12" fill="#fff"/>
      <circle cx="62" cy="359" r="23" fill="#167367"/>
      <text x="62" y="367" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
      <text x="118" y="350" font-size="23" font-weight="700" fill="#142840">Proliferation</text>
      <text x="118" y="380" font-size="19" fill="#475569">Epithelium, matrix and vessels restore tissue cover.</text>
    </g>
    <g>
      <rect x="96" y="418" width="710" height="86" rx="12" fill="#fff"/>
      <circle cx="62" cy="461" r="23" fill="#4b60a5"/>
      <text x="62" y="469" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
      <text x="118" y="452" font-size="23" font-weight="700" fill="#142840">Remodeling</text>
      <text x="118" y="482" font-size="19" fill="#475569">Collagen reorganizes; scar strength and form mature.</text>
    </g>
    <text x="32" y="546" font-size="18" fill="#475569">Processes overlap. Timing depends on the tissue and wound.</text>
  </g>
</svg>
