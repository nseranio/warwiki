name: External link check

on:
  schedule:
    # Monthly, independently of Vercel builds.
    - cron: '13 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-link-check
  cancel-in-progress: false

jobs:
  sample-external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sample 200 external links
        run: node scripts/check-external-links.js --sample 200 --json > external-link-report.json
      - name: Upload report even when links fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: external-link-report.json
          retention-days: 90
          if-no-files-found: error
