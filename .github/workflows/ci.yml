name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['reports/**', 'AGENTS.md', 'CLAUDE.md', 'CHANGELOG.md']
  pull_request:
    branches: [main]
    paths-ignore: ['reports/**', 'AGENTS.md', 'CLAUDE.md', 'CHANGELOG.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (scope + citations + orphans + links + density)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Maintenance tool tests
        run: npm run test:maintenance

      - name: Build
        run: npm run build

      - name: Deployment size inventory
        run: npm run audit:size -- --max-mb=200

      - name: Freshness advisory (non-blocking)
        run: npm run lint:freshness || true
