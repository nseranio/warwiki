name: CI

on:
  push:
    branches: [main]
    # Authoring notes skip CI, but claim-gate inputs under reports/ (ledger, exceptions, baseline) must run it.
    paths: ['**', '!reports/**', '!AGENTS.md', '!CLAUDE.md', '!CHANGELOG.md', '!RESUME-HERE.md', '!OPEN-EVIDENCE-PROMPT.md', '!EPIC-ROADMAP.md',
            'reports/audit-v2/claims-ledger.json', 'reports/audit-v2/claim-exceptions.json', 'reports/audit-v2/claims-baseline.json', 'reports/audit-v2/verdicts.json']
  pull_request:
    branches: [main]
    # Authoring notes skip CI, but claim-gate inputs under reports/ (ledger, exceptions, baseline) must run it.
    paths: ['**', '!reports/**', '!AGENTS.md', '!CLAUDE.md', '!CHANGELOG.md', '!RESUME-HERE.md', '!OPEN-EVIDENCE-PROMPT.md', '!EPIC-ROADMAP.md',
            'reports/audit-v2/claims-ledger.json', 'reports/audit-v2/claim-exceptions.json', 'reports/audit-v2/claims-baseline.json', 'reports/audit-v2/verdicts.json']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (scope + citations + orphans + links + density)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Maintenance tool tests
        run: npm run test:maintenance

      - name: Build
        run: npm run build

      - name: Freshness advisory (non-blocking)
        run: npm run lint:freshness || true

      # Browser tests against the built site: every sitemap page loads and
      # hydrates without console errors, two-timezone hydration check, search,
      # citation previews, figure dialogs, shareable filter URLs. Blocking since
      # October 3 (clean CI runs 6261ba83 and 05fbb1cb); CI retries a failing
      # test once before failing the job.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        id: e2e
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
