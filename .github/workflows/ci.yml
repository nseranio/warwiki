name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['reports/**', 'AGENTS.md', 'CLAUDE.md', 'CHANGELOG.md', 'RESUME-HERE.md', 'OPEN-EVIDENCE-PROMPT.md', 'EPIC-ROADMAP.md']
  pull_request:
    branches: [main]
    paths-ignore: ['reports/**', 'AGENTS.md', 'CLAUDE.md', 'CHANGELOG.md', 'RESUME-HERE.md', 'OPEN-EVIDENCE-PROMPT.md', 'EPIC-ROADMAP.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (scope + citations + orphans + links + density)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Maintenance tool tests
        run: npm run test:maintenance

      - name: Build
        run: npm run build

      - name: Freshness advisory (non-blocking)
        run: npm run lint:freshness || true

      # Browser tests against the built site: every sitemap page loads and
      # hydrates without console errors, two-timezone hydration check, search,
      # citation previews, figure dialogs. Non-blocking while timings settle in
      # CI; make blocking once a few runs are clean.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (non-blocking for now)
        id: e2e
        continue-on-error: true
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
